<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON DRIFT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05060e;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfe9ff;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;position:fixed;inset:0}
  #overlay{position:fixed;inset:0;display:grid;place-items:center;text-align:center;
    background:radial-gradient(circle at 50% 45%,rgba(5,6,14,.45),rgba(5,6,14,.94));
    transition:opacity .35s ease;z-index:10;padding:24px}
  #overlay.hide{opacity:0;pointer-events:none}
  .panel{max-width:640px}
  h1{font-size:clamp(34px,8vw,68px);letter-spacing:.16em;color:#8ffcff;
    text-shadow:0 0 14px #35e6ff,0 0 42px #0d8ecf,0 0 80px #0a5a8a;margin-bottom:12px}
  .sub{color:#7fb6d9;letter-spacing:.13em;font-size:clamp(10px,2.5vw,13px);
    line-height:2.1;margin-bottom:28px;text-transform:uppercase}
  .key{color:#ffd166}
  button{font:inherit;font-size:15px;letter-spacing:.2em;padding:14px 36px;color:#031018;
    background:linear-gradient(180deg,#8ffcff,#35d4ff);border:0;border-radius:999px;cursor:pointer;
    box-shadow:0 0 24px rgba(53,212,255,.7);transition:transform .15s,box-shadow .15s}
  button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 42px rgba(53,212,255,.95)}
  .best{margin-top:20px;color:#5f89a8;font-size:12px;letter-spacing:.18em}

  #muteBtn{
    position:fixed;right:18px;bottom:18px;z-index:20;
    font:inherit;font-size:11px;letter-spacing:.18em;padding:9px 16px;
    border-radius:999px;cursor:pointer;
    background:rgba(10,20,32,.62);
    color:#7fb6d9;
    border:1px solid rgba(90,170,220,.35);
    box-shadow:none;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:color .2s,border-color .2s,background .2s;
  }
  #muteBtn:hover{transform:none;box-shadow:none;color:#8ffcff;
    border-color:rgba(143,252,255,.6);background:rgba(14,32,50,.8)}
  #muteBtn.off{color:#ff5fd2;border-color:rgba(255,95,210,.5)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="panel">
    <h1 id="ovTitle">NEON DRIFT</h1>
    <div class="sub" id="ovSub"></div>
    <button id="ovBtn">START</button>
    <div class="best" id="ovBest"></div>
  </div>
</div>
<button id="muteBtn">♪ SOUND ON</button>
<script>
(() => {
'use strict';

/* ============================================================
   AUDIO ENGINE — fully procedural (no external files)
   ============================================================ */
const Sound = (() => {
  let ctx = null;
  let ready = false;
  let muted = false;

  let master, comp, sfxBus, musicBus, musicFilter;
  let reverbSend, reverbReturn, convolver;
  let noiseBuf = null;

  let musicPlaying = false;
  let musicTimer = null;
  let step = 0;
  let nextTime = 0;

  // ---- music configuration ----
  const BPM = 68;
  const STEP = 60 / BPM / 2;          // eighth notes
  const STEPS_PER_CHORD = 16;
  const CHORDS = [                     // MIDI note sets: Am - F - C - G
    [57, 60, 64, 67],
    [53, 57, 60, 65],
    [48, 55, 60, 64],
    [55, 59, 62, 67]
  ];

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  try { muted = localStorage.getItem('neondrift.muted') === '1'; } catch (e) {}

  // ---------- buffers ----------
  function makeNoise(seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function makeImpulse(seconds, decay) {
    const rate = ctx.sampleRate;
    const len = Math.floor(rate * seconds);
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        // slight early-reflection shaping for a wider hall
        const shape = Math.pow(1 - t, decay) * (1 - 0.35 * Math.sin(t * 40));
        d[i] = (Math.random() * 2 - 1) * shape;
      }
    }
    return buf;
  }

  // ---------- init ----------
  function init() {
    if (ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { return; }

    // master chain: everything -> master -> compressor -> output
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.knee.value = 22;
    comp.ratio.value = 8;
    comp.attack.value = 0.004;
    comp.release.value = 0.28;
    comp.connect(ctx.destination);

    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.85;
    master.connect(comp);

    // ---- reverb ----
    convolver = ctx.createConvolver();
    convolver.buffer = makeImpulse(3.6, 2.4);
    reverbReturn = ctx.createGain();
    reverbReturn.gain.value = 0.85;
    reverbReturn.connect(master);
    convolver.connect(reverbReturn);

    reverbSend = ctx.createGain();
    reverbSend.gain.value = 1;
    reverbSend.connect(convolver);

    // ---- buses ----
    sfxBus = ctx.createGain();
    sfxBus.gain.value = 0.62;
    sfxBus.connect(master);

    // music passes through a slowly sweeping lowpass for a drifting feel
    musicFilter = ctx.createBiquadFilter();
    musicFilter.type = 'lowpass';
    musicFilter.frequency.value = 2200;
    musicFilter.Q.value = 0.6;
    musicFilter.connect(master);

    musicBus = ctx.createGain();
    musicBus.gain.value = 0.0001;
    musicBus.connect(musicFilter);

    // slow filter LFO — gives the pad a breathing, oceanic quality
    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.045;
    const lfoAmt = ctx.createGain();
    lfoAmt.gain.value = 1000;
    lfo.connect(lfoAmt);
    lfoAmt.connect(musicFilter.frequency);
    lfo.start();

    noiseBuf = makeNoise(2.5);
    ready = true;
  }

  // ---------- unlock (must be called from a user gesture) ----------
  function unlock() {
    init();
    if (!ctx) return;
    if (ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
  }

  // ---------- helpers ----------
  function now() { return ctx.currentTime; }

  function env(g, t, peak, attack, decay, sustainLevel, sustainTime, release) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack);
    if (sustainTime > 0) {
      g.gain.exponentialRampToValueAtTime(Math.max(sustainLevel, 0.0002), t + attack + decay);
      g.gain.setValueAtTime(Math.max(sustainLevel, 0.0002), t + attack + decay + sustainTime);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay + sustainTime + release);
    } else {
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }
  }

  function sendReverb(node, amount) {
    const g = ctx.createGain();
    g.gain.value = amount;
    node.connect(g);
    g.connect(reverbSend);
    return g;
  }

  function noiseSource(t, offsetMax) {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    s.playbackRate.value = 0.85 + Math.random() * 0.3;
    const off = offsetMax ? Math.random() * offsetMax : 0;
    s._offset = off;
    return s;
  }

  // ============================================================
  //  MUSIC
  // ============================================================
  function startMusic() {
    if (!ready || musicPlaying) return;
    musicPlaying = true;
    step = 0;
    nextTime = now() + 0.08;

    musicBus.gain.cancelScheduledValues(now());
    musicBus.gain.setValueAtTime(0.0001, now());
    musicBus.gain.setTargetAtTime(0.5, now(), 2.2);

    musicTimer = setInterval(schedule, 55);
  }

  function stopMusic() {
    if (!musicPlaying) return;
    musicPlaying = false;
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    if (!ready) return;
    musicBus.gain.cancelScheduledValues(now());
    musicBus.gain.setTargetAtTime(0.0001, now(), 1.2);
  }

  function duckMusic(amount, time) {
    if (!ready || !musicPlaying) return;
    const t = now();
    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setTargetAtTime(amount, t, 0.06);
    musicBus.gain.setTargetAtTime(0.5, t + time, 1.1);
  }

  function schedule() {
    if (!ready || !musicPlaying) return;
    const lookahead = 0.4;
    let guard = 0;
    while (nextTime < now() + lookahead && guard++ < 64) {
      playStep(step, nextTime);
      nextTime += STEP;
      step++;
    }
  }

  function playStep(s, t) {
    const chordIdx = Math.floor(s / STEPS_PER_CHORD) % CHORDS.length;
    const local = s % STEPS_PER_CHORD;
    const chord = CHORDS[chordIdx];

    // ---- pad on chord change ----
    if (local === 0) playPad(chord, t);

    // ---- bass ----
    if (local === 0 || local === 6 || local === 11) {
      playBass(chord[0] - 12, t, local === 0 ? 0.26 : 0.16);
    }

    // ---- arpeggio / sparkles ----
    if (local % 2 === 0 && Math.random() < 0.62) {
      const n = chord[Math.floor(Math.random() * chord.length)] + 12;
      playPluck(n, t, rand(0.045, 0.085));
    }
    if (local === 9 && Math.random() < 0.45) {
      playPluck(chord[0] + 24, t, 0.035);
    }
    if (local === 14 && Math.random() < 0.3) {
      playPluck(chord[2] + 24, t + STEP * 0.5, 0.03);
    }
  }

  function playPad(chord, t) {
    const dur = STEP * STEPS_PER_CHORD;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 850 + Math.random() * 250;
    filt.Q.value = 0.8;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.075, t + 2.0);
    g.gain.setValueAtTime(0.075, t + dur - 1.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 1.6);

    filt.connect(g);
    g.connect(musicBus);
    sendReverb(g, 0.75);

    for (const m of chord) {
      for (const det of [-7, 7]) {
        const o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = mtof(m);
        o.detune.value = det + (Math.random() * 3 - 1.5);
        o.connect(filt);
        o.start(t);
        o.stop(t + dur + 1.7);
      }
    }
  }

  function playBass(m, t, vol) {
    const o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = mtof(m);

    const sub = ctx.createOscillator();
    sub.type = 'sine';
    sub.frequency.value = mtof(m) * 0.5;

    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 320;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.1);

    o.connect(f);
    sub.connect(f);
    f.connect(g);
    g.connect(musicBus);

    o.start(t); sub.start(t);
    o.stop(t + 2.2); sub.stop(t + 2.2);
  }

  function playPluck(m, t, vol) {
    const o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = mtof(m);

    const o2 = ctx.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = mtof(m) * 2.005;

    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(4200, t);
    f.frequency.exponentialRampToValueAtTime(700, t + 1.3);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);

    o.connect(f); o2.connect(f);
    f.connect(g);
    g.connect(musicBus);
    sendReverb(g, 1.0);

    o.start(t); o2.start(t);
    o.stop(t + 1.6); o2.stop(t + 1.6);
  }

  // ============================================================
  //  SFX
  // ============================================================
  function sfxShoot() {
    if (!ready || muted) return;
    const t = now();

    const o = ctx.createOscillator();
    o.type = 'square';
    o.frequency.setValueAtTime(1250 + Math.random() * 120, t);
    o.frequency.exponentialRampToValueAtTime(320, t + 0.09);

    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 1600;
    f.Q.value = 1.3;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.11, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);

    o.connect(f); f.connect(g); g.connect(sfxBus);
    sendReverb(g, 0.12);

    o.start(t); o.stop(t + 0.12);
  }

  function sfxExplosion(tier) {
    if (!ready || muted) return;
    const t = now();
    const big = clamp(tier / 3, 0.33, 1);
    const dur = 0.22 + big * 0.45;

    // --- noise body ---
    const src = noiseSource(t, 1.6);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(2400 * (0.55 + big * 0.7), t);
    f.frequency.exponentialRampToValueAtTime(110, t + dur);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3 * (0.45 + big * 0.6), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.connect(f); f.connect(g); g.connect(sfxBus);
    sendReverb(g, 0.35 + big * 0.45);

    src.start(t, src._offset);
    src.stop(t + dur + 0.06);

    // --- low thump ---
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(170 - big * 65, t);
    o.frequency.exponentialRampToValueAtTime(38, t + dur * 0.9);

    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.22 * (0.5 + big * 0.6), t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o.connect(g2); g2.connect(sfxBus);
    o.start(t); o.stop(t + dur + 0.03);
  }

  function sfxHit() {
    if (!ready || muted) return;
    const t = now();

    // descending saw
    const o = ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(430, t);
    o.frequency.exponentialRampToValueAtTime(58, t + 0.55);

    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(2200, t);
    f.frequency.exponentialRampToValueAtTime(180, t + 0.55);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);

    o.connect(f); f.connect(g); g.connect(sfxBus);
    sendReverb(g, 0.55);
    o.start(t); o.stop(t + 0.65);

    // noise impact
    const src = noiseSource(t, 1.2);
    const nf = ctx.createBiquadFilter();
    nf.type = 'bandpass';
    nf.frequency.setValueAtTime(900, t);
    nf.frequency.exponentialRampToValueAtTime(200, t + 0.3);
    nf.Q.value = 0.9;

    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.24, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);

    src.connect(nf); nf.connect(ng); ng.connect(sfxBus);
    sendReverb(ng, 0.4);
    src.start(t, src._offset); src.stop(t + 0.35);

    duckMusic(0.24, 0.5);
  }

  function sfxDash() {
    if (!ready || muted) return;
    const t = now();

    const src = noiseSource(t, 1.5);
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 4.5;
    f.frequency.setValueAtTime(280, t);
    f.frequency.exponentialRampToValueAtTime(3200, t + 0.16);
    f.frequency.exponentialRampToValueAtTime(480, t + 0.36);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.19, t + 0.045);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);

    src.connect(f); f.connect(g); g.connect(sfxBus);
    sendReverb(g, 0.5);
    src.start(t, src._offset);
    src.stop(t + 0.4);

    // subtle sub whoosh
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(220, t + 0.2);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.1, t + 0.05);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(og); og.connect(sfxBus);
    o.start(t); o.stop(t + 0.32);
  }

  function sfxPowerup(type) {
    if (!ready || muted) return;
    const t0 = now();
    const notes = type === 'heal'
      ? [72, 76, 79, 84]
      : [67, 71, 74, 79];

    notes.forEach((m, i) => {
      const t = t0 + i * 0.058;
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = mtof(m);

      const o2 = ctx.createOscillator();
      o2.type = 'triangle';
      o2.frequency.value = mtof(m) * 2;

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);

      o.connect(g); o2.connect(g);
      g.connect(sfxBus);
      sendReverb(g, 0.65);

      o.start(t); o2.start(t);
      o.stop(t + 0.42); o2.stop(t + 0.42);
    });
  }

  function sfxWave() {
    if (!ready || muted) return;
    const t0 = now();
    const notes = [57, 64, 69, 76, 81];

    notes.forEach((m, i) => {
      const t = t0 + i * 0.11;
      const o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.value = mtof(m);

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.11, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);

      o.connect(g); g.connect(sfxBus);
      sendReverb(g, 1.0);
      o.start(t); o.stop(t + 1.2);
    });

    // airy swell
    const src = noiseSource(t0, 0.5);
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 1.6;
    f.frequency.setValueAtTime(400, t0);
    f.frequency.exponentialRampToValueAtTime(3400, t0 + 1.1);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.07, t0 + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);

    src.connect(f); f.connect(g); g.connect(sfxBus);
    sendReverb(g, 1.0);
    src.start(t0, src._offset);
    src.stop(t0 + 1.5);
  }

  function sfxGameOver() {
    if (!ready || muted) return;
    const t0 = now();

    // descending low drone
    [45, 43, 41, 36].forEach((m, i) => {
      const t = t0 + i * 0.22;
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = mtof(m);

      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(900, t);
      f.frequency.exponentialRampToValueAtTime(220, t + 2.2);

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.15);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);

      o.connect(f); f.connect(g); g.connect(sfxBus);
      sendReverb(g, 1.0);
      o.start(t); o.stop(t + 2.8);
    });

    // big reverse-ish boom
    const src = noiseSource(t0, 1.0);
    const nf = ctx.createBiquadFilter();
    nf.type = 'lowpass';
    nf.frequency.setValueAtTime(1800, t0);
    nf.frequency.exponentialRampToValueAtTime(80, t0 + 2.4);

    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t0);
    ng.gain.exponentialRampToValueAtTime(0.3, t0 + 0.06);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.6);

    src.connect(nf); nf.connect(ng); ng.connect(sfxBus);
    sendReverb(ng, 1.0);
    src.start(t0, src._offset);
    src.stop(t0 + 2.7);
  }

  // ---------- public ----------
  function setMuted(v) {
    muted = !!v;
    if (ready && ctx) {
      master.gain.cancelScheduledValues(now());
      master.gain.setTargetAtTime(muted ? 0 : 0.85, now(), 0.05);
    }
    try { localStorage.setItem('neondrift.muted', muted ? '1' : '0'); } catch (e) {}
  }

  return {
    unlock,
    startMusic,
    stopMusic,
    setMuted,
    isMuted: () => muted,
    toggleMute: () => { setMuted(!muted); return muted; },
    shoot: sfxShoot,
    explosion: sfxExplosion,
    hit: sfxHit,
    dash: sfxDash,
    powerup: sfxPowerup,
    wave: sfxWave,
    gameOver: sfxGameOver
  };
})();

/* ============================================================
   GAME
   ============================================================ */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub   = document.getElementById('ovSub');
const ovBtn   = document.getElementById('ovBtn');
const ovBest  = document.getElementById('ovBest');
const muteBtn = document.getElementById('muteBtn');

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

let W = 0, H = 0, DPR = 1;

// ---------- state ----------
const keys = Object.create(null);
const mouse = { x: 0, y: 0, down: false };
let wantDash = false;

let player = null;
let bullets = [], asteroids = [], particles = [], powerups = [], stars = [];

const game = {
  state: 'menu',       // menu | play | over
  score: 0, best: 0,
  wave: 0, time: 0, shake: 0,
  waveTimer: 0, banner: null
};

try { game.best = Number(localStorage.getItem('neondrift.best')) || 0; } catch (e) {}

const ASTEROID_COLORS = ['#ffd166', '#ff8c42', '#ff4fa3'];
const CONTROLS_HTML =
  '<span class="key">WASD</span> move &nbsp;·&nbsp; ' +
  '<span class="key">MOUSE</span> aim &nbsp;·&nbsp; ' +
  '<span class="key">CLICK</span> shoot &nbsp;·&nbsp; ' +
  '<span class="key">SPACE</span> dash &nbsp;·&nbsp; ' +
  '<span class="key">M</span> mute';

// ---------- setup ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  makeStars();
}

function makeStars() {
  stars = [];
  const count = Math.round((W * H) / 9000);
  for (let i = 0; i < count; i++) {
    stars.push({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 1), s: rand(0.6, 1.8) });
  }
}

function newPlayer() {
  return {
    x: W / 2, y: H / 2, vx: 0, vy: 0,
    angle: -Math.PI / 2, r: 12,
    hp: 3, maxHp: 3,
    fireCd: 0, dashCd: 0, dashTime: 0,
    invuln: 2, triple: 0
  };
}

// ---------- asteroids ----------
function makeAsteroid(tier, x, y) {
  const r = [0, 15, 27, 46][tier];
  const n = randInt(8, 12);
  const verts = [];
  for (let i = 0; i < n; i++) verts.push(rand(0.76, 1.22));

  const speed = (30 + (4 - tier) * 22 + game.wave * 2) * rand(0.8, 1.2);
  const ang = rand(0, TAU);

  return {
    x, y, r, tier, verts,
    vx: Math.cos(ang) * speed,
    vy: Math.sin(ang) * speed,
    rot: rand(0, TAU),
    spin: rand(-1.3, 1.3),
    hp: tier,
    flash: 0
  };
}

function spawnAsteroidFromEdge(tier) {
  let x = 0, y = 0, tries = 0;
  do {
    const edge = randInt(0, 3);
    if (edge === 0)      { x = rand(0, W); y = -70; }
    else if (edge === 1) { x = W + 70;     y = rand(0, H); }
    else if (edge === 2) { x = rand(0, W); y = H + 70; }
    else                 { x = -70;        y = rand(0, H); }
    tries++;
  } while (Math.hypot(x - player.x, y - player.y) < 300 && tries < 24);
  return makeAsteroid(tier, x, y);
}

function destroyAsteroid(a, silent) {
  const i = asteroids.indexOf(a);
  if (i >= 0) asteroids.splice(i, 1);

  const col = ASTEROID_COLORS[a.tier - 1];
  burst(a.x, a.y, col, 8 + a.tier * 6, 90 + a.tier * 90, 0.75);
  game.shake = Math.max(game.shake, a.tier * 3.5);

  Sound.explosion(a.tier);

  if (silent) return;

  game.score += [0, 100, 50, 20][a.tier];

  if (a.tier > 1) {
    for (let k = 0; k < 2; k++) {
      const c = makeAsteroid(a.tier - 1, a.x + rand(-10, 10), a.y + rand(-10, 10));
      c.vx += a.vx * 0.45;
      c.vy += a.vy * 0.45;
      asteroids.push(c);
    }
  }

  if (Math.random() < 0.11) spawnPowerup(a.x, a.y);
}

// ---------- particles ----------
function burst(x, y, color, n, speed = 260, life = 0.7) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const s = rand(speed * 0.25, speed);
    const L = rand(life * 0.45, life);
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: L, max: L,
      r: rand(1.2, 3.4),
      color
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const damp = Math.pow(0.12, dt);
    p.vx *= damp;
    p.vy *= damp;
  }
}

// ---------- powerups ----------
function spawnPowerup(x, y) {
  const type = (player.hp < player.maxHp && Math.random() < 0.45) ? 'heal' : 'triple';
  powerups.push({
    x, y, vx: rand(-40, 40), vy: rand(-40, 40),
    r: 13, type, life: 14, rot: 0
  });
}

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    pu.life -= dt;
    pu.rot += dt * 1.8;
    if (pu.life <= 0) { powerups.splice(i, 1); continue; }

    const dx = player.x - pu.x, dy = player.y - pu.y;
    const d = Math.hypot(dx, dy) || 0.001;

    if (d < 160) {
      pu.vx += (dx / d) * 520 * dt;
      pu.vy += (dy / d) * 520 * dt;
    }
    const damp = Math.pow(0.4, dt);
    pu.vx *= damp; pu.vy *= damp;
    pu.x += pu.vx * dt; pu.y += pu.vy * dt;

    if (d < player.r + pu.r) {
      powerups.splice(i, 1);
      if (pu.type === 'heal') {
        player.hp = Math.min(player.maxHp, player.hp + 1);
        burst(pu.x, pu.y, '#5cff9d', 20, 240, 0.6);
      } else {
        player.triple = Math.min(14, player.triple + 8);
        burst(pu.x, pu.y, '#ffd166', 20, 240, 0.6);
      }
      Sound.powerup(pu.type);
      game.score += 25;
    }
  }
}

// ---------- player ----------
function shoot() {
  const p = player;
  const diag = Math.hypot(W, H);            // full corner-to-corner span
  const spread = p.triple > 0 ? [-0.17, 0, 0.17] : [0];
  for (const s of spread) {
    const a = p.angle + s;
    const vx = Math.cos(a) * 800 + p.vx * 0.25;
    const vy = Math.sin(a) * 800 + p.vy * 0.25;
    const spd = Math.hypot(vx, vy) || 800;
    bullets.push({
      x: p.x + Math.cos(a) * 18,
      y: p.y + Math.sin(a) * 18,
      vx, vy,
      r: 3,
      life: diag / spd + 0.05          // always reaches the far edge
    });
  }
  Sound.shoot();
  game.shake = Math.max(game.shake, 1.8);
}

function updatePlayer(dt) {
  const p = player;

  let ix = 0, iy = 0;
  if (keys['KeyA'] || keys['ArrowLeft'])  ix -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
  if (keys['KeyW'] || keys['ArrowUp'])    iy -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  iy += 1;
  const len = Math.hypot(ix, iy);
  if (len > 0) { ix /= len; iy /= len; }

  const ACC = 2600;
  p.vx += ix * ACC * dt;
  p.vy += iy * ACC * dt;

  const damp = Math.pow(0.0015, dt);
  p.vx *= damp; p.vy *= damp;

  // dash
  if (p.dashTime > 0) p.dashTime -= dt;
  if (wantDash && p.dashCd <= 0) {
    let dx = ix, dy = iy;
    if (len === 0) { dx = Math.cos(p.angle); dy = Math.sin(p.angle); }
    p.vx = dx * 980;
    p.vy = dy * 980;
    p.dashTime = 0.16;
    p.dashCd = 1.1;
    p.invuln = Math.max(p.invuln, 0.32);
    game.shake = Math.max(game.shake, 7);
    burst(p.x, p.y, '#7df9ff', 16, 260, 0.45);
    Sound.dash();
  }
  wantDash = false;

  const MAX = 370;
  const sp = Math.hypot(p.vx, p.vy);
  if (sp > MAX && p.dashTime <= 0) {
    p.vx = p.vx / sp * MAX;
    p.vy = p.vy / sp * MAX;
  }

  p.x += p.vx * dt;
  p.y += p.vy * dt;
  p.x = clamp(p.x, p.r, W - p.r);
  p.y = clamp(p.y, p.r, H - p.r);

  // engine trail
  if (len > 0 && Math.random() < 0.85) {
    const L = rand(0.2, 0.4);
    particles.push({
      x: p.x - ix * 12, y: p.y - iy * 12,
      vx: -ix * 90 + rand(-45, 45) - p.vx * 0.15,
      vy: -iy * 90 + rand(-45, 45) - p.vy * 0.15,
      life: L, max: L, r: rand(1.6, 3.2), color: '#35d4ff'
    });
  }

  p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);

  p.fireCd -= dt;
  if ((mouse.down || keys['KeyJ']) && p.fireCd <= 0) {
    shoot();
    p.fireCd = 0.11;
  }

  p.invuln -= dt;
  p.dashCd -= dt;
  p.triple -= dt;
}

// ---------- bullets ----------
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.life <= 0 || b.x < -60 || b.x > W + 60 || b.y < -60 || b.y > H + 60) {
      bullets.splice(i, 1);
    }
  }
}

// ---------- asteroids update ----------
function updateAsteroids(dt) {
  for (const a of asteroids) {
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.rot += a.spin * dt;
    if (a.flash > 0) a.flash -= dt;

    const m = a.r * 1.35 + 30;
    if (a.x < -m) a.x = W + m;
    else if (a.x > W + m) a.x = -m;
    if (a.y < -m) a.y = H + m;
    else if (a.y > H + m) a.y = -m;
  }
}

// ---------- collisions ----------
function collide() {
  // bullets -> asteroids
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d = Math.hypot(dx, dy) || 0.001;
      if (d < a.r * 0.92 + b.r) {
        bullets.splice(i, 1);
        a.hp -= 1;
        a.flash = 0.1;
        a.vx += (dx / d) * 26;
        a.vy += (dy / d) * 26;
        burst(b.x, b.y, '#fff3b0', 6, 200, 0.35);
        if (a.hp <= 0) destroyAsteroid(a, false);
        break;
      }
    }
  }

  // player -> asteroids
  for (let j = asteroids.length - 1; j >= 0; j--) {
    const a = asteroids[j];
    const dx = player.x - a.x, dy = player.y - a.y;
    const d = Math.hypot(dx, dy) || 0.001;
    if (d < a.r * 0.85 + player.r && player.invuln <= 0) {
      player.hp -= 1;
      player.invuln = 2.2;
      game.shake = 20;
      player.vx += (dx / d) * 460;
      player.vy += (dy / d) * 460;
      burst(player.x, player.y, '#ff4d6d', 30, 340, 0.8);
      destroyAsteroid(a, true);
      Sound.hit();
      if (player.hp <= 0) { gameOver(); return; }
    }
  }
}

// ---------- waves ----------
function nextWave() {
  game.wave++;
  game.waveTimer = 1.9;
  const n = Math.min(1 + Math.floor(game.wave * 0.7), 5);
  for (let i = 0; i < n; i++) asteroids.push(spawnAsteroidFromEdge(3));
  game.banner = { text: 'WAVE ' + game.wave, t: 2 };
  Sound.wave();
}

// ---------- flow ----------
function startGame() {
  Sound.unlock();
  Sound.startMusic();

  game.state = 'play';
  game.score = 0;
  game.wave = 0;
  game.time = 0;
  game.shake = 0;
  game.waveTimer = 0;
  game.banner = null;

  player = newPlayer();
  bullets = []; asteroids = []; particles = []; powerups = [];
  wantDash = false;
  mouse.x = player.x;
  mouse.y = player.y - 120;

  overlay.classList.add('hide');
}

function gameOver() {
  game.state = 'over';
  game.shake = 26;
  burst(player.x, player.y, '#ff4d6d', 60, 520, 1.1);
  Sound.gameOver();

  if (game.score > game.best) {
    game.best = game.score;
    try { localStorage.setItem('neondrift.best', String(game.best)); } catch (e) {}
  }

  ovTitle.textContent = 'GAME OVER';
  ovTitle.style.color = '#ff5fd2';
  ovTitle.style.textShadow = '0 0 14px #ff2fb0, 0 0 46px #a3006e';
  ovSub.innerHTML = 'SCORE <span class="key">' + game.score + '</span> &nbsp;·&nbsp; WAVE <span class="key">' + game.wave + '</span>';
  ovBtn.textContent = 'PLAY AGAIN';
  ovBest.textContent = 'BEST ' + game.best;
  overlay.classList.remove('hide');
}

function showMenu() {
  ovTitle.textContent = 'NEON DRIFT';
  ovTitle.style.color = '#8ffcff';
  ovTitle.style.textShadow = '0 0 14px #35e6ff, 0 0 42px #0d8ecf, 0 0 80px #0a5a8a';
  ovSub.innerHTML = CONTROLS_HTML;
  ovBtn.textContent = 'START';
  ovBest.textContent = game.best ? 'BEST ' + game.best : '';
}

// ---------- update ----------
function update(dt) {
  game.time += dt;
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 46);
  if (game.banner) {
    game.banner.t -= dt;
    if (game.banner.t <= 0) game.banner = null;
  }

  updateParticles(dt);
  updateBullets(dt);
  updateAsteroids(dt);

  if (game.state === 'play') {
    updatePlayer(dt);
    updatePowerups(dt);
    collide();
    if (game.state !== 'play') return;

    if (asteroids.length === 0) {
      game.waveTimer -= dt;
      if (game.waveTimer <= 0) nextWave();
    }
  }
}

// ---------- draw ----------
function drawStars() {
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    let sx = (s.x - player.x * s.z * 0.05) % W;
    let sy = (s.y - player.y * s.z * 0.05) % H;
    if (sx < 0) sx += W;
    if (sy < 0) sy += H;
    ctx.globalAlpha = 0.18 + s.z * 0.6;
    ctx.fillStyle = s.z > 0.78 ? '#bfe9ff' : '#3f6f96';
    ctx.fillRect(sx, sy, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawParticles() {
  for (const p of particles) {
    const t = p.life / p.max;
    ctx.globalAlpha = Math.max(0, t);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.35 + t * 0.85), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawAsteroids() {
  ctx.lineJoin = 'round';
  for (const a of asteroids) {
    const col = a.flash > 0 ? '#ffffff' : ASTEROID_COLORS[a.tier - 1];
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);

    const path = () => {
      for (let i = 0; i < a.verts.length; i++) {
        const ang = (i / a.verts.length) * TAU;
        const r = a.r * a.verts[i];
        const x = Math.cos(ang) * r;
        const y = Math.sin(ang) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
    };

    ctx.strokeStyle = col;

    ctx.globalAlpha = 0.09;
    ctx.fillStyle = col;
    ctx.beginPath(); path(); ctx.fill();

    ctx.globalAlpha = 0.2;
    ctx.lineWidth = 9;
    ctx.beginPath(); path(); ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.lineWidth = 2;
    ctx.beginPath(); path(); ctx.stroke();

    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawBullets() {
  ctx.lineCap = 'round';
  for (const b of bullets) {
    ctx.strokeStyle = '#ffe98a';
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.012, b.y - b.vy * 0.012);
    ctx.stroke();

    ctx.strokeStyle = '#fffdf0';
    ctx.globalAlpha = 1;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.017, b.y - b.vy * 0.017);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawPowerups() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const pu of powerups) {
    const col = pu.type === 'heal' ? '#5cff9d' : '#ffd166';
    let alpha = 0.95;
    if (pu.life < 3.5) alpha *= 0.35 + 0.65 * Math.abs(Math.sin(game.time * 12));

    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.rotate(pu.rot);
    ctx.strokeStyle = col;
    ctx.globalAlpha = alpha * 0.25;
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.rect(-9, -9, 18, 18); ctx.stroke();
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.rect(-9, -9, 18, 18); ctx.stroke();
    ctx.restore();

    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.font = '700 13px ui-monospace, Menlo, monospace';
    ctx.fillText(pu.type === 'heal' ? '+' : '3', pu.x, pu.y + 0.5);
  }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const p = player;
  const base = p.invuln > 0
    ? 0.35 + 0.65 * Math.abs(Math.sin(game.time * 16))
    : 1;

  const path = () => {
    ctx.moveTo(19, 0);
    ctx.lineTo(-12, -12);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-12, 12);
    ctx.closePath();
  };

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#7df9ff';

  ctx.globalAlpha = base * 0.2;
  ctx.lineWidth = 9;
  ctx.beginPath(); path(); ctx.stroke();

  ctx.globalAlpha = base;
  ctx.lineWidth = 2.4;
  ctx.beginPath(); path(); ctx.stroke();

  ctx.globalAlpha = base * 0.9;
  ctx.fillStyle = '#0a2b3a';
  ctx.beginPath(); path(); ctx.fill();

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.font = '700 15px ui-monospace, Menlo, monospace';
  ctx.fillStyle = '#8ffcff';
  ctx.globalAlpha = 0.92;
  ctx.fillText('SCORE ' + String(game.score).padStart(5, '0'), 22, 20);

  if (player.triple > 0) {
    const w = 90 * clamp(player.triple / 14, 0, 1);
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(22, 44, w, 4);
  }

  for (let i = 0; i < player.maxHp; i++) {
    const x = W - 28 - i * 24;
    const y = 28;
    const alive = i < player.hp;
    ctx.globalAlpha = alive ? 0.95 : 0.28;
    ctx.fillStyle = alive ? '#ff5fd2' : '#39466b';
    ctx.beginPath();
    ctx.moveTo(x, y - 8);
    ctx.lineTo(x + 8, y);
    ctx.lineTo(x, y + 8);
    ctx.lineTo(x - 8, y);
    ctx.closePath();
    ctx.fill();
  }

  if (game.wave > 0) {
    ctx.globalAlpha = 0.5;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7fb6d9';
    ctx.font = '700 13px ui-monospace, Menlo, monospace';
    ctx.fillText('WAVE ' + game.wave, W / 2, 22);
  }

  if (game.banner) {
    const a = clamp(game.banner.t, 0, 1);
    ctx.globalAlpha = a * 0.95;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 clamp(28px, 6vw, 48px) ui-monospace, Menlo, monospace';
    ctx.fillStyle = '#8ffcff';
    ctx.fillText(game.banner.text, W / 2, H * 0.3);
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05060e';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (game.shake > 0.2) {
    ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));
  }

  drawStars();

  ctx.globalCompositeOperation = 'lighter';
  drawParticles();
  drawPowerups();
  drawAsteroids();
  drawBullets();
  if (game.state === 'play') drawPlayer();
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();

  if (game.state === 'play' || game.state === 'over') drawHUD();
}

// ---------- loop ----------
let last = performance.now();
function loop(t) {
  let dt = (t - last) / 1000;
  last = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

// ---------- input ----------
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
    e.preventDefault();
  }
  keys[e.code] = true;

  if (e.code === 'Space' && !e.repeat) wantDash = true;

  if (e.code === 'KeyM' && !e.repeat) {
    Sound.unlock();
    const m = Sound.toggleMute();
    updateMuteBtn(m);
  }

  if ((e.code === 'Space' || e.code === 'Enter') && (game.state === 'menu' || game.state === 'over')) {
    startGame();
  }
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouse.down = false;
});

cvs.addEventListener('pointermove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

cvs.addEventListener('pointerdown', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.down = true;
  if (cvs.setPointerCapture) { try { cvs.setPointerCapture(e.pointerId); } catch (err) {} }
});

window.addEventListener('pointerup', () => { mouse.down = false; });
window.addEventListener('pointercancel', () => { mouse.down = false; });
window.addEventListener('contextmenu', e => e.preventDefault());

ovBtn.addEventListener('click', startGame);

function updateMuteBtn(isMuted) {
  muteBtn.textContent = isMuted ? '✕ SOUND OFF' : '♪ SOUND ON';
  muteBtn.classList.toggle('off', isMuted);
}

muteBtn.addEventListener('click', () => {
  Sound.unlock();
  const m = Sound.toggleMute();
  updateMuteBtn(m);
});

// pause audio when tab is hidden
document.addEventListener('visibilitychange', () => {
  if (!window.AudioContext && !window.webkitAudioContext) return;
  if (document.hidden) {
    if (Sound.stopMusic) Sound.stopMusic();
  } else if (game.state === 'play' || game.state === 'menu') {
    Sound.unlock();
    Sound.startMusic();
  }
});

window.addEventListener('resize', resize);

// ---------- boot ----------
resize();

player = newPlayer();
mouse.x = player.x;
mouse.y = player.y - 120;

for (let i = 0; i < 6; i++) {
  asteroids.push(makeAsteroid(randInt(1, 3), rand(0, W), rand(0, H)));
}

updateMuteBtn(Sound.isMuted());
showMenu();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
