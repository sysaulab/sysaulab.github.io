<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1220">
<title>Loop — Slitherlink</title>
<style>
  :root{
    --text:#e8edff;
    --muted:#7d89ad;
    --dim:#4a5470;
    --gold:#ffc857;
    --rose:#ff6b9d;
    --panel:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.08);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(circle at 50% -10%, #1b2440 0%, transparent 55%),
      radial-gradient(circle at 110% 110%, #161d33 0%, transparent 50%),
      #0e1220;
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
  }
  .app{
    max-width:520px; margin:0 auto;
    padding:12px 14px calc(16px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px;
    min-height:100vh;
  }
  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding-top:env(safe-area-inset-top);
  }
  .title{
    font-size:21px; font-weight:800; letter-spacing:.02em;
    background:linear-gradient(90deg,#ffc857,#ff9f45 55%,#ff6b9d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .badge{
    font-size:12px; font-weight:800; letter-spacing:.08em;
    padding:6px 12px; border-radius:999px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--muted); white-space:nowrap;
  }

  /* ---- size selector ---- */
  .sizebar{
    display:flex; gap:5px;
    padding:4px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:13px;
  }
  .sizebar button{
    flex:1;
    padding:9px 2px;
    border-radius:9px;
    background:transparent;
    border:none;
    color:var(--muted);
    font-family:inherit;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:.02em;
    cursor:pointer;
    transition:background .16s ease, color .16s ease, transform .1s ease;
    -webkit-tap-highlight-color:transparent;
    white-space:nowrap;
  }
  .sizebar button:active{ transform:scale(.94); }
  .sizebar button.on{
    background:linear-gradient(135deg,#ffc857,#ff9f45);
    color:#121828;
  }

  .hintline{
    margin:0; font-size:12.5px; line-height:1.5; color:var(--muted);
    text-align:center;
  }
  .hintline b{ color:#b8c5e8; font-weight:700; }

  .board-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:20px;
    background:linear-gradient(165deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 14px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
  }
  #board{
    display:block; width:100%; height:100%;
    touch-action:none;
    cursor:crosshair;
  }

  /* ---- svg pieces ---- */
  .eg{
    stroke:rgba(255,255,255,.055);
    stroke-linecap:round;
    transition:stroke .13s ease, stroke-width .13s ease, opacity .13s ease;
  }
  .eg.on{
    stroke:var(--gold);
    filter:drop-shadow(0 0 4px rgba(255,200,87,.65));
  }
  .eg.hidden{ opacity:0; }
  .xm{
    stroke:rgba(255,107,157,.55);
    stroke-linecap:round;
  }
  .clue{
    fill:#b8c5e8;
    font-family:inherit;
    font-weight:700;
    pointer-events:none;
    transition:fill .18s ease;
  }
  .clue.zero{ fill:#5d6a8f; }
  .clue.three{ fill:#ffffff; }
  .clue.bad{ fill:#ff6b7d; animation:clueShake .35s ease; }
  @keyframes clueShake{
    0%,100%{ transform:translateX(0) }
    25%{ transform:translateX(-2.5px) }
    75%{ transform:translateX(2.5px) }
  }
  #board.win .eg.on{ animation:loopPulse 1s ease-in-out 4; }
  @keyframes loopPulse{
    0%,100%{ stroke:#ffc857; }
    50%{ stroke:#fff3cf; }
  }

  /* ---- controls ---- */
  .controls{ display:flex; gap:8px; }
  .controls button{
    flex:1;
    padding:13px 6px;
    border-radius:13px;
    background:rgba(255,255,255,.07);
    border:1px solid var(--line);
    color:var(--text);
    font-family:inherit; font-size:13.5px; font-weight:800;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
    -webkit-tap-highlight-color:transparent;
    white-space:nowrap;
  }
  .controls button:active{ transform:scale(.95); background:rgba(255,255,255,.15); }
  .controls button:disabled{ opacity:.35; }
  #undoBtn{ background:rgba(110,231,255,.10); border-color:rgba(110,231,255,.22); color:#9fe6ff; }
  #checkBtn{ background:rgba(255,200,87,.11); border-color:rgba(255,200,87,.24); color:#ffd98a; }
  #newBtn{ background:rgba(167,139,250,.13); border-color:rgba(167,139,250,.26); color:#c9b8ff; }

  /* ---- toast ---- */
  .toast{
    position:fixed;
    left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translate(-50%, 12px);
    padding:11px 18px;
    border-radius:999px;
    background:rgba(30,38,64,.96);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 12px 34px rgba(0,0,0,.55);
    font-size:13px; font-weight:700;
    color:#dfe6ff;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:40;
    max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---- overlay ---- */
  .overlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(8,11,20,.85);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    opacity:0; pointer-events:none; transition:opacity .32s ease;
    padding:24px;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .card{
    width:100%; max-width:320px;
    background:linear-gradient(160deg,#1d2643,#121828);
    border:1px solid rgba(255,255,255,.11);
    border-radius:22px;
    padding:26px 22px;
    text-align:center;
    box-shadow:0 26px 70px rgba(0,0,0,.7);
    transform:translateY(14px) scale(.95);
    transition:transform .38s cubic-bezier(.2,1.4,.5,1);
  }
  .overlay.show .card{ transform:translateY(0) scale(1); }
  .emoji{ font-size:46px; line-height:1; }
  .card h2{
    margin:10px 0 6px; font-size:23px;
    background:linear-gradient(90deg,#ffc857,#ff6b9d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card p{ margin:0 0 18px; font-size:13.5px; color:var(--muted); line-height:1.55; }
  .card button{
    width:100%;
    padding:13px;
    border-radius:13px;
    background:linear-gradient(90deg,#ffc857,#ff9f45);
    color:#121828; border:none;
    font-family:inherit; font-size:14px; font-weight:800;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="title">Loop</div>
    <span class="badge" id="sizeBadge">6 × 6</span>
  </header>

  <div class="sizebar" id="sizebar">
    <button data-size="4">4×4</button>
    <button data-size="5">5×5</button>
    <button data-size="6" class="on">6×6</button>
    <button data-size="7">7×7</button>
    <button data-size="8">8×8</button>
  </div>

  <p class="hintline">
    Draw <b>one closed loop</b>. A number tells you how many of its four sides are on the loop.<br>
    <b>Tap</b> an edge: line → cross → clear &nbsp;·&nbsp; <b>Drag</b> to paint
  </p>

  <div class="board-wrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="controls">
    <button id="undoBtn">↩ Undo</button>
    <button id="clearBtn">🧹 Clear</button>
    <button id="checkBtn">🔍 Check</button>
    <button id="newBtn">✨ New</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="emoji">🔗</div>
    <h2>Loop Complete!</h2>
    <p id="winStats"></p>
    <button id="nextBtn">Play Again</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   CONFIG
   ========================================================= */
let W = 6, H = 6;                // set by size selector
const CELL = 60;                 // board units per cell
const PAD  = 24;                 // padding in board units
const REF  = 408;                // reference viewBox size (6x6) for stroke scaling

let VW = 0, VH = 0;              // recomputed on size change

const SVGNS = 'http://www.w3.org/2000/svg';
const EMPTY = 0, LINE = 1, CROSS = 2;

/* =========================================================
   DOM
   ========================================================= */
const svg       = document.getElementById('board');
const overlay   = document.getElementById('overlay');
const winStats  = document.getElementById('winStats');
const toastEl   = document.getElementById('toast');
const sizeBadge = document.getElementById('sizeBadge');
const sizebar   = document.getElementById('sizebar');

/* =========================================================
   STATE
   ========================================================= */
let hState, vState;
let clue;
let hEls, vEls, hX, vX, clueEls;
let history = [];
let strokeBuffer = [];
let solved = false;
let startTime = 0;

/* =========================================================
   AUDIO
   ========================================================= */
let actx = null;
function ac(){
  if (!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, delay){
  const c = ac(); if (!c) return;
  dur = dur || 0.07; type = type || 'sine'; vol = vol || 0.08; delay = delay || 0;
  const t = c.currentTime + delay;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.04);
}
const sfx = {
  draw(){ tone(760, 0.045, 'triangle', 0.055); },
  erase(){ tone(420, 0.055, 'sine', 0.05); },
  cross(){ tone(980, 0.04, 'square', 0.035); },
  clear(){ tone(300, 0.10, 'sine', 0.05); tone(220, 0.12, 'sine', 0.04, 0.06); },
  bad(){ tone(190, 0.14, 'sawtooth', 0.05); tone(130, 0.18, 'sawtooth', 0.038, 0.05); },
  win(){ [523.25,659.25,783.99,1046.5,1318.5,1568].forEach(function(f,i){
    tone(f, 0.38, 'triangle', 0.10, i*0.10); }); }
};
function buzz(ms){ if (navigator.vibrate){ try { navigator.vibrate(ms); } catch(e){} } }

/* =========================================================
   PUZZLE GENERATION — polyomino boundary
   ---------------------------------------------------------
   We grow a random polyomino (a connected set of cells)
   inside the grid, forbidding "pinch" vertices (which would
   make the boundary cross itself) and rejecting any shape
   that encloses a hole.  The boundary of that polyomino is
   guaranteed to be a single simple closed loop.
   ========================================================= */

/* --- vertex bit masks for the 4 cells around a lattice point --- */
/*    TL=1  TR=2
      BL=4  BR=8    */

function canAddCell(set, W, H, r, c){
  /* check the 4 corners of the candidate cell */
  for (let k = 0; k < 4; k++){
    const vr = r + (k >> 1);
    const vc = c + (k & 1);
    /* the 4 cells around vertex (vr,vc) */
    const cells = [
      [vr-1, vc-1, 1],  /* TL */
      [vr-1, vc,   2],  /* TR */
      [vr,   vc-1, 4],  /* BL */
      [vr,   vc,   8]   /* BR */
    ];
    let mask = 0;
    for (let i = 0; i < 4; i++){
      const cr = cells[i][0], cc = cells[i][1], bit = cells[i][2];
      let inSet = false;
      if (cr === r && cc === c) inSet = true;
      else if (cr >= 0 && cr < H && cc >= 0 && cc < W && set[cr * W + cc]) inSet = true;
      if (inSet) mask |= bit;
    }
    if (mask === 15) return false;   /* 4 cells meet — degree 4 */
    if (mask === 9)  return false;   /* TL + BR diagonal pinch */
    if (mask === 6)  return false;   /* TR + BL diagonal pinch */
  }
  return true;
}

function hasHole(set, W, H){
  const visited = new Uint8Array(W * H);
  const queue = [];
  for (let c = 0; c < W; c++){
    if (!set[c] && !visited[c]){ visited[c] = 1; queue.push(c); }
    const b = (H-1) * W + c;
    if (!set[b] && !visited[b]){ visited[b] = 1; queue.push(b); }
  }
  for (let r = 0; r < H; r++){
    const l = r * W;
    if (!set[l] && !visited[l]){ visited[l] = 1; queue.push(l); }
    const rt = r * W + W - 1;
    if (!set[rt] && !visited[rt]){ visited[rt] = 1; queue.push(rt); }
  }
  let head = 0;
  while (head < queue.length){
    const idx = queue[head++];
    const r = (idx / W) | 0, c = idx % W;
    if (r > 0){ const n = idx - W; if (!visited[n] && !set[n]){ visited[n] = 1; queue.push(n); } }
    if (r < H-1){ const n = idx + W; if (!visited[n] && !set[n]){ visited[n] = 1; queue.push(n); } }
    if (c > 0){ const n = idx - 1; if (!visited[n] && !set[n]){ visited[n] = 1; queue.push(n); } }
    if (c < W-1){ const n = idx + 1; if (!visited[n] && !set[n]){ visited[n] = 1; queue.push(n); } }
  }
  for (let i = 0; i < W * H; i++){
    if (!set[i] && !visited[i]) return true;
  }
  return false;
}

function tryGeneratePolyomino(W, H){
  const set = new Uint8Array(W * H);
  /* random interior start */
  const sr = 1 + ((Math.random() * Math.max(1, H - 2)) | 0);
  const sc = 1 + ((Math.random() * Math.max(1, W - 2)) | 0);
  let r = sr, c = sc;
  set[r * W + c] = 1;
  const cells = [r * W + c];

  const targetSize = Math.max(6, Math.round(W * H * (0.35 + Math.random() * 0.40)));
  const maxSteps = W * H * 25;

  for (let step = 0; step < maxSteps && cells.length < targetSize; step++){
    /* occasionally teleport to a random frontier cell to vary the shape */
    if (Math.random() < 0.28 && cells.length > 0){
      const ci = cells[(Math.random() * cells.length) | 0];
      r = (ci / W) | 0;
      c = ci % W;
    }

    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    for (let i = 3; i > 0; i--){
      const j = (Math.random() * (i + 1)) | 0;
      const t = dirs[i]; dirs[i] = dirs[j]; dirs[j] = t;
    }

    let moved = false;
    for (let k = 0; k < 4; k++){
      const nr = r + dirs[k][0];
      const nc = c + dirs[k][1];
      if (nr < 0 || nr >= H || nc < 0 || nc >= W) continue;
      if (set[nr * W + nc]) continue;
      if (!canAddCell(set, W, H, nr, nc)) continue;
      set[nr * W + nc] = 1;
      cells.push(nr * W + nc);
      r = nr; c = nc;
      moved = true;
      break;
    }
    if (!moved){
      /* stuck — jump to a random cell */
      const ci = cells[(Math.random() * cells.length) | 0];
      r = (ci / W) | 0;
      c = ci % W;
    }
  }

  const minSize = Math.max(5, Math.round(W * H * 0.18));
  if (cells.length < minSize) return null;
  if (hasHole(set, W, H)) return null;
  return set;
}

function deriveClues(set, W, H){
  const out = [];
  for (let r = 0; r < H; r++){
    const row = [];
    for (let c = 0; c < W; c++){
      const here = set[r * W + c];
      let n = 0;
      const top = (r === 0) ? 0 : set[(r-1) * W + c];
      const bot = (r === H-1) ? 0 : set[(r+1) * W + c];
      const lef = (c === 0) ? 0 : set[r * W + c - 1];
      const rig = (c === W-1) ? 0 : set[r * W + c + 1];
      if (here !== top) n++;
      if (here !== bot) n++;
      if (here !== lef) n++;
      if (here !== rig) n++;
      row.push(n);
    }
    out.push(row);
  }
  return out;
}

function generatePuzzle(){
  for (let attempt = 0; attempt < 60; attempt++){
    const set = tryGeneratePolyomino(W, H);
    if (set) return deriveClues(set, W, H);
  }
  /* absolute fallback — plain ring around the centre */
  const set = new Uint8Array(W * H);
  const r0 = Math.floor(H * 0.25), r1 = Math.ceil(H * 0.75);
  const c0 = Math.floor(W * 0.25), c1 = Math.ceil(W * 0.75);
  for (let r = r0; r < r1; r++)
    for (let c = c0; c < c1; c++)
      set[r * W + c] = 1;
  return deriveClues(set, W, H);
}

/* =========================================================
   SVG BUILDING
   ========================================================= */
function mk(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function buildBoard(){
  VW = W * CELL + PAD * 2;
  VH = H * CELL + PAD * 2;

  svg.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  /* stroke widths scale so they look consistent across board sizes */
  const s = VW / REF;
  const wGuide  = 3.0 * s;
  const wActive = 5.6 * s;
  const xHalf   = 6.0 * s;
  const dotR    = 2.6 * s;

  const gEdges = mk('g', { 'pointer-events': 'none' });
  const gX     = mk('g', { 'pointer-events': 'none' });
  const gClues = mk('g', { 'pointer-events': 'none' });
  const gDots  = mk('g', { 'pointer-events': 'none' });

  /* --- clues --- */
  clueEls = [];
  for (let r = 0; r < H; r++){
    clueEls[r] = [];
    for (let c = 0; c < W; c++){
      const t = mk('text', {
        x: PAD + (c + 0.5) * CELL,
        y: PAD + (r + 0.5) * CELL,
        dy: '0.36em',
        'text-anchor': 'middle',
        'font-size': (CELL * 0.38).toFixed(1),
        'class': 'clue' + (clue[r][c] === 0 ? ' zero' : clue[r][c] === 3 ? ' three' : '')
      });
      t.textContent = clue[r][c];
      gClues.appendChild(t);
      clueEls[r][c] = t;
    }
  }

  /* --- horizontal edges --- */
  hEls = []; hX = [];
  for (let r = 0; r <= H; r++){
    for (let c = 0; c < W; c++){
      const x1 = PAD + c * CELL,       y1 = PAD + r * CELL;
      const x2 = PAD + (c + 1) * CELL, y2 = y1;
      const ln = mk('line', {
        x1: x1, y1: y1, x2: x2, y2: y2,
        'class': 'eg', 'stroke-width': wGuide
      });
      gEdges.appendChild(ln);
      hEls[r * W + c] = ln;

      const cx = (x1 + x2) / 2, cy = y1;
      const xg = mk('g', { 'class': 'xm', style: 'display:none', 'stroke-width': (wGuide * 0.8) });
      xg.appendChild(mk('line', { x1: cx - xHalf, y1: cy - xHalf, x2: cx + xHalf, y2: cy + xHalf }));
      xg.appendChild(mk('line', { x1: cx - xHalf, y1: cy + xHalf, x2: cx + xHalf, y2: cy - xHalf }));
      gX.appendChild(xg);
      hX[r * W + c] = xg;
    }
  }

  /* --- vertical edges --- */
  vEls = []; vX = [];
  for (let r = 0; r < H; r++){
    for (let c = 0; c <= W; c++){
      const x1 = PAD + c * CELL, y1 = PAD + r * CELL;
      const x2 = x1,             y2 = PAD + (r + 1) * CELL;
      const ln = mk('line', {
        x1: x1, y1: y1, x2: x2, y2: y2,
        'class': 'eg', 'stroke-width': wGuide
      });
      gEdges.appendChild(ln);
      vEls[r * (W + 1) + c] = ln;

      const cx = x1, cy = (y1 + y2) / 2;
      const xg = mk('g', { 'class': 'xm', style: 'display:none', 'stroke-width': (wGuide * 0.8) });
      xg.appendChild(mk('line', { x1: cx - xHalf, y1: cy - xHalf, x2: cx + xHalf, y2: cy + xHalf }));
      xg.appendChild(mk('line', { x1: cx - xHalf, y1: cy + xHalf, x2: cx + xHalf, y2: cy - xHalf }));
      gX.appendChild(xg);
      vX[r * (W + 1) + c] = xg;
    }
  }

  /* --- dots (drawn last = on top) --- */
  for (let r = 0; r <= H; r++){
    for (let c = 0; c <= W; c++){
      gDots.appendChild(mk('circle', {
        cx: PAD + c * CELL,
        cy: PAD + r * CELL,
        r: dotR,
        fill: 'rgba(255,255,255,.20)'
      }));
    }
  }

  /* store active stroke width on the board for syncAll to use */
  svg.dataset.wActive = wActive;

  svg.appendChild(gEdges);
  svg.appendChild(gX);
  svg.appendChild(gClues);
  svg.appendChild(gDots);
}

/* =========================================================
   SYNC STATE -> DOM
   ========================================================= */
function syncAll(){
  const wActive = parseFloat(svg.dataset.wActive) || 5.6;
  for (let r = 0; r <= H; r++){
    for (let c = 0; c < W; c++){
      const i = r * W + c;
      const st = hState[i];
      hEls[i].setAttribute('class', 'eg' + (st === LINE ? ' on' : st === CROSS ? ' hidden' : ''));
      hEls[i].setAttribute('stroke-width', st === LINE ? wActive : (wActive * 0.55));
      hX[i].style.display = st === CROSS ? '' : 'none';
    }
  }
  for (let r = 0; r < H; r++){
    for (let c = 0; c <= W; c++){
      const i = r * (W + 1) + c;
      const st = vState[i];
      vEls[i].setAttribute('class', 'eg' + (st === LINE ? ' on' : st === CROSS ? ' hidden' : ''));
      vEls[i].setAttribute('stroke-width', st === LINE ? wActive : (wActive * 0.55));
      vX[i].style.display = st === CROSS ? '' : 'none';
    }
  }
}

/* =========================================================
   EDGE HELPERS
   ========================================================= */
function edgeArray(ed){ return ed.t === 'h' ? hState : vState; }
function edgeIndex(ed){ return ed.t === 'h' ? ed.r * W + ed.c : ed.r * (W + 1) + ed.c; }
function getState(ed){ return edgeArray(ed)[edgeIndex(ed)]; }

function applyChange(ed, val){
  const arr = edgeArray(ed), idx = edgeIndex(ed);
  if (arr[idx] === val) return false;
  strokeBuffer.push({ t: ed.t, r: ed.r, c: ed.c, prev: arr[idx] });
  arr[idx] = val;
  return true;
}

/* =========================================================
   HIT TESTING
   ========================================================= */
function pointToBoard(clientX, clientY){
  const rect = svg.getBoundingClientRect();
  const sx = VW / rect.width;
  const sy = VH / rect.height;
  return {
    x: (clientX - rect.left) * sx - PAD,
    y: (clientY - rect.top)  * sy - PAD
  };
}

function hitEdge(x, y){
  let best = null, bestD = Infinity;
  const THRESH = CELL * 0.42;

  for (let r = 0; r <= H; r++){
    for (let c = 0; c < W; c++){
      const dx = x - (c + 0.5) * CELL;
      const dy = y - r * CELL;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD){ bestD = d; best = { t: 'h', r: r, c: c }; }
    }
  }
  for (let r = 0; r < H; r++){
    for (let c = 0; c <= W; c++){
      const dx = x - c * CELL;
      const dy = y - (r + 0.5) * CELL;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD){ bestD = d; best = { t: 'v', r: r, c: c }; }
    }
  }
  return bestD <= THRESH ? best : null;
}

/* =========================================================
   POINTER INTERACTION
   ========================================================= */
let ptr = { active: false, moved: false, sx: 0, sy: 0, mode: 'draw', startEdge: null, seen: null };

svg.addEventListener('pointerdown', function(e){
  if (solved) return;
  e.preventDefault();
  ac();

  const p = pointToBoard(e.clientX, e.clientY);
  const ed = hitEdge(p.x, p.y);
  if (!ed) return;

  ptr.active  = true;
  ptr.moved   = false;
  ptr.sx = e.clientX;
  ptr.sy = e.clientY;
  ptr.startEdge = ed;
  ptr.seen = Object.create(null);
  ptr.mode = (getState(ed) === LINE) ? 'erase' : 'draw';
  strokeBuffer = [];

  try { svg.setPointerCapture(e.pointerId); } catch(err){}
}, { passive: false });

svg.addEventListener('pointermove', function(e){
  if (!ptr.active) return;
  e.preventDefault();

  if (!ptr.moved){
    const dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy;
    if (dx * dx + dy * dy > 64){
      ptr.moved = true;
      const target = ptr.mode === 'draw' ? LINE : EMPTY;
      if (applyChange(ptr.startEdge, target)){
        ptr.seen[ptr.startEdge.t + ptr.startEdge.r + ',' + ptr.startEdge.c] = 1;
      }
      syncAll();
    }
  }
  if (!ptr.moved) return;

  const p = pointToBoard(e.clientX, e.clientY);
  const ed = hitEdge(p.x, p.y);
  if (!ed) return;

  const key = ed.t + ed.r + ',' + ed.c;
  if (ptr.seen[key]) return;
  ptr.seen[key] = 1;

  const target = ptr.mode === 'draw' ? LINE : EMPTY;
  if (getState(ed) !== target){
    applyChange(ed, target);
    (target === LINE ? sfx.draw : sfx.erase)();
    syncAll();
  }
}, { passive: false });

function endPointer(){
  if (!ptr.active) return;
  ptr.active = false;

  if (!ptr.moved){
    const ed = ptr.startEdge;
    const cur = getState(ed);
    const nxt = cur === EMPTY ? LINE : cur === LINE ? CROSS : EMPTY;
    applyChange(ed, nxt);
    if (nxt === LINE) sfx.draw();
    else if (nxt === CROSS) sfx.cross();
    else sfx.erase();
    syncAll();
  }

  if (strokeBuffer.length){
    history.push(strokeBuffer);
    strokeBuffer = [];
    updateUndo();
  }

  if (!solved && checkWin()) onWin();
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* =========================================================
   WIN CHECK
   ========================================================= */
function checkWin(){
  /* 1 — every clue satisfied */
  for (let r = 0; r < H; r++){
    for (let c = 0; c < W; c++){
      let n = 0;
      if (hState[r * W + c])             n++;
      if (hState[(r + 1) * W + c])       n++;
      if (vState[r * (W + 1) + c])       n++;
      if (vState[r * (W + 1) + c + 1])   n++;
      if (n !== clue[r][c]) return false;
    }
  }

  /* 2 — every used vertex has degree 2, and the edges form one cycle */
  const nDots = (H + 1) * (W + 1);
  const deg = new Uint8Array(nDots);
  const adj = new Array(nDots);
  for (let i = 0; i < nDots; i++) adj[i] = [];

  let edgeCount = 0;
  let startDot = -1;

  function dotId(r, c){ return r * (W + 1) + c; }

  for (let r = 0; r <= H; r++){
    for (let c = 0; c < W; c++){
      if (!hState[r * W + c]) continue;
      const a = dotId(r, c), b = dotId(r, c + 1);
      deg[a]++; deg[b]++;
      adj[a].push(b); adj[b].push(a);
      edgeCount++;
      if (startDot < 0) startDot = a;
    }
  }
  for (let r = 0; r < H; r++){
    for (let c = 0; c <= W; c++){
      if (!vState[r * (W + 1) + c]) continue;
      const a = dotId(r, c), b = dotId(r + 1, c);
      deg[a]++; deg[b]++;
      adj[a].push(b); adj[b].push(a);
      edgeCount++;
      if (startDot < 0) startDot = a;
    }
  }

  if (edgeCount < 4 || startDot < 0) return false;

  for (let i = 0; i < nDots; i++){
    if (deg[i] !== 0 && deg[i] !== 2) return false;
  }

  let prev = -1, cur = startDot, walked = 0;
  while (true){
    const nb = adj[cur];
    if (nb.length !== 2) return false;
    const nxt = (nb[0] === prev) ? nb[1] : nb[0];
    prev = cur; cur = nxt;
    if (++walked > edgeCount + 1) return false;
    if (cur === startDot) break;
  }
  return walked === edgeCount;
}

/* =========================================================
   FEEDBACK
   ========================================================= */
let toastTimer = null;
function showToast(msg, ms){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, ms || 2200);
}

function flashBadClues(){
  let bad = 0;
  for (let r = 0; r < H; r++){
    for (let c = 0; c < W; c++){
      let n = 0;
      if (hState[r * W + c])             n++;
      if (hState[(r + 1) * W + c])       n++;
      if (vState[r * (W + 1) + c])       n++;
      if (vState[r * (W + 1) + c + 1])   n++;
      if (n !== clue[r][c]){
        bad++;
        (function(el){
          el.classList.add('bad');
          setTimeout(function(){ el.classList.remove('bad'); }, 1400);
        })(clueEls[r][c]);
      }
    }
  }
  return bad;
}

/* =========================================================
   GAME FLOW
   ========================================================= */
function newGame(){
  overlay.classList.remove('show');
  svg.classList.remove('win');
  solved = false;
  history = [];
  strokeBuffer = [];
  ptr.active = false;

  clue = generatePuzzle();

  hState = new Uint8Array((H + 1) * W);
  vState = new Uint8Array(H * (W + 1));

  buildBoard();
  syncAll();
  updateUndo();

  startTime = Date.now();
}

function onWin(){
  solved = true;
  svg.classList.add('win');
  buzz([40, 60, 40, 60, 140]);
  sfx.win();

  const secs = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(secs / 60), s = secs % 60;
  winStats.textContent = 'Solved in ' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;

  setTimeout(function(){ overlay.classList.add('show'); }, 1000);
}

function updateUndo(){
  document.getElementById('undoBtn').disabled = history.length === 0;
}

/* =========================================================
   SIZE SELECTOR
   ========================================================= */
function setSize(n){
  if (n === W) return;
  W = n; H = n;
  sizeBadge.textContent = n + ' × ' + n;
  const btns = sizebar.querySelectorAll('button');
  for (let i = 0; i < btns.length; i++){
    btns[i].classList.toggle('on', parseInt(btns[i].dataset.size, 10) === n);
  }
  newGame();
}

sizebar.addEventListener('click', function(e){
  const btn = e.target.closest('button');
  if (!btn) return;
  ac();
  setSize(parseInt(btn.dataset.size, 10));
});

/* =========================================================
   CONTROLS
   ========================================================= */
document.getElementById('undoBtn').addEventListener('click', function(){
  if (!history.length) return;
  ac();
  const act = history.pop();
  for (let i = act.length - 1; i >= 0; i--){
    const it = act[i];
    const arr = it.t === 'h' ? hState : vState;
    const idx = it.t === 'h' ? it.r * W + it.c : it.r * (W + 1) + it.c;
    arr[idx] = it.prev;
  }
  solved = false;
  svg.classList.remove('win');
  overlay.classList.remove('show');
  sfx.erase();
  syncAll();
  updateUndo();
});

document.getElementById('clearBtn').addEventListener('click', function(){
  ac();
  const items = [];
  for (let i = 0; i < hState.length; i++){
    if (hState[i] !== EMPTY){
      items.push({ t: 'h', r: Math.floor(i / W), c: i % W, prev: hState[i] });
      hState[i] = EMPTY;
    }
  }
  for (let i = 0; i < vState.length; i++){
    if (vState[i] !== EMPTY){
      items.push({ t: 'v', r: Math.floor(i / (W + 1)), c: i % (W + 1), prev: vState[i] });
      vState[i] = EMPTY;
    }
  }
  if (items.length){
    history.push(items);
    sfx.clear();
    buzz(18);
  }
  solved = false;
  svg.classList.remove('win');
  overlay.classList.remove('show');
  syncAll();
  updateUndo();
});

document.getElementById('checkBtn').addEventListener('click', function(){
  if (solved) return;
  ac();

  const bad = flashBadClues();
  if (bad > 0){
    sfx.bad();
    buzz(35);
    showToast(bad + (bad === 1 ? " number doesn't match yet" : " numbers don't match yet"));
    return;
  }

  const nDots = (H + 1) * (W + 1);
  const deg = new Uint8Array(nDots);
  function dotId(r, c){ return r * (W + 1) + c; }
  for (let r = 0; r <= H; r++) for (let c = 0; c < W; c++){
    if (hState[r * W + c]){ deg[dotId(r,c)]++; deg[dotId(r,c+1)]++; }
  }
  for (let r = 0; r < H; r++) for (let c = 0; c <= W; c++){
    if (vState[r * (W + 1) + c]){ deg[dotId(r,c)]++; deg[dotId(r+1,c)]++; }
  }
  let dangling = 0;
  for (let i = 0; i < deg.length; i++) if (deg[i] !== 0 && deg[i] !== 2) dangling++;

  sfx.bad();
  if (dangling > 0) showToast('All numbers match — but there are loose ends');
  else showToast('All numbers match — but it must be ONE single loop');
});

document.getElementById('newBtn').addEventListener('click', function(){ ac(); newGame(); });
document.getElementById('nextBtn').addEventListener('click', function(){ ac(); newGame(); });
overlay.addEventListener('click', function(e){ if (e.target === overlay) newGame(); });

/* =========================================================
   GO
   ========================================================= */
sizeBadge.textContent = W + ' × ' + W;
newGame();

})();
</script>
