<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Generative Music Machine</title>
<style>
  :root {
    --fg: #e8ecff;
    --dim: #8b93b8;
    --glass: rgba(14, 17, 32, 0.55);
    --line: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: #04050a; color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #viz { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Info panel ---------- */
  .panel {
    position: fixed; top: 20px; left: 20px; z-index: 3;
    padding: 16px 18px 14px; border-radius: 16px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
    min-width: 210px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .panel h1 {
    margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.18em;
    line-height: 1.5; color: #fff;
  }
  .panel h1 span { color: var(--dim); font-weight: 500; }
  .row {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 3px 0; color: var(--dim);
  }
  .row b {
    color: var(--fg); font-weight: 600; letter-spacing: 0.06em;
    text-align: right; font-variant-numeric: tabular-nums;
  }

  /* ---------- Bottom HUD ---------- */
  .hud {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 3; display: flex; flex-direction: column; align-items: center;
    gap: 14px; width: min(92vw, 620px);
  }
  .chords {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .chip {
    min-width: 46px; padding: 7px 12px; border-radius: 10px; text-align: center;
    font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line);
    color: var(--dim);
    transition: all 0.25s ease;
  }
  .chip.active {
    color: #fff;
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.4);
    transform: translateY(-3px) scale(1.06);
    box-shadow: 0 8px 24px rgba(120, 160, 255, 0.25);
  }

  .controls {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 999px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  button {
    font: inherit; font-size: 12px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 11px 20px; border-radius: 999px; cursor: pointer;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    color: var(--fg);
    transition: background 0.2s, transform 0.1s, border-color 0.2s;
  }
  button:hover { background: rgba(255, 255, 255, 0.13); }
  button:active { transform: scale(0.96); }
  button.primary {
    background: linear-gradient(135deg, #6f8dff, #b46cff);
    border-color: transparent; color: #fff; min-width: 110px;
    box-shadow: 0 6px 22px rgba(120, 120, 255, 0.35);
  }
  button.primary:hover { filter: brightness(1.12); }
  button.primary.on {
    background: linear-gradient(135deg, #ff6f9c, #ff9f6f);
    box-shadow: 0 6px 22px rgba(255, 110, 150, 0.35);
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 84px; height: 4px; border-radius: 4px; outline: none;
    background: rgba(255, 255, 255, 0.16); cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.6); cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border: none; border-radius: 50%;
    background: #fff; cursor: pointer;
  }
  @media (max-width: 560px) {
    .panel { font-size: 10px; min-width: 0; padding: 12px 14px; }
    button { padding: 10px 14px; font-size: 11px; }
    input[type="range"] { width: 60px; }
  }
</style>
</head>
<body>
<canvas id="viz"></canvas>

<div class="panel">
  <h1>Generative<br><span>Music Machine</span></h1>
  <div class="row"><span>Mood</span><b id="i-mood">—</b></div>
  <div class="row"><span>Key</span><b id="i-key">—</b></div>
  <div class="row"><span>Scale</span><b id="i-scale">—</b></div>
  <div class="row"><span>Tempo</span><b id="i-tempo">—</b></div>
</div>

<div class="hud">
  <div class="chords" id="chords"></div>
  <div class="controls">
    <button id="btn-play" class="primary">Play</button>
    <button id="btn-new">New piece</button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume">
  </div>
</div>

<script>
(() => {
"use strict";

/* ============================================================
   Helpers
   ============================================================ */
const rand   = (a, b) => a + Math.random() * (b - a);
const pick   = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const clamp  = (v, a, b) => Math.max(a, Math.min(b, v));
const mtof   = m => 440 * Math.pow(2, (m - 69) / 12);

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const ROMAN = ["I","II","III","IV","V","VI","VII"];

const SCALES = {
  "Major":          [0, 2, 4, 5, 7, 9, 11],
  "Natural Minor":  [0, 2, 3, 5, 7, 8, 10],
  "Dorian":         [0, 2, 3, 5, 7, 9, 10],
  "Phrygian":       [0, 1, 3, 5, 7, 8, 10],
  "Lydian":         [0, 2, 4, 6, 7, 9, 11],
  "Mixolydian":     [0, 2, 4, 5, 7, 9, 10],
  "Harmonic Minor": [0, 2, 3, 5, 7, 8, 11],
  "Melodic Minor":  [0, 2, 3, 5, 7, 9, 11]
};

// Chord progressions expressed as scale degrees (0 = tonic)
const PROGRESSIONS = [
  [0, 5, 3, 4], [0, 3, 4, 4], [0, 4, 5, 3], [5, 3, 0, 4],
  [0, 6, 3, 4], [0, 2, 5, 4], [0, 5, 6, 4], [3, 4, 0, 0],
  [0, 1, 5, 4], [5, 0, 3, 4], [0, 3, 0, 4], [1, 4, 0, 5]
];

const MOODS = [
  { name: "Dreamy",  bpm: [62, 80],   rev: 0.55, del: 0.30, cut: [600, 1400],  dens: 0.34, drums: 0.35 },
  { name: "Neon",    bpm: [100, 124], rev: 0.25, del: 0.36, cut: [1200, 2600], dens: 0.60, drums: 0.85 },
  { name: "Deep",    bpm: [70, 90],   rev: 0.42, del: 0.20, cut: [400, 900],   dens: 0.30, drums: 0.60 },
  { name: "Glitch",  bpm: [112, 140], rev: 0.20, del: 0.42, cut: [900, 3000],  dens: 0.72, drums: 0.95 },
  { name: "Ambient", bpm: [50, 68],   rev: 0.72, del: 0.40, cut: [500, 1200],  dens: 0.22, drums: 0.15 },
  { name: "Acid",    bpm: [118, 138], rev: 0.22, del: 0.28, cut: [700, 1800],  dens: 0.68, drums: 0.80 }
];

/* ============================================================
   Audio engine
   ============================================================ */
let ctx = null;
let master, outGain, comp, analyser, freqData;
let delayNode, delayFb, reverbNode, noiseBuf;
let audioReady = false;

function makeImpulse(duration, decay) {
  const rate = ctx.sampleRate;
  const len = Math.floor(rate * duration);
  const buf = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

function makeNoise(dur) {
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function initAudio() {
  if (audioReady) return;
  audioReady = true;

  ctx = new (window.AudioContext || window.webkitAudioContext)();

  outGain = ctx.createGain();
  outGain.gain.value = 1;

  master = ctx.createGain();
  master.gain.value = 0.85;

  comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.knee.value = 22;
  comp.ratio.value = 4;
  comp.attack.value = 0.004;
  comp.release.value = 0.25;

  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.8;
  freqData = new Uint8Array(analyser.frequencyBinCount);

  master.connect(comp);
  comp.connect(outGain);
  outGain.connect(analyser);
  analyser.connect(ctx.destination);

  // --- delay (ping-pong-ish) ---
  delayNode = ctx.createDelay(2.0);
  delayNode.delayTime.value = 0.375;
  delayFb = ctx.createGain();
  delayFb.gain.value = 0.36;
  delayNode.connect(delayFb);
  delayFb.connect(delayNode);

  const delayWet = ctx.createGain();
  delayWet.gain.value = 1.0;
  delayNode.connect(delayWet);
  delayWet.connect(master);

  // --- reverb ---
  reverbNode = ctx.createConvolver();
  reverbNode.buffer = makeImpulse(3.0, 2.6);
  const revWet = ctx.createGain();
  revWet.gain.value = 1.0;
  reverbNode.connect(revWet);
  revWet.connect(master);

  noiseBuf = makeNoise(2.0);
}

/** Connect a node to the dry path plus optional delay / reverb sends. */
function route(node, dry, del, rev) {
  const dg = ctx.createGain();
  dg.gain.value = dry;
  node.connect(dg);
  dg.connect(master);

  if (del > 0.001) {
    const s = ctx.createGain();
    s.gain.value = del;
    node.connect(s);
    s.connect(delayNode);
  }
  if (rev > 0.001) {
    const s = ctx.createGain();
    s.gain.value = rev;
    node.connect(s);
    s.connect(reverbNode);
  }
}

/* ============================================================
   Instruments
   ============================================================ */
function playKick(t) {
  const o = ctx.createOscillator();
  o.type = "sine";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(44, t + 0.12);

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.9, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);

  o.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t + 0.42);
}

function playHat(t, vel = 0.2, dur = 0.045) {
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf;
  s.playbackRate.value = 1;

  const hp = ctx.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 7200;

  const g = ctx.createGain();
  g.gain.setValueAtTime(vel, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  s.connect(hp);
  hp.connect(g);
  route(g, 1, 0.08, 0.05);
  s.start(t);
  s.stop(t + dur + 0.03);
}

function playSnare(t, vel = 0.32) {
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf;

  const bp = ctx.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 1900;
  bp.Q.value = 0.7;

  const g = ctx.createGain();
  g.gain.setValueAtTime(vel, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);

  s.connect(bp);
  bp.connect(g);
  route(g, 1, 0.14, 0.22);
  s.start(t);
  s.stop(t + 0.22);

  const o = ctx.createOscillator();
  o.type = "triangle";
  o.frequency.setValueAtTime(190, t);
  const g2 = ctx.createGain();
  g2.gain.setValueAtTime(vel * 0.45, t);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  o.connect(g2);
  g2.connect(master);
  o.start(t);
  o.stop(t + 0.11);
}

/**
 * Generic subtractive synth voice.
 * opts: type, gain, attack, cutoff, filterMul, q, oscs, spread, sendD, sendR
 */
function playVoice(t, freq, dur, opts = {}) {
  const peak   = opts.gain ?? 0.1;
  const attack = Math.max(0.002, opts.attack ?? 0.01);
  const cut    = opts.cutoff ?? 2000;
  const mul    = opts.filterMul ?? 3;

  const filt = ctx.createBiquadFilter();
  filt.type = "lowpass";
  filt.Q.value = opts.q ?? 1;
  const f0 = clamp(cut * mul, 60, 18000);
  const f1 = clamp(cut, 60, 18000);
  filt.frequency.setValueAtTime(f0, t);
  filt.frequency.exponentialRampToValueAtTime(f1, t + Math.min(attack + dur, 0.7));

  const amp = ctx.createGain();
  amp.gain.setValueAtTime(0.0001, t);
  amp.gain.exponentialRampToValueAtTime(peak, t + attack);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);

  filt.connect(amp);

  const n = opts.oscs ?? 2;
  const spread = opts.spread ?? 8;
  const type = opts.type ?? "sawtooth";
  const stopT = t + attack + dur + 0.06;

  for (let i = 0; i < n; i++) {
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = (i - (n - 1) / 2) * spread;
    osc.connect(filt);
    osc.start(t);
    osc.stop(stopT);
  }

  route(amp, 1, opts.sendD ?? 0.1, opts.sendR ?? 0.15);
}

/* ============================================================
   Composition state
   ============================================================ */
let state = null;
let step = 0;
let arpCount = 0;
let playing = false;
let timerId = null;
let nextNoteTime = 0;
let uiQueue = [];
let hue = 200;

const LOOKAHEAD = 0.1;   // seconds
const TICK_MS = 25;

function degToMidi(deg, scale, root, oct = 0) {
  const len = scale.length;
  const i = ((deg % len) + len) % len;
  const o = Math.floor(deg / len) + oct;
  return root + scale[i] + 12 * o;
}

function generatePiece() {
  const mood = pick(MOODS);
  const scaleName = pick(Object.keys(SCALES));
  const scale = SCALES[scaleName];
  const rootPc = Math.floor(Math.random() * 12);
  const root = 48 + rootPc;

  const bpm = Math.round(rand(mood.bpm[0], mood.bpm[1]));
  const prog = pick(PROGRESSIONS);

  // Build chords (triads, sometimes a 7th)
  const chords = prog.map(d => {
    const notes = [0, 2, 4].map(k => degToMidi(d + k, scale, root));
    if (chance(0.28)) notes.push(degToMidi(d + 6, scale, root));
    return notes;
  });

  // Roman-numeral labels
  const chordNames = prog.map(d => {
    const a = degToMidi(d, scale, root);
    const b = degToMidi(d + 2, scale, root);
    const c = degToMidi(d + 4, scale, root);
    const third = ((b - a) % 12 + 12) % 12;
    const fifth = ((c - a) % 12 + 12) % 12;
    let label = ROMAN[((d % 7) + 7) % 7];
    if (third === 3) label = label.toLowerCase();
    if (fifth === 6) label += "°";
    return label;
  });

  // --- drum patterns ---
  const kick = new Array(16).fill(false);
  const snare = new Array(16).fill(false);
  const hat = new Array(16).fill(false);

  kick[0] = true;
  if (chance(0.75)) kick[8] = true;
  [4, 12].forEach(i => { if (chance(mood.drums * 0.45)) kick[i] = true; });
  [6, 10, 14].forEach(i => { if (chance(mood.drums * 0.22)) kick[i] = true; });

  snare[4] = true;
  snare[12] = true;
  if (chance(mood.drums * 0.35)) snare[7] = true;
  if (chance(mood.drums * 0.30)) snare[15] = true;

  for (let i = 0; i < 16; i++) {
    hat[i] = chance((i % 2 === 0 ? 0.45 : 0.22) + mood.drums * 0.4);
  }
  hat[0] = false;

  // --- bass pattern ---
  const bassPat = new Array(16).fill(false);
  bassPat[0] = true;
  if (chance(0.6)) bassPat[8] = true;
  [3, 6, 10, 11, 13, 14].forEach(i => { if (chance(0.22)) bassPat[i] = true; });

  // --- arp pattern ---
  const arpPat = new Array(16).fill(false);
  for (let i = 0; i < 16; i++) {
    arpPat[i] = chance(mood.dens * (i % 2 === 0 ? 1 : 0.65));
  }

  // --- timbre ---
  const timbre = {
    padType: pick(["sawtooth", "triangle", "sine"]),
    padCut: rand(mood.cut[0], mood.cut[1]),
    padSpread: rand(7, 20),
    bassType: pick(["sine", "triangle", "sawtooth"]),
    bassCut: rand(280, 780),
    arpType: pick(["triangle", "square", "sawtooth", "sine"]),
    arpCut: rand(1400, 4200),
    rev: mood.rev,
    del: mood.del
  };

  // Arp note order (permutation with repeats)
  const order = [0, 1, 2, 3];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  if (chance(0.5)) order.push(order[1]);

  state = {
    mood, scaleName, scale, root, rootPc, bpm,
    bars: 4, chords, chordNames, timbre,
    drums: { kick, snare, hat },
    bassPat, arpPat, arpOrder: order
  };

  hue = Math.floor(Math.random() * 360);
  step = 0;
  arpCount = 0;
  uiQueue = [];

  renderInfo();
  renderChords();
}

/* ============================================================
   Sequencer
   ============================================================ */
function scheduleStep(s, t) {
  const barIdx = Math.floor(s / 16) % state.bars;
  const b = s % 16;
  const chord = state.chords[barIdx];
  const barDur = (60 / state.bpm) * 4;
  const T = state.timbre;

  // ---- Downbeat: pad + long bass ----
  if (b === 0) {
    uiQueue.push({ t, idx: barIdx });

    chord.forEach((n, i) => {
      playVoice(t + i * 0.03, mtof(n + 12), barDur * 0.9, {
        type: T.padType,
        gain: 0.05,
        attack: barDur * 0.22,
        cutoff: T.padCut,
        filterMul: 1.0,
        q: 0.7,
        oscs: 3,
        spread: T.padSpread,
        sendD: T.del * 0.5,
        sendR: T.rev
      });
    });

    playVoice(t, mtof(chord[0] - 12), barDur * 0.42, {
      type: T.bassType,
      gain: 0.17,
      attack: 0.012,
      cutoff: T.bassCut,
      filterMul: 4,
      oscs: 1,
      sendD: 0,
      sendR: T.rev * 0.2
    });
  }

  // ---- Drums ----
  if (state.drums.kick[b])  playKick(t);
  if (state.drums.snare[b]) playSnare(t, 0.30);
  if (state.drums.hat[b])   playHat(t, 0.16, 0.04);

  // ---- Bass stabs ----
  if (state.bassPat[b] && b !== 0) {
    playVoice(t, mtof(chord[0] - 12), 0.18, {
      type: T.bassType,
      gain: 0.13,
      attack: 0.006,
      cutoff: T.bassCut,
      filterMul: 5,
      oscs: 1,
      sendD: 0,
      sendR: T.rev * 0.15
    });
  }

  // ---- Arpeggio ----
  if (state.arpPat[b]) {
    const pool = chord.map(n => n + 12);
    const ord = state.arpOrder;
    const idx = ord[arpCount % ord.length] % pool.length;
    const note = pool[idx] + (chance(0.12) ? 12 : 0);
    arpCount++;

    playVoice(t, mtof(note), 0.20, {
      type: T.arpType,
      gain: 0.075,
      attack: 0.004,
      cutoff: T.arpCut,
      filterMul: 3.5,
      q: 2.5,
      oscs: 1,
      sendD: T.del,
      sendR: T.rev * 0.7
    });
  }
}

function scheduler() {
  if (!ctx) return;
  const stepDur = (60 / state.bpm) / 4; // 16th notes
  while (nextNoteTime < ctx.currentTime + LOOKAHEAD) {
    scheduleStep(step, nextNoteTime);
    nextNoteTime += stepDur;
    step = (step + 1) % (16 * state.bars);
  }
}

/* ============================================================
   Transport
   ============================================================ */
const btnPlay = document.getElementById("btn-play");
const btnNew  = document.getElementById("btn-new");
const volSlider = document.getElementById("vol");

function play() {
  initAudio();
  if (ctx.state === "suspended") ctx.resume();
  if (playing) return;

  playing = true;
  outGain.gain.cancelScheduledValues(ctx.currentTime);
  outGain.gain.setTargetAtTime(1, ctx.currentTime, 0.05);

  step = 0;
  arpCount = 0;
  uiQueue = [];
  nextNoteTime = ctx.currentTime + 0.08;

  clearInterval(timerId);
  timerId = setInterval(scheduler, TICK_MS);

  btnPlay.textContent = "Stop";
  btnPlay.classList.add("on");
}

function stop() {
  if (!playing) return;
  playing = false;
  clearInterval(timerId);
  timerId = null;
  uiQueue = [];

  if (ctx) {
    outGain.gain.cancelScheduledValues(ctx.currentTime);
    outGain.gain.setTargetAtTime(0, ctx.currentTime, 0.12);
  }

  btnPlay.textContent = "Play";
  btnPlay.classList.remove("on");
  setActiveChord(-1);
}

function newPiece() {
  generatePiece();
  if (playing && ctx) {
    nextNoteTime = ctx.currentTime + 0.06;
    uiQueue = [];
  }
}

btnPlay.addEventListener("click", () => (playing ? stop() : play()));
btnNew.addEventListener("click", newPiece);

volSlider.addEventListener("input", () => {
  if (!ctx) return;
  master.gain.setTargetAtTime(parseFloat(volSlider.value), ctx.currentTime, 0.02);
});

window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    playing ? stop() : play();
  } else if (e.key === "n" || e.key === "N") {
    newPiece();
  }
});

/* ============================================================
   UI
   ============================================================ */
const elMood = document.getElementById("i-mood");
const elKey = document.getElementById("i-key");
const elScale = document.getElementById("i-scale");
const elTempo = document.getElementById("i-tempo");
const elChords = document.getElementById("chords");

function renderInfo() {
  elMood.textContent = state.mood.name;
  elKey.textContent = NOTE_NAMES[state.rootPc];
  elScale.textContent = state.scaleName;
  elTempo.textContent = state.bpm + " BPM";
}

function renderChords() {
  elChords.innerHTML = "";
  state.chordNames.forEach((name, i) => {
    const d = document.createElement("div");
    d.className = "chip";
    d.textContent = name;
    d.dataset.idx = i;
    elChords.appendChild(d);
  });
}

let activeIdx = -1;
function setActiveChord(idx) {
  if (idx === activeIdx) return;
  activeIdx = idx;
  [...elChords.children].forEach((el, i) => {
    el.classList.toggle("active", i === idx);
  });
}

/* ============================================================
   Visualizer
   ============================================================ */
const canvas = document.getElementById("viz");
const g = canvas.getContext("2d");
let W = 0, H = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

let glow = 0;

function draw() {
  requestAnimationFrame(draw);
  if (!W || !H) return;

  // trailing fade
  g.fillStyle = "rgba(4, 5, 10, 0.24)";
  g.fillRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H * 0.44;
  const baseR = Math.min(W, H) * 0.13;

  // pull frequency data
  let bass = 0;
  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    let s = 0;
    for (let i = 1; i < 14; i++) s += freqData[i];
    bass = s / (13 * 255);
  }
  glow += (bass - glow) * 0.18;

  // central glow
  const grad = g.createRadialGradient(cx, cy, 0, cx, cy, baseR * 3.4);
  grad.addColorStop(0, `hsla(${hue}, 92%, 66%, ${0.16 + glow * 0.4})`);
  grad.addColorStop(0.45, `hsla(${hue + 45}, 90%, 55%, ${0.06 + glow * 0.12})`);
  grad.addColorStop(1, "hsla(0, 0%, 0%, 0)");
  g.fillStyle = grad;
  g.beginPath();
  g.arc(cx, cy, baseR * 3.4, 0, Math.PI * 2);
  g.fill();

  // radial spectrum bars
  const N = 104;
  const r1 = baseR + 8;
  const maxLen = Math.min(W, H) * 0.24;
  g.lineCap = "round";

  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2;

    let v = 0;
    if (analyser) {
      const idx = Math.floor(Math.pow(i / N, 1.5) * freqData.length * 0.42);
      v = freqData[Math.min(idx, freqData.length - 1)] / 255;
    }
    v = v * v * 0.7 + v * 0.3;

    const len = 6 + v * maxLen;
    const ca = Math.cos(a), sa = Math.sin(a);

    g.strokeStyle = `hsla(${hue + (i / N) * 110}, 88%, ${42 + v * 34}%, ${0.18 + v * 0.8})`;
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(cx + ca * r1, cy + sa * r1);
    g.lineTo(cx + ca * (r1 + len), cy + sa * (r1 + len));
    g.stroke();
  }

  // inner pulsing ring
  g.beginPath();
  g.arc(cx, cy, baseR * (0.86 + glow * 0.3), 0, Math.PI * 2);
  g.strokeStyle = `hsla(${hue}, 90%, 72%, ${0.18 + glow * 0.5})`;
  g.lineWidth = 2;
  g.stroke();

  // ---- UI sync ----
  if (ctx) {
    const now = ctx.currentTime;
    while (uiQueue.length && uiQueue[0].t <= now) {
      const e = uiQueue.shift();
      setActiveChord(e.idx);
    }
  }
}

/* ============================================================
   Go
   ============================================================ */
generatePiece();
draw();

})();
</script>
