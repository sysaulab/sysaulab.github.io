<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON SWARM</title>
<style>
  html,body{margin:0;height:100%;background:#07070c;overflow:hidden;}
  canvas{display:block;cursor:crosshair;}
  *{user-select:none;-webkit-user-select:none;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- setup
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- helpers
const rand    = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const clamp   = (v,a,b) => v < a ? a : (v > b ? b : v);
const TAU     = Math.PI*2;

const PLAYER_SPEED = 360;
const HIT_INVULN   = 1.3;

// chaser rage: speed multiplier grows with time alive, capped
const RAGE_RAMP   = 0.09;   // +9% speed per second alive
const RAGE_CAP    = 10;     // caps at 10 seconds → 1.90× base speed
// chaser flank: personal tangent offset, fades out as they close in
const FLANK_MAX   = 0.75;   // ~43 degrees
const FLANK_NEAR  = 60;     // fully straight at this distance
const FLANK_FAR   = 260;    // full flank at this distance

function rgba(hex, a){
  const n = parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  w = Math.max(0,w); h = Math.max(0,h);
  if (w === 0 || h === 0) return;
  r = Math.min(r, w/2, h/2);
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function pointInRect(px,py,r){
  return r.w > 0 && px >= r.x && px <= r.x+r.w && py >= r.y && py <= r.y+r.h;
}

// ---------------------------------------------------------------- audio
let audioCtx = null, masterGain = null, muted = false;

function initAudio(){
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.34;
    masterGain.connect(audioCtx.destination);
  } catch(e){ audioCtx = null; }
}
function resumeAudio(){
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function toggleMute(){
  muted = !muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.34;
}

function tone(freq, dur, type, vol, slideTo, delay){
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
  const atk = Math.min(0.006, dur * 0.3);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol), t0 + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}

function noise(dur, vol, cutoff, delay){
  if (!audioCtx || muted) return;
  const t0  = audioCtx.currentTime + (delay || 0);
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d   = buf.getChannelData(0);
  for (let i = 0; i < len; i++){
    d[i] = (Math.random()*2 - 1) * (1 - i/len);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = cutoff || 1200;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t0);
}

let shootFlip = false;
function sfxShoot(){
  shootFlip = !shootFlip;
  if (!shootFlip) return;
  tone(1050 + rand(-120,120), 0.05, 'square', 0.028, 420);
}
function sfxHit(){
  tone(540 + rand(-60,60), 0.04, 'square', 0.045, 250);
}
function sfxKill(big){
  if (big){ noise(0.22, 0.22, 700); tone(160, 0.26, 'sawtooth', 0.13, 50); }
  else    { noise(0.12, 0.14, 1000); tone(270, 0.12, 'sawtooth', 0.08, 90); }
}
function sfxHurt(){
  noise(0.3, 0.26, 600);
  tone(180, 0.34, 'sawtooth', 0.17, 55);
}
function sfxDash(){
  tone(250, 0.18, 'sine', 0.12, 920);
  noise(0.1, 0.08, 2200);
}
function sfxPickup(){
  tone(660, 0.09, 'sine', 0.14, 0, 0);
  tone(990, 0.13, 'sine', 0.14, 0, 0.08);
}
function sfxWaveStart(){
  tone(330, 0.13, 'square', 0.075, 0, 0);
  tone(440, 0.13, 'square', 0.075, 0, 0.1);
  tone(660, 0.22, 'square', 0.085, 0, 0.2);
}
function sfxWaveClear(){
  tone(880, 0.1,  'sine', 0.12, 0, 0);
  tone(660, 0.1,  'sine', 0.12, 0, 0.09);
  tone(990, 0.24, 'sine', 0.13, 0, 0.18);
}
function sfxGameOver(){
  tone(400, 0.3, 'sawtooth', 0.14, 200, 0);
  tone(300, 0.3, 'sawtooth', 0.14, 150, 0.15);
  tone(200, 0.75,'sawtooth', 0.16, 60,  0.3);
  noise(0.6, 0.2, 500, 0.3);
}
function sfxClick(){
  tone(700, 0.05, 'square', 0.08, 950);
}

// ---------------------------------------------------------------- difficulty
const DIFFICULTIES = {
  easy:   { name:'EASY',   color:'#80ffb4', speedMul:0.80, dmgMul:0.60, hpMul:0.80,
            countMul:0.70, spawnMul:1.45, capMul:0.70, blurb:'Fewer, weaker foes' },
  normal: { name:'NORMAL', color:'#4cc9f0', speedMul:1.00, dmgMul:1.00, hpMul:1.00,
            countMul:1.00, spawnMul:1.00, capMul:1.00, blurb:'The intended fight' },
  hard:   { name:'HARD',   color:'#ff4d6d', speedMul:1.22, dmgMul:1.35, hpMul:1.20,
            countMul:1.35, spawnMul:0.72, capMul:1.30, blurb:'Fast and relentless' }
};
let selectedDiff = 'normal';
let activeDiff   = DIFFICULTIES.normal;

let bests = { easy:0, normal:0, hard:0 };
try {
  const raw = localStorage.getItem('neonswarm_bests');
  if (raw){
    const parsed = JSON.parse(raw);
    for (const k in bests) if (typeof parsed[k] === 'number') bests[k] = parsed[k];
  }
} catch(e){}
function saveBests(){
  try { localStorage.setItem('neonswarm_bests', JSON.stringify(bests)); } catch(e){}
}

// ---------------------------------------------------------------- input
const keys  = {};
const mouse = { x: 0, y: 0, down: false };

let diffButtons = {};
let startButton = { x:0, y:0, w:0, h:0 };
let muteBtn     = { x:0, y:0, w:0, h:0 };

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();

  initAudio(); resumeAudio();

  if (k === 'm'){ toggleMute(); return; }

  if (state !== 'playing'){
    if (k === '1'){ selectedDiff = 'easy';   sfxClick(); return; }
    if (k === '2'){ selectedDiff = 'normal'; sfxClick(); return; }
    if (k === '3'){ selectedDiff = 'hard';   sfxClick(); return; }
    if (k === ' ' || k === 'enter' || k === 'r'){ startGame(); }
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  mouse.down = true;

  initAudio(); resumeAudio();

  if (pointInRect(e.clientX, e.clientY, muteBtn)){ toggleMute(); return; }

  if (state === 'menu'){
    for (const k in diffButtons){
      if (pointInRect(e.clientX, e.clientY, diffButtons[k])){
        selectedDiff = k;
        sfxClick();
        return;
      }
    }
    if (pointInRect(e.clientX, e.clientY, startButton)){
      startGame();
    }
    return;
  }

  if (state === 'gameover') startGame();
});

window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------- state
let state = 'menu';
let player = null;
let bullets = [], ebullets = [], enemies = [], particles = [], pickups = [];
let score = 0, wave = 0, waveState = 'break', waveTimer = 1.2;
let spawnQueue = [], spawnTimer = 0, shake = 0, time = 0;

function startGame(){
  activeDiff = DIFFICULTIES[selectedDiff];

  player = {
    x: W/2, y: H/2, r: 14, angle: 0,
    hp: 100, maxHp: 100,
    fireCd: 0, dashCd: 0, dashTime: 0, invuln: 1.2
  };
  bullets = []; ebullets = []; enemies = []; particles = []; pickups = [];
  score = 0; wave = 0;
  waveState = 'break'; waveTimer = 1.5;
  spawnQueue = []; spawnTimer = 0;
  shake = 0; time = 0;
  state = 'playing';

  initAudio(); resumeAudio();
  sfxClick();
}

// ---------------------------------------------------------------- particles
function burst(x, y, color, count, speed){
  for (let i = 0; i < count; i++){
    const a = Math.random()*TAU;
    const s = rand(speed*0.15, speed);
    const l = rand(0.25, 0.7);
    particles.push({
      x, y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: l, max: l,
      color, size: rand(1.5, 3.5)
    });
  }
}

// ---------------------------------------------------------------- enemies
function makeEnemy(type){
  const w = wave;
  const D = activeDiff;

  if (type === 'shooter'){
    const hp = (22 + w*4) * D.hpMul;
    return { type, r: 15, hp, maxHp: hp, speed: 58 * D.speedMul, dmg: 7 * D.dmgMul,
             color: '#c77dff', score: 20, touchCd: 0, flash: 0, kx: 0, ky: 0,
             fireCd: rand(1.5, 2.8) / D.speedMul, x: 0, y: 0 };
  }
  if (type === 'tank'){
    const hp = (70 + w*12) * D.hpMul;
    return { type, r: 26, hp, maxHp: hp,
             speed: Math.min(42 + w*1.5, 78) * D.speedMul, dmg: 16 * D.dmgMul,
             color: '#ffb703', score: 50, touchCd: 0, flash: 0, kx: 0, ky: 0, x: 0, y: 0 };
  }
  // chaser — now with rage + flank
  const hp = (16 + w*3.5) * D.hpMul;
  const baseSpeed = Math.min(62 + w*3.5, 168) * D.speedMul;
  return { type: 'chaser', r: 13, hp, maxHp: hp,
           baseSpeed, speed: baseSpeed,
           rage: 0, flank: rand(-FLANK_MAX, FLANK_MAX),
           dmg: 8 * D.dmgMul,
           color: '#ff4d6d', score: 10, touchCd: 0, flash: 0, kx: 0, ky: 0, x: 0, y: 0 };
}

function spawnEnemy(type){
  const pad = 70;
  const side = randInt(0, 3);
  let x, y;
  if (side === 0){ x = rand(0, W); y = -pad; }
  else if (side === 1){ x = W + pad; y = rand(0, H); }
  else if (side === 2){ x = rand(0, W); y = H + pad; }
  else { x = -pad; y = rand(0, H); }

  const e = makeEnemy(type);
  e.x = x; e.y = y;
  enemies.push(e);
}

function startWave(){
  wave++;
  const D = activeDiff;
  spawnQueue = [];

  const count = Math.max(1, Math.round((2 + Math.floor(wave * 0.9)) * D.countMul));
  for (let i = 0; i < count; i++){
    let type = 'chaser';
    const r = Math.random();
    if (wave >= 4 && r < 0.25) type = 'shooter';
    else if (wave >= 5 && r > 0.90) type = 'tank';
    spawnQueue.push({ type, t: i * 0.55 * D.spawnMul });
  }
  spawnTimer = 0;
  waveState = 'spawning';
  sfxWaveStart();
}

function killEnemy(idx){
  const e = enemies[idx];
  burst(e.x, e.y, e.color, e.type === 'tank' ? 30 : 14, e.type === 'tank' ? 430 : 300);
  shake = Math.max(shake, e.type === 'tank' ? 13 : 5);
  score += e.score;
  sfxKill(e.type === 'tank');
  if (Math.random() < 0.14) pickups.push({ x: e.x, y: e.y, r: 10, life: 14, t: 0 });
  enemies.splice(idx, 1);
}

function shootAtPlayer(e){
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  ebullets.push({
    x: e.x, y: e.y,
    vx: Math.cos(a)*300, vy: Math.sin(a)*300,
    r: 5, life: 4, dmg: 7 * activeDiff.dmgMul
  });
  tone(320, 0.08, 'sawtooth', 0.05, 200);
}

// ---------------------------------------------------------------- damage
function damagePlayer(d){
  if (state !== 'playing' || player.invuln > 0) return;
  player.hp -= d;
  player.invuln = HIT_INVULN;
  shake = Math.max(shake, 14);
  burst(player.x, player.y, '#ff4d6d', 16, 320);
  sfxHurt();

  for (const e of enemies){
    const dx = e.x - player.x, dy = e.y - player.y;
    const dist = Math.hypot(dx, dy) || 1;
    if (dist < 260){
      const f = 1 - dist/260;
      e.kx += (dx/dist) * 1100 * f;
      e.ky += (dy/dist) * 1100 * f;
      e.touchCd = Math.max(e.touchCd, 1.1);
    }
  }
  for (let i = 0; i < 22; i++){
    const a = i/22 * TAU;
    particles.push({
      x: player.x, y: player.y,
      vx: Math.cos(a)*rand(320,520), vy: Math.sin(a)*rand(320,520),
      life: 0.45, max: 0.45, color: '#ff9bb0', size: rand(2,4)
    });
  }

  if (player.hp <= 0){
    player.hp = 0;
    gameOver();
  }
}

function gameOver(){
  state = 'gameover';
  burst(player.x, player.y, '#4cc9f0', 40, 520);
  burst(player.x, player.y, '#ffffff', 20, 300);
  shake = 22;
  sfxGameOver();
  if (score > bests[selectedDiff]){
    bests[selectedDiff] = score;
    saveBests();
  }
}

// ---------------------------------------------------------------- update
function update(dt){
  time += dt;
  shake = Math.max(0, shake - dt*45);

  const damp = Math.pow(0.1, dt);
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= damp; p.vy *= damp;
  }

  if (state !== 'playing' || !player) return;

  const p = player;
  p.invuln   = Math.max(0, p.invuln - dt);
  p.fireCd   = Math.max(0, p.fireCd - dt);
  p.dashCd   = Math.max(0, p.dashCd - dt);
  p.dashTime = Math.max(0, p.dashTime - dt);

  let mx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  let my = (keys['s'] || keys['arrowdown']  ? 1 : 0) - (keys['w'] || keys['arrowup']   ? 1 : 0);
  const ml = Math.hypot(mx, my);
  if (ml > 0){ mx /= ml; my /= ml; }

  if ((keys[' '] || keys['shift']) && p.dashCd <= 0){
    p.dashTime = 0.15;
    p.dashCd = 1.2;
    p.invuln = Math.max(p.invuln, 0.36);
    burst(p.x, p.y, '#4cc9f0', 14, 260);
    shake = Math.max(shake, 5);
    sfxDash();
  }

  const spd = p.dashTime > 0 ? 980 : PLAYER_SPEED;
  p.x += mx * spd * dt;
  p.y += my * spd * dt;
  p.x = clamp(p.x, p.r, W - p.r);
  p.y = clamp(p.y, p.r, H - p.r);

  if (p.dashTime > 0){
    particles.push({
      x: p.x, y: p.y, vx: rand(-30,30), vy: rand(-30,30),
      life: 0.3, max: 0.3, color: '#4cc9f0', size: rand(3,6)
    });
  }

  p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);

  if (mouse.down && p.fireCd <= 0){
    p.fireCd = 0.095;
    const a = p.angle + rand(-0.03, 0.03);
    bullets.push({
      x: p.x + Math.cos(a)*18, y: p.y + Math.sin(a)*18,
      vx: Math.cos(a)*1000, vy: Math.sin(a)*1000,
      r: 3.5, dmg: 12, life: 1.2
    });
    for (let i = 0; i < 3; i++){
      const sa = a + rand(-0.6, 0.6);
      particles.push({
        x: p.x + Math.cos(a)*20, y: p.y + Math.sin(a)*20,
        vx: Math.cos(sa)*rand(60,220), vy: Math.sin(sa)*rand(60,220),
        life: 0.18, max: 0.18, color: '#9bf6ff', size: rand(1.5,3)
      });
    }
    shake = Math.max(shake, 2.5);
    sfxShoot();
  }

  // --- wave logic
  const MAX_ALIVE = Math.round(11 * activeDiff.capMul);

  if (waveState === 'break'){
    waveTimer -= dt;
    if (waveTimer <= 0) startWave();
  } else if (waveState === 'spawning'){
    spawnTimer += dt;
    while (spawnQueue.length && spawnQueue[0].t <= spawnTimer && enemies.length < MAX_ALIVE){
      spawnEnemy(spawnQueue.shift().type);
    }
    if (!spawnQueue.length) waveState = 'fighting';
  } else if (waveState === 'fighting'){
    if (enemies.length === 0){
      waveState = 'break';
      waveTimer = 2.6;
      sfxWaveClear();
    }
  }

  // --- enemies
  const kd = Math.exp(-7 * dt);
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    e.flash = Math.max(0, e.flash - dt);
    e.touchCd -= dt;

    e.x += e.kx * dt;
    e.y += e.ky * dt;
    e.kx *= kd; e.ky *= kd;

    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx/d, ny = dy/d;

    if (e.type === 'chaser'){
      // --- rage: speed grows the longer it's alive ---
      e.rage += dt;
      e.speed = e.baseSpeed * (1 + Math.min(e.rage, RAGE_CAP) * RAGE_RAMP);

      // --- flank: personal tangent, fades out at close range ---
      const fade = clamp((d - FLANK_NEAR) / (FLANK_FAR - FLANK_NEAR), 0, 1);
      const fa = Math.atan2(dy, dx) + e.flank * fade;

      e.x += Math.cos(fa) * e.speed * dt;
      e.y += Math.sin(fa) * e.speed * dt;
    } else if (e.type === 'tank'){
      e.x += nx * e.speed * dt;
      e.y += ny * e.speed * dt;
    } else {
      // shooter
      const want = 250;
      let move = 0;
      if (d < want - 50) move = -1;
      else if (d > want + 50) move = 1;
      e.x += nx * e.speed * move * dt;
      e.y += ny * e.speed * move * dt;
      e.x += -ny * e.speed * 0.65 * dt;
      e.y +=  nx * e.speed * 0.65 * dt;

      e.fireCd -= dt;
      if (e.fireCd <= 0){
        e.fireCd = Math.max(1.2, 3.0 - wave*0.1) / activeDiff.speedMul;
        shootAtPlayer(e);
      }
    }

    if (d < e.r + p.r && e.touchCd <= 0){
      e.touchCd = 1.0;
      damagePlayer(e.dmg);
      e.kx -= nx * 950;
      e.ky -= ny * 950;
      p.x += nx * 36;
      p.y += ny * 36;
      p.x = clamp(p.x, p.r, W - p.r);
      p.y = clamp(p.y, p.r, H - p.r);
    }
  }

  for (let i = 0; i < enemies.length; i++){
    const a = enemies[i];
    for (let j = i + 1; j < enemies.length; j++){
      const b = enemies[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.hypot(dx, dy) || 0.01;
      const min = a.r + b.r;
      if (d < min){
        const push = (min - d) / 2;
        dx /= d; dy /= d;
        a.x -= dx*push; a.y -= dy*push;
        b.x += dx*push; b.y += dy*push;
      }
    }
  }

  // --- player bullets
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life <= 0 || b.x < -30 || b.x > W+30 || b.y < -30 || b.y > H+30){
      bullets.splice(i,1); continue;
    }
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r){
        e.hp -= b.dmg;
        e.flash = 0.08;
        burst(b.x, b.y, '#ffffff', 4, 190);
        sfxHit();
        if (e.hp <= 0) killEnemy(j);
        hit = true;
        break;
      }
    }
    if (hit) bullets.splice(i,1);
  }

  // --- enemy bullets
  for (let i = ebullets.length - 1; i >= 0; i--){
    const b = ebullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life <= 0 || b.x < -40 || b.x > W+40 || b.y < -40 || b.y > H+40){
      ebullets.splice(i,1); continue;
    }
    if (p.invuln <= 0 && Math.hypot(b.x - p.x, b.y - p.y) < b.r + p.r){
      damagePlayer(b.dmg);
      burst(b.x, b.y, '#c77dff', 8, 220);
      ebullets.splice(i,1);
    }
  }

  // --- pickups
  for (let i = pickups.length - 1; i >= 0; i--){
    const k = pickups[i];
    k.life -= dt; k.t += dt;
    if (k.life <= 0){ pickups.splice(i,1); continue; }
    if (Math.hypot(k.x - p.x, k.y - p.y) < k.r + p.r + 6){
      p.hp = Math.min(p.maxHp, p.hp + 30);
      burst(k.x, k.y, '#80ffb4', 14, 260);
      sfxPickup();
      pickups.splice(i,1);
    }
  }
}

// ---------------------------------------------------------------- render
function drawGrid(){
  const g = 64;
  ctx.strokeStyle = 'rgba(80,130,210,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x < W; x += g){ ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (let y = 0; y < H; y += g){ ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();
}

function drawEnemy(e){
  const col = e.flash > 0 ? '#ffffff' : e.color;

  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rgba(e.color, 0.10);
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r * 2.1, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = col;

  if (e.type === 'chaser'){
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(Math.atan2(player.y - e.y, player.x - e.x));
    ctx.beginPath();
    ctx.moveTo(e.r, 0);
    ctx.lineTo(-e.r*0.8,  e.r*0.85);
    ctx.lineTo(-e.r*0.8, -e.r*0.85);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // --- rage tell: pulsing outer ring, brighter the angrier it gets ---
    if (e.rage > 2){
      const t = Math.min((e.rage - 2) / RAGE_CAP, 1);
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba('#ff4d6d', 0.15 + t * 0.40);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 4 + t*4 + Math.sin(time*11 + e.flank*12)*1.6, 0, TAU);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  } else if (e.type === 'shooter'){
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(time * 1.6);
    ctx.beginPath();
    ctx.rect(-e.r*0.72, -e.r*0.72, e.r*1.44, e.r*1.44);
    ctx.fill();
    ctx.restore();
  } else {
    ctx.beginPath();
    for (let i = 0; i < 6; i++){
      const a = i/6*TAU + time*0.4;
      const px = e.x + Math.cos(a)*e.r;
      const py = e.y + Math.sin(a)*e.r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  if (e.hp < e.maxHp){
    const w = e.r*2, h = 4;
    const x = e.x - w/2, y = e.y - e.r - 11;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = e.color;
    ctx.fillRect(x, y, w * Math.max(0, e.hp/e.maxHp), h);
  }
}

function drawPlayer(){
  const p = player;
  const blink = p.invuln > 0 && Math.floor(time*20) % 2 === 0;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle);
  ctx.shadowColor = '#4cc9f0';
  ctx.shadowBlur = 22;
  ctx.fillStyle = blink ? 'rgba(255,255,255,0.85)' : '#4cc9f0';
  ctx.beginPath();
  ctx.moveTo(19, 0);
  ctx.lineTo(-12, 11);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-12, -11);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(155,246,255,0.18)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(p.x + Math.cos(p.angle)*26, p.y + Math.sin(p.angle)*26);
  ctx.lineTo(p.x + Math.cos(p.angle)*200, p.y + Math.sin(p.angle)*200);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#07070c';
  ctx.fillRect(0, 0, W, H);
  drawGrid();

  const sx = shake > 0 ? rand(-shake, shake) : 0;
  const sy = shake > 0 ? rand(-shake, shake) : 0;
  ctx.save();
  ctx.translate(sx, sy);

  for (const k of pickups){
    const pulse = 1 + Math.sin(k.t*8)*0.15;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(128,255,180,0.13)';
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r*2.4*pulse, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#80ffb4';
    ctx.fillRect(k.x - 7, k.y - 2.5, 14, 5);
    ctx.fillRect(k.x - 2.5, k.y - 7, 5, 14);
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const pt of particles){
    const a = pt.life / pt.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, Math.max(0.3, pt.size * a), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  for (const e of enemies) drawEnemy(e);

  ctx.globalCompositeOperation = 'lighter';
  for (const b of ebullets){
    ctx.fillStyle = 'rgba(199,125,255,0.22)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e0aaff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets){
    ctx.fillStyle = 'rgba(155,246,255,0.25)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  if (state !== 'menu' && player) drawPlayer();

  ctx.restore();

  drawHUD();
  if (state === 'menu')     drawMenu();
  if (state === 'gameover') drawGameOver();
  drawMuteBtn();
}

function drawHUD(){
  if (state === 'menu' || !player) return;

  const bw = 240, bh = 14, bx = 26, by = 26;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  roundRect(ctx, bx, by, bw, bh, 7); ctx.fill();

  const hpr = clamp(player.hp / player.maxHp, 0, 1);
  if (hpr > 0){
    ctx.fillStyle = hpr > 0.5 ? '#4cc9f0' : hpr > 0.25 ? '#ffd166' : '#ff4d6d';
    roundRect(ctx, bx, by, bw * hpr, bh, 7); ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '600 12px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('HULL', bx, by - 8);

  const dw = 240, dh = 6, dy = by + bh + 10;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  roundRect(ctx, bx, dy, dw, dh, 3); ctx.fill();
  ctx.fillStyle = player.dashCd <= 0 ? '#9bf6ff' : 'rgba(155,246,255,0.35)';
  roundRect(ctx, bx, dy, dw * (1 - player.dashCd/1.2), dh, 3); ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '700 18px system-ui, -apple-system, sans-serif';
  ctx.fillText('WAVE ' + Math.max(1, wave), W/2, 40);

  ctx.fillStyle = rgba(activeDiff.color, 0.85);
  ctx.font = '700 11px ui-monospace, Menlo, monospace';
  ctx.fillText(activeDiff.name, W/2, 58);

  if (waveState === 'break' && wave > 0){
    ctx.fillStyle = 'rgba(155,246,255,0.9)';
    ctx.font = '700 26px system-ui, -apple-system, sans-serif';
    ctx.fillText('WAVE CLEARED', W/2, H/2 - 40);
  }

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '600 12px ui-monospace, Menlo, monospace';
  ctx.fillText('SCORE', W - 26, 26);
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 30px system-ui, -apple-system, sans-serif';
  ctx.fillText(String(score), W - 26, 58);
  ctx.textAlign = 'left';
}

function drawMenu(){
  ctx.fillStyle = 'rgba(5,5,12,0.84)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  const cx = W/2;

  ctx.save();
  ctx.shadowColor = '#4cc9f0';
  ctx.shadowBlur = 34;
  ctx.fillStyle = '#4cc9f0';
  ctx.font = '800 62px system-ui, -apple-system, sans-serif';
  ctx.fillText('NEON SWARM', cx, H/2 - 195);
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '500 13px ui-monospace, Menlo, monospace';
  ctx.fillText('survive the swarm · every wave harder than the last', cx, H/2 - 160);

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '500 15px ui-monospace, Menlo, monospace';
  ctx.fillText('WASD / Arrows — move', cx, H/2 - 112);
  ctx.fillText('Mouse — aim,  hold to shoot', cx, H/2 - 88);
  ctx.fillText('Space / Shift — dash  ·  M — mute', cx, H/2 - 64);

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '700 12px ui-monospace, Menlo, monospace';
  ctx.fillText('CHOOSE  DIFFICULTY', cx, H/2 - 22);

  const bw = 160, bh = 96, gap = 22;
  const totalW = bw*3 + gap*2;
  const bx0 = cx - totalW/2;
  const by  = H/2 + 4;

  diffButtons = {};
  const order = ['easy','normal','hard'];
  order.forEach((k, i) => {
    const x = bx0 + i*(bw + gap);
    diffButtons[k] = { x, y: by, w: bw, h: bh };
    const D = DIFFICULTIES[k];
    const sel = selectedDiff === k;

    if (sel){
      ctx.save();
      ctx.shadowColor = D.color;
      ctx.shadowBlur = 22;
      ctx.fillStyle = rgba(D.color, 0.16);
      roundRect(ctx, x, by, bw, bh, 10); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      roundRect(ctx, x, by, bw, bh, 10); ctx.fill();
    }

    ctx.strokeStyle = sel ? D.color : 'rgba(255,255,255,0.14)';
    ctx.lineWidth   = sel ? 2.5 : 1.5;
    roundRect(ctx, x, by, bw, bh, 10); ctx.stroke();

    ctx.fillStyle = sel ? D.color : 'rgba(255,255,255,0.72)';
    ctx.font = '800 22px system-ui, -apple-system, sans-serif';
    ctx.fillText(D.name, x + bw/2, by + 40);

    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '500 11px ui-monospace, Menlo, monospace';
    ctx.fillText(D.blurb, x + bw/2, by + 62);

    const b = bests[k] || 0;
    ctx.fillStyle = sel ? rgba(D.color, 0.75) : 'rgba(255,255,255,0.28)';
    ctx.font = '700 11px ui-monospace, Menlo, monospace';
    ctx.fillText('BEST ' + b, x + bw/2, by + 82);
  });

  const sw = 260, sh = 58;
  const sx = cx - sw/2, sy = by + bh + 34;
  startButton = { x: sx, y: sy, w: sw, h: sh };

  const pulse = 0.6 + Math.sin(time*4) * 0.4;
  ctx.save();
  ctx.shadowColor = activeDiff.color;
  ctx.shadowBlur = 26 * pulse;
  ctx.fillStyle = rgba(activeDiff.color, 0.22 + 0.12*pulse);
  roundRect(ctx, sx, sy, sw, sh, 12); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = activeDiff.color;
  ctx.lineWidth = 2.5;
  roundRect(ctx, sx, sy, sw, sh, 12); ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 24px system-ui, -apple-system, sans-serif';
  ctx.fillText('START', cx, sy + 38);

  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.font = '500 11px ui-monospace, Menlo, monospace';
  ctx.fillText('click a difficulty  ·  press 1 / 2 / 3  ·  space to begin', cx, sy + sh + 26);

  ctx.textAlign = 'left';
}

function drawGameOver(){
  ctx.fillStyle = 'rgba(5,5,12,0.82)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  const cx = W/2;

  ctx.save();
  ctx.shadowColor = '#ff4d6d';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#ff4d6d';
  ctx.font = '800 56px system-ui, -apple-system, sans-serif';
  ctx.fillText('GAME OVER', cx, H/2 - 80);
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '600 12px ui-monospace, Menlo, monospace';
  ctx.fillText('SCORE', cx, H/2 - 40);

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 44px system-ui, -apple-system, sans-serif';
  ctx.fillText(String(score), cx, H/2 + 2);

  ctx.fillStyle = rgba(activeDiff.color, 0.9);
  ctx.font = '700 13px ui-monospace, Menlo, monospace';
  ctx.fillText(activeDiff.name + '  ·  wave ' + wave, cx, H/2 + 32);

  const b = bests[selectedDiff] || 0;
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '500 13px ui-monospace, Menlo, monospace';
  ctx.fillText((score >= b ? 'NEW BEST!' : 'best ' + b), cx, H/2 + 56);

  const pulse = 0.55 + Math.sin(time*4) * 0.45;
  ctx.fillStyle = 'rgba(155,246,255,' + pulse + ')';
  ctx.font = '700 19px system-ui, -apple-system, sans-serif';
  ctx.fillText('CLICK  or  PRESS  SPACE  TO  RETRY', cx, H/2 + 116);

  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '500 12px ui-monospace, Menlo, monospace';
  ctx.fillText('press  M  to go back to menu', cx, H/2 + 146);

  ctx.textAlign = 'left';
}

function drawMuteBtn(){
  const s = 40;
  muteBtn.x = W - s - 18;
  muteBtn.y = H - s - 18;
  muteBtn.w = s; muteBtn.h = s;

  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  roundRect(ctx, muteBtn.x, muteBtn.y, s, s, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 1;
  roundRect(ctx, muteBtn.x, muteBtn.y, s, s, 8); ctx.stroke();

  const cx = muteBtn.x + s/2, cy = muteBtn.y + s/2;
  ctx.fillStyle = muted ? 'rgba(255,255,255,0.28)' : 'rgba(155,246,255,0.9)';
  ctx.beginPath();
  ctx.moveTo(cx-8, cy-4);
  ctx.lineTo(cx-3, cy-4);
  ctx.lineTo(cx+3, cy-9);
  ctx.lineTo(cx+3, cy+9);
  ctx.lineTo(cx-3, cy+4);
  ctx.lineTo(cx-8, cy+4);
  ctx.closePath();
  ctx.fill();

  if (muted){
    ctx.strokeStyle = '#ff4d6d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx-10, cy-10); ctx.lineTo(cx+10, cy+10);
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(155,246,255,0.6)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(cx+5, cy, 7, -0.9, 0.9);
    ctx.stroke();
  }
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
