<title>The Village — a point and click escape</title>
<style>
  :root{ --cream:#f2ede0; --gold:#e8b04b; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#101312;color:var(--cream);
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
    overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  #game{height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #stageWrap{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 8px 0}
  #stage{position:relative;border-radius:5px;overflow:hidden;background:#000;
    box-shadow:0 0 0 1px #2a3230, 0 10px 34px rgba(0,0,0,.65)}
  #art,#art svg{width:100%;height:100%;display:block}
  #hotspots{position:absolute;inset:0}
  .hs{position:absolute;border-radius:6px;cursor:pointer;transition:background .15s}
  .hs:active{background:rgba(255,255,255,.16)}
  .hs.flash{background:rgba(232,176,75,.22);box-shadow:inset 0 0 0 2px rgba(232,176,75,.75);
    animation:pulse .55s ease-in-out 3}
  @keyframes pulse{50%{background:rgba(232,176,75,.05)}}
  #hint{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;z-index:5;
    background:rgba(16,20,19,.7);color:var(--gold);border:1px solid rgba(232,176,75,.55);
    font:600 16px/1 system-ui,sans-serif;cursor:pointer}
  #hint:active{background:rgba(232,176,75,.25)}
  #text{flex:0 0 auto;padding:10px 16px 4px;font-size:15px;line-height:1.5;
    min-height:84px;max-height:26vh;overflow-y:auto;color:#e6e0d2}
  #text b{color:#f8f4e8}
  #text i{color:#c9c2b0}
  .hint{color:#98a39e;font-size:13px}
  #actions{flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;align-items:center;
    padding:4px 12px;min-height:56px;scrollbar-width:none}
  #actions::-webkit-scrollbar{display:none}
  .act{flex:0 0 auto;background:#212a28;color:var(--cream);border:1px solid #3a4642;
    border-radius:999px;padding:0 18px;min-height:44px;white-space:nowrap;cursor:pointer;
    font:500 14px/1 system-ui,sans-serif}
  .act:active{background:#3a4642}
  #inv{flex:0 0 auto;display:flex;gap:8px;align-items:center;overflow-x:auto;
    padding:4px 12px 10px;min-height:74px;scrollbar-width:none}
  #inv::-webkit-scrollbar{display:none}
  .inv{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:#1a2220;border:1px solid #313b38;border-radius:11px;padding:6px 10px;
    min-width:58px;min-height:56px;color:#e8e2d4;cursor:pointer;
    font:500 10px/1.15 system-ui,sans-serif;text-align:center}
  .inv .ic{font-size:21px;line-height:1}
  .inv.sel{border-color:var(--gold);background:#2b2a1c;box-shadow:inset 0 0 0 1px var(--gold)}

<div id="game">

  <div id="inv"></div>

   THE VILLAGE
   ========================================================= */
const $ = id => document.getElementById(id);

      textEl=$('text'), actEl=$('actions'), invEl=$('inv'), overlay=$('overlay');

const state = { scene:null, inv:[], sel:null, hs:null };
const F = {};                                  // flags

/* ---------- items ---------- */
const ITEMS = {
  key:    {n:'Small key',     icon:'🗝️', d:'A small silver key, still warm from the dish.'},
  spoon:  {n:'Teaspoon',      icon:'🥄', d:'Village silver. The monogram is a number, not a letter.'},
  paper:  {n:'The Tally Ho',  icon:'📰', d:'The Village newspaper. Tide tables, small ads, obituaries, a crossword.'},
  coin:   {n:'Village coin',  icon:'🪙', d:'One credit. Stamped with somebody else\u2019s number.'},
  boater: {n:'Straw boater',  icon:'👒', d:'A striped ribbon. It smells of the sea and of a long time ago.'},
  radio:  {n:'Transistor',    icon:'📻', d:'Charged to Number 12. Everything here is charged to your number.'},
  fuel:   {n:'Fuel can',      icon:'⛽', d:'Outboard fuel. Half full.'},
  pliers: {n:'Pliers',        icon:'🔧', d:'Insulated grips. Somebody here expected to need them.'}
};

/* ---------- helpers ---------- */
function has(i){ return state.inv.includes(i); }
function add(i){ if(!has(i)){ state.inv.push(i); renderInv(); } }
function remove(i){ state.inv = state.inv.filter(x=>x!==i);
  if(state.sel===i) state.sel=null; renderInv(); }
function say(t){ textEl.innerHTML = t; }
function clearSel(){ state.sel=null; renderInv(); }

function setActions(list){
  actEl.innerHTML='';
  (list||[]).forEach(a=>{
    const b=document.createElement('button');
    b.className='act'; b.textContent=a.t;
    b.onclick=()=>{
      const h=state.hs;
      a.run();
      if(state.hs===h && h) setActions(h.acts?h.acts():[]);
    };
    actEl.appendChild(b);
  });
}

function renderInv(){
  invEl.innerHTML='';
  state.inv.forEach(id=>{
    const it=ITEMS[id];
    const b=document.createElement('button');
    b.className='inv'+(state.sel===id?' sel':'');
    b.innerHTML='<span class="ic">'+it.icon+'</span><span>'+it.n+'</span>';
    b.onclick=()=>{
      if(state.sel===id){ clearSel(); say('You put it away.'); return; }
      state.sel=id; renderInv();
      say('<b>'+it.n+'</b> \u2014 '+it.d+
          '<br><span class="hint">Now tap something to use it on.</span>');
      setActions([]);
    };
    invEl.appendChild(b);
  });
}

/* ---------- procedural village ---------- */
const PALETTE=['#e8b04b','#d97b6c','#7fb3c8','#a8c686','#e6d7a8','#c98fa8','#8fb8a8'];
function rnd(i){ const v=Math.sin(i*12.9898)*43758.5453; return v-Math.floor(v); }

function houseRow(x,y,w,n,baseH,seed){
  seed = seed||0;
  let s='', hw=w/n;
  for(let i=0;i<n;i++){
    const r1=rnd(i+1+seed), r2=rnd(i+7+seed);
    const hx=x+i*hw+hw*0.06, ww=hw*0.88, hh=baseH*(0.72+r1*0.55);
    const top=y-hh;
    const col=PALETTE[Math.floor(r2*PALETTE.length)];
    s+='<rect x="'+hx.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+ww.toFixed(1)+
       '" height="'+hh.toFixed(1)+'" fill="'+col+'"/>';
    s+='<polygon points="'+(hx-ww*0.11).toFixed(1)+','+(top+1).toFixed(1)+' '+
       (hx+ww/2).toFixed(1)+','+(top-hw*0.45).toFixed(1)+' '+
       (hx+ww*1.11).toFixed(1)+','+(top+1).toFixed(1)+'" fill="#b4553f"/>';
    const rows=Math.max(1,Math.floor(hh/30));
    for(let rr=0;rr<rows;rr++){
      for(let cc=0;cc<2;cc++){
        s+='<rect x="'+(hx+ww*(0.16+cc*0.44)).toFixed(1)+'" y="'+(top+9+rr*27).toFixed(1)+
           '" width="'+(ww*0.22).toFixed(1)+'" height="13" fill="#33454f" opacity="0.78"/>';
      }
    }
  }
  return s;
}

/* =========================================================
   ENGINE
   ========================================================= */
function go(id){
  state.scene=id; state.hs=null;
  const sc=SCENES[id];
  artEl.innerHTML = sc.art;
  buildHotspots(sc);
  const t = sc.enter ? sc.enter() : null;
  if(state.scene!==id) return;
  setActions([]);
  say(t || sc.desc || '');
}

function buildHotspots(sc){
  hsEl.innerHTML='';
  (sc.hotspots||[]).forEach(hs=>{
    const d=document.createElement('div');
    d.className='hs';
    d.style.left=hs.x+'%'; d.style.top=hs.y+'%';
    d.style.width=hs.w+'%'; d.style.height=hs.h+'%';
    d.addEventListener('click', ev=>{ ev.stopPropagation(); tapHotspot(hs); });
    hsEl.appendChild(d);
    hs._el = d;
  });
}

function tapHotspot(hs){
  state.hs = hs;

  if(state.sel){
    const item = state.sel;
    clearSel();
    let handled = false;
    try { handled = hs.use ? hs.use(item) : false; } catch(e){ handled = false; }
    if(!handled){
      say('The '+ITEMS[item].n.toLowerCase()+' is no use on '+hs.label+'.');
    }
    if(state.hs===hs) setActions(hs.acts?hs.acts():[]);
    return;
  }

  say(hs.look ? hs.look() : 'You look at '+hs.label+'.');
  setActions(hs.acts ? hs.acts() : []);
}

/* ---------- overlays ---------- */
function showOverlay(html, btnLabel, cb){
  overlay.innerHTML = '<div class="card">'+html+
    '<button id="ovBtn">'+btnLabel+'</button></div>';
  overlay.classList.add('show');
  $('ovBtn').onclick = ()=>{ overlay.classList.remove('show'); cb(); };
}

function ending(title, body){
  showOverlay('<h1>'+title+'</h1><p>'+body+'</p>',
    'Begin again', ()=> reset());
}

function caught(reason){
  showOverlay('<h1>CAUGHT</h1><p>'+reason+'</p>'+
    '<p class="small">You wake in the flat. Your things are still with you \u2014 '+
    'they are not cruel here, only thorough.</p>',
    'Return to the flat', ()=> go('flat'));
}

function reset(){
  state.inv=[]; state.sel=null; state.hs=null;
  Object.keys(F).forEach(k=>delete F[k]);
  renderInv();
  go('flat');
}

function talkBandstand(){
  if(F.gaveCoin){
    say('"Low water," he says, without being asked. "The door in the cliff. Six o\u2019clock. '+
        'That\u2019s all I know and all I\u2019ll say."');
    return;
  }
  if(has('coin')){
    remove('coin'); add('boater'); F.gaveCoin=true;
    say('He looks at the coin in your hand. "For that," he says, "I\u2019ll tell you a thing '+
        'and give you a thing."<br><br>He takes the coin. He gives you his straw boater.'+
        '<br><br>"Low water at six," he says. "There\u2019s a door in the cliff. The sea leaves '+
        'it open twice a day. And the Rovers don\u2019t bother a man who looks like he belongs '+
        'here."<br><br>He settles back on the steps. "That\u2019s my whole life, that is. Spent."');
    return;
  }
  say('"I remember things," he says. "Things I\u2019ve seen. Things I\u2019ve been. '+
      'But I don\u2019t remember anything for free."');
}

/* =========================================================
   LAYOUT + BOOT
   ========================================================= */
function layout(){
  const wrap = document.getElementById('stageWrap');
  const w = wrap.clientWidth - 16;
  const h = wrap.clientHeight - 8;
  if(w < 10 || h < 10) return;
  let W = w, H = W * 5/8;
  if(H > h){ H = h; W = H * 8/5; }
  stage.style.width  = Math.floor(W) + 'px';
  stage.style.height = Math.floor(H) + 'px';
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', ()=> setTimeout(layout,120));
if(window.ResizeObserver) new ResizeObserver(layout).observe(document.getElementById('stageWrap'));

$('hint').addEventListener('click', ()=>{
  hsEl.querySelectorAll('.hs').forEach(el=>{
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    setTimeout(()=> el.classList.remove('flash'), 1800);
  });
});

/* prevent double-tap zoom on iOS */
let lastTouch = 0;
document.addEventListener('touchend', e=>{
  const now = Date.now();
  if(now - lastTouch < 320) e.preventDefault();
  lastTouch = now;
}, {passive:false});

/* ---------- title ---------- */
function titleScreen(){
  overlay.innerHTML =
    '<div class="card">'+
      '<p class="kicker">A point-and-click escape</p>'+
      '<h1>THE VILLAGE</h1>'+
      '<p>You wake in a flat that is almost yours. Outside the window there is no street '+
        'you recognise \u2014 only a village, and a sea, and everyone smiling.</p>'+
      '<p class="small">You are Number 12.</p>'+
      '<button id="ovBtn">Begin</button>'+
    '</div>';
  overlay.classList.add('show');
  $('ovBtn').onclick = ()=>{ overlay.classList.remove('show'); reset(); };
}

layout();
renderInv();
titleScreen();
