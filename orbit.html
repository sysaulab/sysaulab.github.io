<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ORBIT — a slingshot puzzle</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04060f;
            font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  canvas{display:block;touch-action:none;cursor:crosshair;
         -webkit-user-select:none;user-select:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');

let W = 0, H = 0, DPR = 1;
let lastW = -1, lastH = -1;

const FIXED    = 1/240;
const MAXDRAG  = 170;
const MAXSPEED = 720;

let level = 1;
let planets = [], collectStars = [], bgStars = [], particles = [], trail = [];
let goal = null, ship = null;
let worldTime = 0, flightTime = 0, acc = 0;
let state = 'aim';
let aiming = false, aimStart = null, aimCur = null;
let attempts = 0, levelStars = 0, totalStars = 0;
let deadTimer = 0;
let preview = [];

// ---------------------------------------------------------------- utilities
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const TAU = Math.PI * 2;

function planetX(p, t){
  return p.orbit ? p.orbit.cx + Math.cos(p.orbit.a0 + p.orbit.sp * t) * p.orbit.r : p.cx0;
}
function planetY(p, t){
  return p.orbit ? p.orbit.cy + Math.sin(p.orbit.a0 + p.orbit.sp * t) * p.orbit.r : p.cy0;
}

// ---------------------------------------------------------------- resize
let resizeTimer = null;
function resize(){
  const nw = window.innerWidth, nh = window.innerHeight;
  if(nw === lastW && nh === lastH && ship) return;
  lastW = nw; lastH = nh;

  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = nw; H = nh;
  cvs.width  = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeBgStars();
  startLevel(level);
}
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 160);
});

function makeBgStars(){
  bgStars = [];
  const rnd = mulberry32(20240501);
  const n = Math.floor(W * H / 7000);
  for(let i = 0; i < n; i++){
    bgStars.push({
      x: rnd() * W, y: rnd() * H,
      r: rnd() * 1.25 + 0.25,
      a: rnd() * 0.55 + 0.15,
      tw: rnd() * TAU,
      sp: 0.6 + rnd() * 2.2
    });
  }
}

// ---------------------------------------------------------------- level gen
function startLevel(n){
  const rnd = mulberry32(1337 + n * 7919);

  planets = [];
  collectStars = [];
  particles = [];
  trail = [];
  preview = [];
  aiming = false;
  aimStart = null;
  aimCur = null;
  attempts = 0;
  levelStars = 0;
  worldTime = 0;
  flightTime = 0;
  acc = 0;
  deadTimer = 0;

  const startPos = { x: Math.max(58, W * 0.08), y: H * 0.5 };
  const goalPos  = { x: W - Math.max(58, W * 0.08), y: H * (0.14 + 0.72 * rnd()) };

  const count = Math.min(8, 2 + Math.floor(n / 1.7));

  // --- orbit escalation ---
  // ~19% at level 1  →  ~50% at level 38  →  100% at level ~96
  const orbitChance = Math.min(1, 0.18 + n * 0.0085);
  // orbit speed ramps up to 1.6x by level 100 (tighter timing windows)
  const speedScale  = 1 + Math.min(1, n / 100) * 0.6;
  // placement gets tighter as levels climb, since so many bodies sweep rings
  const spacing     = Math.max(25, 55 - n * 0.3);
  const startClear  = Math.max(90, 145 - n * 0.5);
  const goalClear   = Math.max(70, 115 - n * 0.4);

  let tries = 0;
  while(planets.length < count && tries < 3000){
    tries++;
    const r = 22 + rnd() * 38;
    const x = W * 0.15 + rnd() * W * 0.70;
    const y = 90 + rnd() * (H - 180);

    let orbit = null;
    if(rnd() < orbitChance){
      orbit = {
        cx: x, cy: y,
        r: 28 + rnd() * 45,
        a0: rnd() * TAU,
        sp: (rnd() < 0.5 ? -1 : 1) * (0.18 + rnd() * 0.45) * speedScale
      };
    }
    const checkR = r + (orbit ? orbit.r : 0);

    if(Math.hypot(x - startPos.x, y - startPos.y) < checkR + startClear) continue;
    if(Math.hypot(x - goalPos.x,  y - goalPos.y)  < checkR + goalClear) continue;

    let ok = true;
    for(const p of planets){
      const pr = p.r + (p.orbit ? p.orbit.r : 0);
      if(Math.hypot(x - p.cx0, y - p.cy0) < checkR + pr + spacing){ ok = false; break; }
    }
    if(!ok) continue;

    planets.push({
      cx0: x, cy0: y,
      r,
      gm: 1100 * r * r * (0.85 + rnd() * 0.45),
      hue: 175 + rnd() * 165,
      orbit
    });
  }

  for(let i = 0; i < 3; i++){
    for(let k = 0; k < 250; k++){
      const x = W * 0.19 + rnd() * W * 0.66;
      const y = 80 + rnd() * (H - 160);
      if(Math.hypot(x - startPos.x, y - startPos.y) < 95) continue;
      if(Math.hypot(x - goalPos.x,  y - goalPos.y)  < 75) continue;
      let ok = true;
      for(const p of planets){
        const pr = p.r + (p.orbit ? p.orbit.r : 0);
        if(Math.hypot(x - p.cx0, y - p.cy0) < pr + 35){ ok = false; break; }
      }
      if(!ok) continue;
      collectStars.push({ x, y, got: false, ph: rnd() * TAU });
      break;
    }
  }

  goal = { x: goalPos.x, y: goalPos.y, r: 26 };
  ship = { x: startPos.x, y: startPos.y, vx: 0, vy: 0, sx: startPos.x, sy: startPos.y };
  state = 'aim';
}

// ---------------------------------------------------------------- physics
function stepFlight(h){
  let ax = 0, ay = 0;
  for(const p of planets){
    const px = planetX(p, worldTime);
    const py = planetY(p, worldTime);
    const dx = px - ship.x, dy = py - ship.y;
    let d2 = dx * dx + dy * dy;
    const md = p.r * 1.3;
    if(d2 < md * md) d2 = md * md;
    const d = Math.sqrt(d2);
    const a = p.gm / d2;
    ax += a * dx / d;
    ay += a * dy / d;
  }

  ship.vx += ax * h;
  ship.vy += ay * h;
  ship.x  += ship.vx * h;
  ship.y  += ship.vy * h;

  worldTime  += h;
  flightTime += h;

  trail.push({ x: ship.x, y: ship.y });
  if(trail.length > 460) trail.shift();

  for(const p of planets){
    const px = planetX(p, worldTime);
    const py = planetY(p, worldTime);
    if(Math.hypot(px - ship.x, py - ship.y) < p.r + 5){ die(); return; }
  }
  if(Math.hypot(goal.x - ship.x, goal.y - ship.y) < goal.r){ win(); return; }
  for(const s of collectStars){
    if(!s.got && Math.hypot(s.x - ship.x, s.y - ship.y) < 22){
      s.got = true; levelStars++; totalStars++;
      spawnBurst(s.x, s.y, 48, 16, 150);
    }
  }
  if(ship.x < -180 || ship.x > W + 180 || ship.y < -180 || ship.y > H + 180){ die(); return; }
  if(flightTime > 25) die();
}

function die(){
  state = 'dead';
  deadTimer = 0;
  spawnBurst(ship.x, ship.y, 10, 26, 220);
}

function win(){
  state = 'win';
  spawnBurst(goal.x, goal.y, 155, 34, 240);
}

function resetShip(){
  ship.x = ship.sx; ship.y = ship.sy;
  ship.vx = 0; ship.vy = 0;
  trail = [];
  state = 'aim';
}

// ---------------------------------------------------------------- preview
function computePreview(vx, vy){
  const pts = [];
  let x = ship.x, y = ship.y, px = vx, py = vy;
  let t = worldTime;
  const h = 1/200;
  const maxSteps = Math.floor(3.2 / h);

  for(let i = 0; i < maxSteps; i++){
    let ax = 0, ay = 0;
    for(const p of planets){
      const qx = planetX(p, t), qy = planetY(p, t);
      const dx = qx - x, dy = qy - y;
      let d2 = dx * dx + dy * dy;
      const md = p.r * 1.3;
      if(d2 < md * md) d2 = md * md;
      const d = Math.sqrt(d2);
      const a = p.gm / d2;
      ax += a * dx / d; ay += a * dy / d;
    }
    px += ax * h; py += ay * h;
    x  += px * h; y  += py * h;
    t  += h;

    if(i % 6 === 0) pts.push({ x, y, age: i * h, kind: 0 });

    let hit = false;
    for(const p of planets){
      const qx = planetX(p, t), qy = planetY(p, t);
      if(Math.hypot(qx - x, qy - y) < p.r + 5){ hit = true; break; }
    }
    if(hit){ pts.push({ x, y, age: i * h, kind: 1 }); break; }
    if(Math.hypot(goal.x - x, goal.y - y) < goal.r){ pts.push({ x, y, age: i * h, kind: 2 }); break; }
    if(x < -150 || x > W + 150 || y < -150 || y > H + 150) break;
  }
  return pts;
}

// ---------------------------------------------------------------- particles
function spawnBurst(x, y, hue, n, spd){
  for(let i = 0; i < n; i++){
    const a = Math.random() * TAU, s = Math.random() * spd;
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0, max: 0.45 + Math.random() * 0.8,
      hue, size: 1 + Math.random() * 2.6
    });
  }
}

// ---------------------------------------------------------------- input
function getPos(e){
  const r = cvs.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function aimVel(){
  if(!aiming || !aimStart || !aimCur) return null;
  const dx = aimCur.x - aimStart.x, dy = aimCur.y - aimStart.y;
  const d = Math.hypot(dx, dy);
  if(!isFinite(d) || d < 6) return null;
  const power = Math.min(d, MAXDRAG) / MAXDRAG;
  const ang = Math.atan2(dy, dx);
  return { vx: Math.cos(ang) * power * MAXSPEED,
           vy: Math.sin(ang) * power * MAXSPEED,
           power, ang };
}

function handleDown(e){
  if(state === 'win'){ level++; startLevel(level); return; }
  if(state !== 'aim') return;
  if(e.type === 'mousedown' && e.button !== 0) return;

  aiming = true;
  aimStart = getPos(e);
  aimCur   = { x: aimStart.x, y: aimStart.y };

  if(e.pointerId !== undefined && cvs.setPointerCapture){
    try { cvs.setPointerCapture(e.pointerId); } catch(_) {}
  }
  if(e.cancelable) e.preventDefault();
}

function handleMove(e){
  if(!aiming) return;
  aimCur = getPos(e);
  if(e.cancelable) e.preventDefault();
}

function handleUp(e){
  if(!aiming) return;
  aimCur = getPos(e);
  endAim(true);
  if(e.cancelable) e.preventDefault();
}

function endAim(launchIt){
  if(!aiming) return;

  // compute velocity FIRST, while `aiming` is still true
  const v = launchIt ? aimVel() : null;

  aiming = false;
  aimStart = null;
  aimCur = null;

  if(!v || !isFinite(v.vx) || !isFinite(v.vy)) return;

  ship.vx = v.vx; ship.vy = v.vy;
  state = 'fly';
  flightTime = 0;
  acc = 0;
  trail = [{ x: ship.x, y: ship.y }];
  attempts++;
  preview = [];
}

if(window.PointerEvent){
  cvs.addEventListener('pointerdown', handleDown);
  window.addEventListener('pointermove', handleMove);
  window.addEventListener('pointerup', handleUp);
  window.addEventListener('pointercancel', () => endAim(false));
} else {
  cvs.addEventListener('mousedown', handleDown);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleUp);
  cvs.addEventListener('touchstart', e => { if(e.touches[0]) handleDown(e.touches[0]); }, {passive:false});
  window.addEventListener('touchmove', e => { if(e.touches[0]) handleMove(e.touches[0]); }, {passive:false});
  window.addEventListener('touchend', e => { if(e.changedTouches[0]) handleUp(e.changedTouches[0]); }, {passive:false});
}

window.addEventListener('keydown', e => {
  if(e.key === 'r' || e.key === 'R') startLevel(level);
  if(e.key === 's' || e.key === 'S'){ level++; startLevel(level); }
  if((e.key === ' ' || e.key === 'Enter') && state === 'win'){ level++; startLevel(level); }
});

// ---------------------------------------------------------------- update
function update(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life += dt;
    if(p.life >= p.max){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 1.6 * dt); p.vy *= (1 - 1.6 * dt);
  }

  if(state === 'fly'){
    acc += dt;
    let steps = 0;
    while(acc >= FIXED && steps < 80 && state === 'fly'){
      stepFlight(FIXED);
      acc -= FIXED;
      steps++;
    }
    if(state !== 'fly') acc = 0;
  } else {
    worldTime += dt;
    if(state === 'dead'){
      deadTimer += dt;
      if(deadTimer > 0.85) resetShip();
    }
  }

  if(state === 'aim'){
    const v = aimVel();
    preview = v ? computePreview(v.vx, v.vy) : [];
  } else {
    preview = [];
  }
}

// ---------------------------------------------------------------- render
function render(){
  const bg = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
  bg.addColorStop(0, '#0c1226');
  bg.addColorStop(1, '#04060f');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for(const s of bgStars){
    const tw = 0.55 + 0.45 * Math.sin(worldTime * s.sp + s.tw);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = '#cfe4ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(const p of planets){
    if(!p.orbit) continue;
    ctx.save();
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = `hsla(${p.hue},70%,60%,0.16)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.orbit.cx, p.orbit.cy, p.orbit.r, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  for(const p of planets){
    const px = planetX(p, worldTime);
    const py = planetY(p, worldTime);

    const glow = ctx.createRadialGradient(px, py, p.r * 0.6, px, py, p.r * 3.1);
    glow.addColorStop(0, `hsla(${p.hue},85%,62%,0.26)`);
    glow.addColorStop(1, `hsla(${p.hue},85%,62%,0)`);
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(px, py, p.r * 3.1, 0, TAU); ctx.fill();

    const body = ctx.createRadialGradient(
      px - p.r * 0.36, py - p.r * 0.36, p.r * 0.08,
      px, py, p.r
    );
    body.addColorStop(0,   `hsl(${p.hue},72%,74%)`);
    body.addColorStop(0.55,`hsl(${p.hue},62%,44%)`);
    body.addColorStop(1,   `hsl(${p.hue},72%,16%)`);
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(px, py, p.r, 0, TAU); ctx.fill();

    ctx.strokeStyle = `hsla(${p.hue},90%,78%,0.42)`;
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  const gp = 1 + 0.06 * Math.sin(worldTime * 3.2);
  ctx.save();
  ctx.translate(goal.x, goal.y);
  ctx.rotate(worldTime * 0.7);
  ctx.shadowColor = '#7cf7c8';
  ctx.shadowBlur = 22;
  ctx.strokeStyle = '#7cf7c8';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for(let i = 0; i < 3; i++){
    ctx.beginPath();
    ctx.arc(0, 0, goal.r * gp, i * TAU / 3, i * TAU / 3 + 1.15);
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.shadowColor = '#7cf7c8'; ctx.shadowBlur = 26;
  ctx.fillStyle = 'rgba(124,247,200,0.20)';
  ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r * 0.45 * gp, 0, TAU); ctx.fill();
  ctx.restore();

  for(const s of collectStars){
    if(s.got) continue;
    const t = worldTime * 2 + s.ph;
    const pulse = 1 + 0.16 * Math.sin(t);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(t * 0.5);
    ctx.shadowColor = '#ffd75e';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffd75e';
    ctx.beginPath();
    const R = 12.5 * pulse, r = 4.2 * pulse;
    for(let i = 0; i < 8; i++){
      const ang = i * Math.PI / 4;
      const rad = (i % 2 === 0) ? R : r;
      const xx = Math.cos(ang) * rad, yy = Math.sin(ang) * rad;
      if(i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  if(preview.length){
    for(const pt of preview){
      let a = 1 - (pt.age - 0.7) / 2.2;
      a = Math.max(0, Math.min(1, a));
      if(a <= 0.03) continue;
      const alpha = a * 0.7;
      if(pt.kind === 1){
        ctx.fillStyle = `rgba(255,95,95,${alpha})`;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 5, 0, TAU); ctx.fill();
        ctx.strokeStyle = `rgba(255,95,95,${alpha})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(pt.x - 6, pt.y - 6); ctx.lineTo(pt.x + 6, pt.y + 6);
        ctx.moveTo(pt.x + 6, pt.y - 6); ctx.lineTo(pt.x - 6, pt.y + 6);
        ctx.stroke();
      } else if(pt.kind === 2){
        ctx.fillStyle = `rgba(124,247,200,${alpha})`;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 6, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = `rgba(150,220,255,${alpha})`;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.2, 0, TAU); ctx.fill();
      }
    }
  }

  if(trail.length > 1){
    ctx.lineCap = 'round';
    for(let i = 3; i < trail.length; i += 3){
      const a = i / trail.length;
      ctx.strokeStyle = `rgba(120,220,255,${a * 0.5})`;
      ctx.lineWidth = a * 3 + 0.4;
      ctx.beginPath();
      ctx.moveTo(trail[i - 3].x, trail[i - 3].y);
      ctx.lineTo(trail[i].x, trail[i].y);
      ctx.stroke();
    }
  }

  if(state !== 'dead'){
    const speed = Math.hypot(ship.vx, ship.vy);
    if(speed > 12){
      const ang = Math.atan2(ship.vy, ship.vx);
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ang);
      ctx.shadowColor = '#7fe8ff'; ctx.shadowBlur = 14;
      ctx.fillStyle = 'rgba(150,235,255,0.85)';
      ctx.beginPath();
      ctx.moveTo(-14, 0); ctx.lineTo(-3, -5); ctx.lineTo(-3, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.save();
    ctx.shadowColor = '#7fe8ff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#bff3ff';
    ctx.beginPath(); ctx.arc(ship.x, ship.y, 6, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(ship.x, ship.y, 3, 0, TAU); ctx.fill();
    ctx.restore();
  }

  const v = aimVel();
  if(v){
    const len = 40 + v.power * 105;
    const hue = 195 - v.power * 175;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(v.ang);
    ctx.shadowColor = `hsl(${hue},95%,65%)`;
    ctx.shadowBlur = 14;
    ctx.strokeStyle = `hsl(${hue},95%,68%)`;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(len, 0); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(len + 13, 0);
    ctx.lineTo(len - 5, -8);
    ctx.lineTo(len - 5, 8);
    ctx.closePath();
    ctx.fillStyle = `hsl(${hue},95%,68%)`;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = `hsla(${hue},95%,68%,0.55)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, 14, -Math.PI / 2, -Math.PI / 2 + v.power * TAU);
    ctx.stroke();
    ctx.restore();
  }

  for(const p of particles){
    const a = 1 - p.life / p.max;
    ctx.fillStyle = `hsla(${p.hue},95%,68%,${a})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a + 0.4, 0, TAU);
    ctx.fill();
  }

  drawHUD();
}

// ---------------------------------------------------------------- HUD
function drawHUD(){
  ctx.textBaseline = 'alphabetic';

  ctx.font = '600 15px ui-monospace, monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(200,230,255,0.85)';
  ctx.fillText('LEVEL ' + level, 20, 32);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,215,94,0.9)';
  ctx.fillText('★ ' + levelStars + '/' + collectStars.length, W - 20, 32);
  ctx.fillStyle = 'rgba(160,200,240,0.55)';
  ctx.font = '600 12px ui-monospace, monospace';
  ctx.fillText('TOTAL ★ ' + totalStars, W - 20, 52);

  if(state === 'aim'){
    ctx.textAlign = 'center';
    ctx.font = '600 13px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(150,195,235,0.42)';
    const hint = aiming ? 'release to launch' : 'drag to launch  ·  R restart';
    ctx.fillText(hint.toUpperCase(), W / 2, H - 28);

    if(attempts >= 5){
      ctx.fillStyle = 'rgba(255,190,120,0.55)';
      ctx.fillText('PRESS  S  TO SKIP LEVEL', W / 2, H - 50);
    }
  }

  if(state === 'dead'){
    ctx.textAlign = 'center';
    ctx.font = '600 15px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(255,120,120,0.75)';
    ctx.fillText('LOST IN SPACE', W / 2, H / 2);
  }

  if(state === 'win'){
    ctx.fillStyle = 'rgba(4,8,18,0.68)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.shadowColor = '#7cf7c8';
    ctx.shadowBlur = 26;
    ctx.fillStyle = '#7cf7c8';
    ctx.font = '700 44px ui-monospace, monospace';
    ctx.fillText('LEVEL CLEAR', W / 2, H / 2 - 22);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(210,235,255,0.82)';
    ctx.font = '600 17px ui-monospace, monospace';
    ctx.fillText('stars ' + levelStars + '/' + collectStars.length +
                 '   ·   attempts ' + attempts, W / 2, H / 2 + 24);

    ctx.fillStyle = 'rgba(160,200,240,' + (0.45 + 0.35 * Math.sin(worldTime * 4)) + ')';
    ctx.font = '600 14px ui-monospace, monospace';
    ctx.fillText('CLICK TO CONTINUE', W / 2, H / 2 + 70);
  }
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- boot
resize();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
