<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Falling Sand — a little physics sandbox</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center; padding:18px;
    background: radial-gradient(1200px 700px at 25% -10%, #1c2334 0%, #0a0c12 55%, #06070b 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:#c9d1e0; -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #app{ width:min(1040px,100%); display:flex; flex-direction:column; gap:12px; }

  #head{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:0 4px;}
  h1{
    font-size:15px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    margin:0; color:#e8eefc;
  }
  h1 span{ color:#5f6b85; }
  #hint{ font-size:12px; color:#5f6b85; margin-left:auto; }

  #stage{
    border-radius:16px; overflow:hidden; background:#0b0d13;
    border:1px solid #232a3a;
    box-shadow: 0 24px 70px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.025);
    position:relative;
  }
  canvas{
    display:block; width:100%; height:auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action:none; cursor:crosshair;
  }

  #tools{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:0 4px;}
  #palette{ display:flex; gap:6px; flex-wrap:wrap; flex:1 1 auto;}

  .el{
    display:flex; align-items:center; gap:7px;
    padding:7px 11px; border-radius:10px;
    border:1px solid #262e40; background:#121824; color:#98a3b8;
    font-size:12.5px; font-family:inherit; cursor:pointer;
    transition: background .15s, color .15s, border-color .15s, box-shadow .15s, transform .1s;
    user-select:none;
  }
  .el:hover{ background:#1a2130; color:#dbe3f2; }
  .el:active{ transform: translateY(1px); }
  .el.active{
    border-color: var(--c); color:#fff; background:#1d2537;
    box-shadow: 0 0 0 1px var(--c), 0 0 18px -6px var(--c);
  }
  .dot{
    width:11px; height:11px; border-radius:3px; background:var(--c);
    box-shadow: 0 0 9px -1px var(--c);
    flex:none;
  }

  #controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .ctl{
    display:flex; align-items:center; gap:9px;
    padding:6px 12px; border-radius:10px;
    border:1px solid #262e40; background:#121824; color:#98a3b8;
    font-size:12.5px; font-family:inherit; cursor:pointer;
    transition: background .15s, color .15s;
    user-select:none;
  }
  .ctl:hover{ background:#1a2130; color:#dbe3f2; }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:96px; height:4px; border-radius:4px; background:#2a3346; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#8fa6d8; border:2px solid #121824; box-shadow:0 0 8px -1px #8fa6d8; cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%; background:#8fa6d8; border:2px solid #121824; cursor:pointer;
  }
  #bsize{ min-width:22px; text-align:center; color:#dbe3f2; font-variant-numeric: tabular-nums;}

  @media (max-width: 720px){
    #hint{ display:none; }
    .el{ padding:6px 9px; font-size:11.5px; }
    .el .lbl{ display:none; }
    .el{ padding:7px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <h1>Falling&nbsp;Sand <span>/ element sandbox</span></h1>
    <div id="hint">drag to paint &nbsp;·&nbsp; right‑click or shift‑drag to erase</div>
  </div>

  <div id="stage"><canvas id="c"></canvas></div>

  <div id="tools">
    <div id="palette"></div>
    <div id="controls">
      <label class="ctl">Brush <input type="range" id="brush" min="1" max="18" value="4"><span id="bsize">4</span></label>
      <button class="ctl" id="pause">⏸ Pause</button>
      <button class="ctl" id="chaos">🎲 Chaos</button>
      <button class="ctl" id="clear">✕ Clear</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
   Simulation grid
------------------------------------------------------------------ */
const W = 300, H = 180;

const EMPTY = 0, SAND = 1, WATER = 2, STONE = 3, WOOD = 4,
      FIRE  = 5, PLANT = 6, OIL = 7, ACID = 8, SMOKE = 9;

const grid  = new Uint8Array(W * H);
const life  = new Uint8Array(W * H);
const tint  = new Int8Array(W * H);
const moved = new Uint8Array(W * H);

const FIRE_LIFE  = 160;
const SMOKE_LIFE = 200;

const PAL = [];
PAL[EMPTY] = [12, 12, 20];
PAL[SAND]  = [198, 178, 116];
PAL[WATER] = [42, 96, 210];
PAL[STONE] = [104, 104, 116];
PAL[WOOD]  = [110, 74, 42];
PAL[PLANT] = [58, 158, 72];
PAL[OIL]   = [64, 52, 40];
PAL[ACID]  = [140, 220, 60];

const DX = [0, 0, -1, 1];
const DY = [-1, 1, 0, 0];

const idx = (x, y) => y * W + x;
const inB = (x, y) => x >= 0 && x < W && y >= 0 && y < H;
const at  = (x, y) => inB(x, y) ? grid[y * W + x] : STONE;
const rndTint = () => (Math.random() * 40 - 20) | 0;

function swap(i, j) {
  let t = grid[i]; grid[i] = grid[j]; grid[j] = t;
  t = life[i];     life[i] = life[j]; life[j] = t;
  t = tint[i];     tint[i] = tint[j]; tint[j] = t;
  moved[i] = 1; moved[j] = 1;
}

/* ------------------------------------------------------------------
   Shared movement: flow sideways/down like a liquid
------------------------------------------------------------------ */
function flow(x, y, i) {
  // down
  if (y + 1 < H) {
    const j = idx(x, y + 1);
    if (grid[j] === EMPTY || grid[j] === SMOKE) { swap(i, j); return; }

    const dir = Math.random() < 0.5 ? -1 : 1;
    for (const dx of [dir, -dir]) {
      if (!inB(x + dx, y + 1)) continue;
      const k = idx(x + dx, y + 1);
      if (grid[k] === EMPTY || grid[k] === SMOKE) { swap(i, k); return; }
    }
  }
  // sideways
  const dir = Math.random() < 0.5 ? -1 : 1;
  for (const dx of [dir, -dir]) {
    if (!inB(x + dx, y)) continue;
    const k = idx(x + dx, y);
    if (grid[k] === EMPTY) { swap(i, k); return; }
  }
}

/* ------------------------------------------------------------------
   Element behaviours
------------------------------------------------------------------ */
function updSand(x, y, i) {
  const below = at(x, y + 1);
  if (below === EMPTY || below === WATER || below === OIL || below === SMOKE) {
    if (y + 1 < H) { swap(i, idx(x, y + 1)); return; }
  }
  const dir = Math.random() < 0.5 ? -1 : 1;
  for (const dx of [dir, -dir]) {
    const nx = x + dx, ny = y + 1;
    if (!inB(nx, ny)) continue;
    const t = grid[idx(nx, ny)];
    if (t === EMPTY || t === WATER || t === OIL || t === SMOKE) {
      swap(i, idx(nx, ny)); return;
    }
  }
}

function updWater(x, y, i) { flow(x, y, i); }

function updOil(x, y, i) {
  // buoyancy: oil rises through water
  if (y > 0 && grid[idx(x, y - 1)] === WATER && Math.random() < 0.65) {
    swap(i, idx(x, y - 1)); return;
  }
  flow(x, y, i);
}

function updAcid(x, y, i) {
  // dissolve things
  for (let d = 0; d < 4; d++) {
    const nx = x + DX[d], ny = y + DY[d];
    if (!inB(nx, ny)) continue;
    const j = idx(nx, ny);
    const t = grid[j];
    if ((t === STONE || t === SAND || t === WOOD || t === PLANT) && Math.random() < 0.05) {
      grid[j] = EMPTY;
      tint[j] = rndTint();
      if (Math.random() < 0.4) {
        grid[i] = SMOKE; life[i] = 110; moved[i] = 1; return;
      }
    }
  }
  flow(x, y, i);
}

function updFire(x, y, i) {
  // spread / get extinguished
  for (let d = 0; d < 4; d++) {
    const nx = x + DX[d], ny = y + DY[d];
    if (!inB(nx, ny)) continue;
    const j = idx(nx, ny);
    const t = grid[j];

    if (t === WATER) {
      grid[i] = SMOKE; life[i] = 110; moved[i] = 1; return;
    }
    if (t === WOOD && Math.random() < 0.04) {
      grid[j] = FIRE; life[j] = 140; moved[j] = 1;
    } else if (t === PLANT && Math.random() < 0.14) {
      grid[j] = FIRE; life[j] = 120; moved[j] = 1;
    } else if (t === OIL && Math.random() < 0.30) {
      grid[j] = FIRE; life[j] = 150; moved[j] = 1;
    }
  }

  // burn down
  if (life[i] > 3) {
    life[i] -= 3;
  } else {
    if (Math.random() < 0.4) { grid[i] = SMOKE; life[i] = 100 + Math.random() * 80; }
    else grid[i] = EMPTY;
    moved[i] = 1;
    return;
  }

  // rise
  if (Math.random() < 0.7 && y > 0) {
    const j = idx(x, y - 1);
    if (grid[j] === EMPTY) { swap(i, j); return; }
    const dir = Math.random() < 0.5 ? -1 : 1;
    for (const dx of [dir, -dir]) {
      if (!inB(x + dx, y - 1)) continue;
      const k = idx(x + dx, y - 1);
      if (grid[k] === EMPTY) { swap(i, k); return; }
    }
  }
}

function updSmoke(x, y, i) {
  if (life[i] > 2) life[i] -= 2;
  else { grid[i] = EMPTY; moved[i] = 1; return; }

  if (Math.random() < 0.85 && y > 0) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const opts = [[0, -1], [dir, -1], [-dir, -1], [dir, 0]];
    for (const [dx, dy] of opts) {
      const nx = x + dx, ny = y + dy;
      if (!inB(nx, ny)) continue;
      const k = idx(nx, ny);
      if (grid[k] === EMPTY) { swap(i, k); return; }
    }
  }
}

function updPlant(x, y, i) {
  if (Math.random() < 0.03) {
    for (let d = 0; d < 4; d++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (!inB(nx, ny)) continue;
      const j = idx(nx, ny);
      if (grid[j] === WATER && Math.random() < 0.4) {
        grid[j] = PLANT; tint[j] = rndTint(); life[j] = 0; moved[j] = 1;
        return;
      }
    }
  }
}

/* ------------------------------------------------------------------
   Dispatcher & main step
------------------------------------------------------------------ */
function update(x, y) {
  const i = idx(x, y);
  if (moved[i]) return;
  switch (grid[i]) {
    case SAND:  updSand(x, y, i);  break;
    case WATER: updWater(x, y, i); break;
    case OIL:   updOil(x, y, i);   break;
    case ACID:  updAcid(x, y, i);  break;
    case FIRE:  updFire(x, y, i);  break;
    case SMOKE: updSmoke(x, y, i); break;
    case PLANT: updPlant(x, y, i); break;
  }
}

let frame = 0, paused = false;

function step() {
  moved.fill(0);
  const flip = (frame & 1) === 0;
  for (let y = H - 1; y >= 0; y--) {
    if (flip) { for (let x = 0; x < W; x++) update(x, y); }
    else      { for (let x = W - 1; x >= 0; x--) update(x, y); }
  }
  frame++;
}

/* ------------------------------------------------------------------
   Rendering
------------------------------------------------------------------ */
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const img  = ctx.createImageData(W, H);
const data = img.data;

function draw() {
  let p = 0;
  for (let i = 0, n = W * H; i < n; i++, p += 4) {
    const t = grid[i];
    let r, g, b;

    if (t === EMPTY) {
      r = 12; g = 12; b = 20;
    } else if (t === FIRE) {
      const l = life[i] / FIRE_LIFE;
      r = 255;
      g = (70 + 170 * l) | 0;
      b = (8 + 46 * l * l) | 0;
    } else if (t === SMOKE) {
      const l = life[i] / SMOKE_LIFE;
      const v = (44 + 56 * l) | 0;
      r = v; g = v; b = v + 5;
    } else {
      const c = PAL[t], tn = tint[i];
      r = c[0] + tn; g = c[1] + tn; b = c[2] + tn;
    }

    data[p] = r; data[p + 1] = g; data[p + 2] = b; data[p + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function loop() {
  if (!paused) step();
  draw();
  requestAnimationFrame(loop);
}

/* ------------------------------------------------------------------
   Painting
------------------------------------------------------------------ */
let current = SAND;
let brush   = 4;
let drawing = false;
let lastPt  = null;
let strokeType = SAND;

function paint(cx, cy, radius, type) {
  const r2 = radius * radius;
  const y0 = Math.max(0, cy - radius), y1 = Math.min(H - 1, cy + radius);
  const x0 = Math.max(0, cx - radius), x1 = Math.min(W - 1, cx + radius);

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const dx = x - cx, dy = y - cy;
      if (dx * dx + dy * dy > r2) continue;
      if (radius > 1 && Math.random() < 0.28) continue; // organic edges

      const i = idx(x, y);

      if (type === EMPTY) { grid[i] = EMPTY; life[i] = 0; continue; }

      const solidBrush = (type === STONE || type === WOOD || type === FIRE);
      if (grid[i] !== EMPTY && !solidBrush) continue;

      grid[i] = type;
      tint[i] = rndTint();
      life[i] = (type === FIRE) ? FIRE_LIFE : 0;
    }
  }
}

function paintLine(x0, y0, x1, y1, radius, type) {
  const dx = x1 - x0, dy = y1 - y0;
  const steps = Math.max(Math.abs(dx), Math.abs(dy));
  if (steps === 0) { paint(x1, y1, radius, type); return; }
  for (let s = 0; s <= steps; s++) {
    paint(Math.round(x0 + dx * s / steps), Math.round(y0 + dy * s / steps), radius, type);
  }
}

function toGrid(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(W - 1, Math.floor((e.clientX - r.left) / r.width  * W))),
    y: Math.max(0, Math.min(H - 1, Math.floor((e.clientY - r.top ) / r.height * H)))
  };
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  drawing = true;
  strokeType = (e.button === 2 || e.shiftKey || current === EMPTY) ? EMPTY : current;
  const p = toGrid(e);
  lastPt = p;
  paintLine(p.x, p.y, p.x, p.y, brush, strokeType);
});

canvas.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = toGrid(e);
  paintLine(lastPt.x, lastPt.y, p.x, p.y, brush, strokeType);
  lastPt = p;
});

const endStroke = () => { drawing = false; lastPt = null; };
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
window.addEventListener('blur', endStroke);

/* ------------------------------------------------------------------
   UI
------------------------------------------------------------------ */
const CSSCOL = {
  [SAND]:  '#c6b274',
  [WATER]: '#2a60d2',
  [STONE]: '#68687a',
  [WOOD]:  '#6e4a2a',
  [FIRE]:  '#ff8a2a',
  [PLANT]: '#3a9e48',
  [OIL]:   '#40342a',
  [ACID]:  '#8cdc3c',
  [SMOKE]: '#5a5a5f',
  [EMPTY]: '#3a4356'
};

const ELS = [
  { id: SAND,  name: 'Sand'  },
  { id: WATER, name: 'Water' },
  { id: STONE, name: 'Stone' },
  { id: WOOD,  name: 'Wood'  },
  { id: FIRE,  name: 'Fire'  },
  { id: PLANT, name: 'Plant' },
  { id: OIL,   name: 'Oil'   },
  { id: ACID,  name: 'Acid'  },
  { id: SMOKE, name: 'Smoke' },
  { id: EMPTY, name: 'Eraser'}
];

const paletteEl = document.getElementById('palette');
const buttons = [];

ELS.forEach(el => {
  const b = document.createElement('button');
  b.className = 'el';
  b.style.setProperty('--c', CSSCOL[el.id]);
  b.innerHTML = `<span class="dot"></span><span class="lbl">${el.name}</span>`;
  b.addEventListener('click', () => {
    current = el.id;
    buttons.forEach(x => x.classList.toggle('active', x === b));
  });
  paletteEl.appendChild(b);
  buttons.push(b);
});
buttons[0].classList.add('active');

const brushInput = document.getElementById('brush');
const bsizeLabel = document.getElementById('bsize');
brushInput.addEventListener('input', () => {
  brush = +brushInput.value;
  bsizeLabel.textContent = brush;
});

const pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '▶ Resume' : '⏸ Pause';
});

document.getElementById('clear').addEventListener('click', () => {
  grid.fill(EMPTY); life.fill(0);
});

/* ------------------------------------------------------------------
   Random scene generator
------------------------------------------------------------------ */
function chaos() {
  grid.fill(EMPTY);
  life.fill(0);
  for (let i = 0, n = W * H; i < n; i++) tint[i] = rndTint();

  // stone floor
  for (let x = 0; x < W; x++)
    for (let y = H - 4; y < H; y++) grid[idx(x, y)] = STONE;

  const types = [SAND, WATER, STONE, WOOD, OIL, PLANT, ACID];

  for (let k = 0; k < 42; k++) {
    const t  = types[(Math.random() * types.length) | 0];
    const cx = Math.random() * W;
    const cy = Math.random() * H * 0.55;
    const r  = 3 + Math.random() * 9;

    const y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
    const x0 = Math.floor(cx - r), x1 = Math.ceil(cx + r);

    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (!inB(x, y)) continue;
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy > r * r) continue;
        const i = idx(x, y);
        if (grid[i] !== EMPTY) continue;
        grid[i] = t;
        if (t === FIRE) life[i] = FIRE_LIFE;
      }
    }
  }

  // a couple of sparks
  for (let k = 0; k < 3; k++) {
    const x = (Math.random() * W) | 0;
    const y = (Math.random() * H * 0.6) | 0;
    const i = idx(x, y);
    if (grid[i] === EMPTY) { grid[i] = FIRE; life[i] = FIRE_LIFE; }
  }
}

document.getElementById('chaos').addEventListener('click', chaos);

/* ------------------------------------------------------------------
   Go
------------------------------------------------------------------ */
chaos();
loop();

})();
</script>
</body>
</html>
