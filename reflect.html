<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>REFLECT</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #06060c; cursor: crosshair;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- canvas
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- helpers
const TAU = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------- state
const keys = {};

const state = {
  mode: 'title',      // title | play | over
  t: 0,               // global time
  playT: 0,           // time since run started
  score: 0,
  best: +(localStorage.getItem('reflect_best') || 0),
  combo: 1,
  comboTimer: 0,
  shake: 0,
  hurtFlash: 0,
  reflectFlash: 0,
  spawnTimer: 1.2,
  overTimer: 0,
  player: null,
  bullets: [],
  enemies: [],
  particles: [],
};

const DASH_TIME   = 0.15;
const DASH_CD     = 0.45;
const DASH_SPEED  = 1250;
const REFLECT_PAD = 26;   // extra radius of the reflect aura

const TYPES = {
  drifter: { r: 16, hp: 1, accel: 320, maxSpd:  70, sides: 4, fire: 2.0, bspd: 175, spread: 1, color: '#ff5c8a', score: 10 },
  spinner: { r: 18, hp: 1, accel: 260, maxSpd:  58, sides: 6, fire: 2.5, bspd: 155, spread: 3, color: '#c46bff', score: 15 },
  tank:    { r: 27, hp: 2, accel: 180, maxSpd:  46, sides: 5, fire: 1.6, bspd: 205, spread: 2, color: '#ffb03a', score: 40 },
};

// ---------------------------------------------------------------- input
function onPress(k) {
  if (k === ' ') {
    if (state.mode === 'title') { start(); return; }
    if (state.mode === 'over' && state.overTimer <= 0) { start(); return; }
    if (state.mode === 'play') { tryDash(); return; }
  }
  if (k === 'enter') {
    if (state.mode === 'title') start();
    else if (state.mode === 'over' && state.overTimer <= 0) start();
  }
  if (k === 'r' && state.mode === 'over' && state.overTimer <= 0) start();
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  if (!e.repeat) onPress(k);
  keys[k] = true;
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
window.addEventListener('pointerdown', () => onPress(' '));

function axis() {
  let x = 0, y = 0;
  if (keys['a'] || keys['arrowleft'])  x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  if (keys['w'] || keys['arrowup'])    y -= 1;
  if (keys['s'] || keys['arrowdown'])  y += 1;
  if (x && y) { x *= Math.SQRT1_2; y *= Math.SQRT1_2; }
  return { x, y };
}

// ---------------------------------------------------------------- particles
function burst(x, y, n, color, spd, life, size) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    const s = rand(spd * 0.25, spd);
    state.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: rand(life * 0.5, life),
      max: life,
      r: rand(size * 0.5, size),
      color,
    });
  }
}

function updateParticles(dt) {
  const p = state.particles;
  for (let i = p.length - 1; i >= 0; i--) {
    const q = p[i];
    q.life -= dt;
    if (q.life <= 0) { p.splice(i, 1); continue; }
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    const drag = Math.pow(0.002, dt);
    q.vx *= drag;
    q.vy *= drag;
  }
}

// ---------------------------------------------------------------- game setup
function start() {
  const p = {
    x: W / 2, y: H / 2, vx: 0, vy: 0, r: 13,
    hp: 3, maxHp: 3,
    dashCd: 0, dashTime: 0, dashDx: 1, dashDy: 0,
    invuln: 1.0, face: { x: 1, y: 0 },
  };
  state.player     = p;
  state.bullets    = [];
  state.enemies    = [];
  state.particles  = [];
  state.score      = 0;
  state.combo      = 1;
  state.comboTimer = 0;
  state.spawnTimer = 1.0;
  state.playT      = 0;
  state.hurtFlash  = 0;
  state.reflectFlash = 0;
  state.shake      = 0;
  state.overTimer  = 0;
  state.mode       = 'play';
}

function tryDash() {
  const p = state.player;
  if (!p || p.dashCd > 0 || p.dashTime > 0) return;

  let d = axis();
  if (d.x === 0 && d.y === 0) d = { x: p.face.x, y: p.face.y };
  const len = Math.hypot(d.x, d.y) || 1;

  p.dashDx = d.x / len;
  p.dashDy = d.y / len;
  p.dashTime = DASH_TIME;
  p.dashCd   = DASH_CD;
  p.invuln   = DASH_TIME + 0.07;
  state.shake = Math.max(state.shake, 5);

  burst(p.x, p.y, 14, '#5ef2ff', 220, 0.35, 3);
}

// ---------------------------------------------------------------- spawning
function pickType() {
  const t = state.playT;
  const r = Math.random();
  if (t < 14) return 'drifter';
  if (t < 32) return r < 0.68 ? 'drifter' : 'spinner';
  if (r < 0.50) return 'drifter';
  if (r < 0.85) return 'spinner';
  return 'tank';
}

function spawnEnemy() {
  const def = TYPES[pickType()];
  const m = 70;
  let x, y;
  switch (Math.floor(Math.random() * 4)) {
    case 0: x = rand(0, W); y = -m;     break;
    case 1: x = W + m;      y = rand(0, H); break;
    case 2: x = rand(0, W); y = H + m;  break;
    default:x = -m;         y = rand(0, H); break;
  }
  state.enemies.push({
    x, y, vx: 0, vy: 0,
    r: def.r, hp: def.hp, maxHp: def.hp,
    accel: def.accel, maxSpd: def.maxSpd,
    sides: def.sides,
    fireRate: def.fire,
    bspd: def.bspd,
    spread: def.spread,
    color: def.color,
    score: def.score,
    fireTimer: rand(0.6, def.fire),
    rot: Math.random() * TAU,
    spin: rand(-1.4, 1.4),
    flash: 0,
    dir: Math.random() < 0.5 ? 1 : -1,
  });
}

function updateSpawner(dt) {
  const t = state.playT;
  const maxEnemies = Math.min(14, 3 + Math.floor(t / 11));
  const interval = Math.max(0.55, 1.9 - t * 0.016);

  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0 && state.enemies.length < maxEnemies) {
    spawnEnemy();
    state.spawnTimer = interval * rand(0.8, 1.2);
  }
}

// ---------------------------------------------------------------- player
function updatePlayer(dt) {
  const p = state.player;

  p.dashCd  = Math.max(0, p.dashCd - dt);
  p.invuln  = Math.max(0, p.invuln - dt);

  if (p.dashTime > 0) {
    p.dashTime -= dt;
    p.x += p.dashDx * DASH_SPEED * dt;
    p.y += p.dashDy * DASH_SPEED * dt;
    if (Math.random() < 0.9) burst(p.x, p.y, 1, '#5ef2ff', 40, 0.3, 3);
  } else {
    const a = axis();
    if (a.x || a.y) { p.face.x = a.x; p.face.y = a.y; }

    const accel = 2600;
    p.vx += a.x * accel * dt;
    p.vy += a.y * accel * dt;

    const fr = Math.pow(0.0016, dt);
    p.vx *= fr;
    p.vy *= fr;

    const sp = Math.hypot(p.vx, p.vy);
    const max = 370;
    if (sp > max) { p.vx = p.vx / sp * max; p.vy = p.vy / sp * max; }

    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  // walls
  if (p.x < p.r) { p.x = p.r; p.vx = Math.abs(p.vx) * 0.3; }
  if (p.x > W - p.r) { p.x = W - p.r; p.vx = -Math.abs(p.vx) * 0.3; }
  if (p.y < p.r) { p.y = p.r; p.vy = Math.abs(p.vy) * 0.3; }
  if (p.y > H - p.r) { p.y = H - p.r; p.vy = -Math.abs(p.vy) * 0.3; }
}

function hurtPlayer() {
  const p = state.player;
  if (p.invuln > 0 || p.dashTime > 0) return;

  p.hp--;
  p.invuln = 1.3;
  state.shake = Math.max(state.shake, 16);
  state.hurtFlash = 1;
  state.combo = 1;
  state.comboTimer = 0;
  burst(p.x, p.y, 26, '#ff4d6d', 340, 0.6, 4);

  if (p.hp <= 0) {
    state.mode = 'over';
    state.overTimer = 0.8;
    state.shake = 26;
    burst(p.x, p.y, 60, '#5ef2ff', 520, 1.1, 5);
    burst(p.x, p.y, 30, '#ffffff', 300, 0.8, 3);
    if (state.score > state.best) {
      state.best = state.score;
      localStorage.setItem('reflect_best', String(state.best));
    }
  }
}

// ---------------------------------------------------------------- enemies
function updateEnemies(dt) {
  const p = state.player;
  const E = state.enemies;

  for (let i = E.length - 1; i >= 0; i--) {
    const e = E[i];
    e.flash = Math.max(0, e.flash - dt * 6);
    e.rot += e.spin * dt;

    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;

    // approach, back off, or strafe to keep a firing ring around the player
    if (d > 200) {
      e.vx += ux * e.accel * dt;
      e.vy += uy * e.accel * dt;
    } else if (d < 130) {
      e.vx -= ux * e.accel * dt;
      e.vy -= uy * e.accel * dt;
    } else {
      e.vx += -uy * e.accel * 0.8 * e.dir * dt;
      e.vy +=  ux * e.accel * 0.8 * e.dir * dt;
    }

    const fr = Math.pow(0.05, dt);
    e.vx *= fr;
    e.vy *= fr;

    const sp = Math.hypot(e.vx, e.vy);
    if (sp > e.maxSpd) { e.vx = e.vx / sp * e.maxSpd; e.vy = e.vy / sp * e.maxSpd; }

    e.x += e.vx * dt;
    e.y += e.vy * dt;

    // keep them roughly in the arena
    e.x = clamp(e.x, -120, W + 120);
    e.y = clamp(e.y, -120, H + 120);

    // shooting
    e.fireTimer -= dt;
    if (e.fireTimer <= 0) {
      e.fireTimer = e.fireRate * rand(0.85, 1.2);
      shoot(e, p);
    }

    // contact damage
    if (d < e.r + p.r) {
      hurtPlayer();
      e.vx -= ux * 200;
      e.vy -= uy * 200;
    }
  }

  // soft separation so they don't stack into one blob
  for (let i = 0; i < E.length; i++) {
    for (let j = i + 1; j < E.length; j++) {
      const a = E[i], b = E[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const min = a.r + b.r + 4;
      const d2 = dx * dx + dy * dy;
      if (d2 > 0.001 && d2 < min * min) {
        const d = Math.sqrt(d2);
        const push = (min - d) / d * 0.5;
        a.x -= dx * push; a.y -= dy * push;
        b.x += dx * push; b.y += dy * push;
      }
    }
  }
}

function shoot(e, p) {
  const base = Math.atan2(p.y - e.y, p.x - e.x);
  const n = e.spread;
  for (let i = 0; i < n; i++) {
    const off = n === 1 ? 0 : (i - (n - 1) / 2) * 0.22;
    const a = base + off + rand(-0.03, 0.03);
    state.bullets.push({
      x: e.x + Math.cos(a) * (e.r + 4),
      y: e.y + Math.sin(a) * (e.r + 4),
      vx: Math.cos(a) * e.bspd,
      vy: Math.sin(a) * e.bspd,
      r: 6,
      friendly: false,
      life: 6,
    });
  }
}

// ---------------------------------------------------------------- bullets
function updateBullets(dt) {
  const p = state.player;
  const B = state.bullets;

  for (let i = B.length - 1; i >= 0; i--) {
    const b = B[i];
    b.life -= dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    const margin = 90;
    if (b.life <= 0 || b.x < -margin || b.x > W + margin || b.y < -margin || b.y > H + margin) {
      B.splice(i, 1);
      continue;
    }

    // reflect during dash
    if (!b.friendly && p.dashTime > 0) {
      const rr = p.r + REFLECT_PAD + b.r;
      const dx = b.x - p.x, dy = b.y - p.y;
      if (dx * dx + dy * dy < rr * rr) {
        const sp = Math.hypot(b.vx, b.vy) || 1;
        const ns = sp * 1.7 + 200;
        b.vx = -b.vx / sp * ns;
        b.vy = -b.vy / sp * ns;
        b.friendly = true;
        b.r = 8;
        b.life = 2.2;

        state.shake = Math.max(state.shake, 6);
        state.reflectFlash = 1;
        burst(b.x, b.y, 10, '#7dffb0', 260, 0.4, 3);
        continue;
      }
    }

    // friendly bullet vs enemy
    if (b.friendly) {
      let hit = false;
      for (let j = state.enemies.length - 1; j >= 0; j--) {
        const e = state.enemies[j];
        const dx = b.x - e.x, dy = b.y - e.y;
        const rr = e.r + b.r;
        if (dx * dx + dy * dy < rr * rr) {
          damageEnemy(e, j, b);
          hit = true;
          break;
        }
      }
      if (hit) { B.splice(i, 1); continue; }
    } else {
      // enemy bullet vs player
      const dx = b.x - p.x, dy = b.y - p.y;
      const rr = p.r + b.r;
      if (dx * dx + dy * dy < rr * rr) {
        if (p.invuln <= 0 && p.dashTime <= 0) {
          hurtPlayer();
          burst(b.x, b.y, 12, '#ff4d6d', 220, 0.45, 3);
        }
        B.splice(i, 1);
        continue;
      }
    }
  }
}

function damageEnemy(e, index, bullet) {
  e.hp--;
  e.flash = 1;
  burst(bullet.x, bullet.y, 10, e.color, 240, 0.45, 3);

  if (e.hp <= 0) {
    state.enemies.splice(index, 1);
    state.shake = Math.max(state.shake, 7);
    burst(e.x, e.y, 22, e.color, 320, 0.7, 4);
    burst(e.x, e.y, 8, '#ffffff', 180, 0.4, 2);

    state.score += e.score * state.combo;
    state.combo = Math.min(state.combo + 1, 9);
    state.comboTimer = 3.0;
  } else {
    burst(e.x, e.y, 6, '#ffffff', 160, 0.3, 2);
  }
}

// ---------------------------------------------------------------- combo
function updateCombo(dt) {
  if (state.comboTimer > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) {
      state.combo = 1;
      state.comboTimer = 0;
    }
  }
}

// ---------------------------------------------------------------- update
function update(dt) {
  state.t += dt;

  state.shake = Math.max(0, state.shake - state.shake * 8 * dt - 12 * dt);
  state.hurtFlash   = Math.max(0, state.hurtFlash - dt * 2.6);
  state.reflectFlash = Math.max(0, state.reflectFlash - dt * 5);

  updateParticles(dt);

  if (state.mode === 'over' && state.overTimer > 0) {
    state.overTimer -= dt;
  }

  if (state.mode !== 'play') return;

  state.playT += dt;

  updatePlayer(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updateSpawner(dt);
  updateCombo(dt);
}

// ---------------------------------------------------------------- drawing
function drawGrid() {
  const step = 64;
  ctx.strokeStyle = 'rgba(90,120,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const ox = (state.t * 6) % step;
  for (let x = -step + ox; x < W + step; x += step) {
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = -step; y < H + step; y += step) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const q of state.particles) {
    const a = Math.max(0, q.life / q.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.r * a + 0.5, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawBullets() {
  for (const b of state.bullets) {
    const c = b.friendly ? '#7dffb0' : '#ff4d6d';
    ctx.shadowColor = c;
    ctx.shadowBlur = 18;
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.42, 0, TAU);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawEnemies() {
  for (const e of state.enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.rot);

    ctx.beginPath();
    for (let i = 0; i < e.sides; i++) {
      const a = i / e.sides * TAU - Math.PI / 2;
      const px = Math.cos(a) * e.r;
      const py = Math.sin(a) * e.r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();

    const col = e.flash > 0 ? '#ffffff' : e.color;
    ctx.fillStyle = e.flash > 0 ? 'rgba(255,255,255,0.85)' : e.color + '2e';
    ctx.fill();

    ctx.shadowColor = col;
    ctx.shadowBlur = e.flash > 0 ? 26 : 14;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.restore();
    ctx.shadowBlur = 0;
  }
}

function drawPlayer() {
  const p = state.player;
  if (!p || p.hp <= 0) return;

  const dashing = p.dashTime > 0;
  const blink = p.invuln > 0 && !dashing && Math.floor(state.t * 22) % 2 === 0;

  // reflect aura
  if (dashing) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + REFLECT_PAD, 0, TAU);
    ctx.strokeStyle = 'rgba(125,255,176,0.85)';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#7dffb0';
    ctx.shadowBlur = 24;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + REFLECT_PAD * 0.55, 0, TAU);
    ctx.strokeStyle = 'rgba(94,242,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // dash cooldown ring
  if (p.dashCd > 0) {
    const frac = 1 - p.dashCd / DASH_CD;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 10, -Math.PI / 2, -Math.PI / 2 + frac * TAU);
    ctx.strokeStyle = 'rgba(94,242,255,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ship
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(Math.atan2(p.face.y, p.face.x));

  ctx.beginPath();
  ctx.moveTo(p.r * 1.55, 0);
  ctx.lineTo(-p.r, p.r * 0.9);
  ctx.lineTo(-p.r * 0.4, 0);
  ctx.lineTo(-p.r, -p.r * 0.9);
  ctx.closePath();

  ctx.fillStyle = dashing ? '#c9fdff' : '#5ef2ff';
  ctx.shadowColor = '#5ef2ff';
  ctx.shadowBlur = 20;
  if (!blink) ctx.fill();

  ctx.restore();
  ctx.shadowBlur = 0;
}

function drawHUD() {
  const p = state.player;
  ctx.font = '600 15px ui-monospace, Menlo, Consolas, monospace';
  ctx.textBaseline = 'middle';

  // score
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5ef2ff';
  ctx.shadowColor = '#5ef2ff';
  ctx.shadowBlur = 12;
  ctx.fillText(String(state.score).padStart(5, '0'), 24, 30);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(140,170,255,0.5)';
  ctx.font = '500 12px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillText('BEST ' + String(state.best).padStart(5, '0'), 24, 52);

  // combo
  if (state.combo > 1) {
    ctx.textAlign = 'center';
    const a = clamp(state.comboTimer / 3, 0, 1);
    ctx.globalAlpha = 0.4 + a * 0.6;
    ctx.fillStyle = '#7dffb0';
    ctx.shadowColor = '#7dffb0';
    ctx.shadowBlur = 16;
    ctx.font = '700 26px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText('x' + state.combo, W / 2, 34);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // combo timer bar
    ctx.fillStyle = 'rgba(125,255,176,0.8)';
    ctx.fillRect(W / 2 - 40, 50, 80 * a, 3);
  }

  // health pips
  for (let i = 0; i < p.maxHp; i++) {
    const x = 32 + i * 26, y = H - 34;
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, TAU);
    if (i < p.hp) {
      ctx.fillStyle = '#5ef2ff';
      ctx.shadowColor = '#5ef2ff';
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = 'rgba(94,242,255,0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // dash ready indicator
  ctx.textAlign = 'right';
  ctx.font = '600 12px ui-monospace, Menlo, Consolas, monospace';
  const ready = p.dashCd <= 0;
  ctx.fillStyle = ready ? 'rgba(125,255,176,0.9)' : 'rgba(140,170,255,0.35)';
  if (ready) { ctx.shadowColor = '#7dffb0'; ctx.shadowBlur = 12; }
  ctx.fillText(ready ? 'DASH READY' : 'DASH …', W - 24, H - 34);
  ctx.shadowBlur = 0;
}

function drawTitle() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const pulse = 0.85 + Math.sin(state.t * 2.5) * 0.15;

  ctx.font = '800 76px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = '#5ef2ff';
  ctx.shadowColor = '#5ef2ff';
  ctx.shadowBlur = 34 * pulse;
  ctx.fillText('REFLECT', W / 2, H / 2 - 70);
  ctx.shadowBlur = 0;

  ctx.font = '500 17px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(160,200,255,0.85)';
  ctx.fillText('DASH into bullets to send them back', W / 2, H / 2 - 6);

  ctx.fillStyle = 'rgba(125,255,176,0.9)';
  ctx.font = '600 15px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillText('WASD / ARROWS  move      SPACE  dash', W / 2, H / 2 + 34);

  ctx.globalAlpha = 0.5 + Math.sin(state.t * 4) * 0.5;
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 16px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillText('PRESS SPACE TO START', W / 2, H / 2 + 96);
  ctx.globalAlpha = 1;
}

function drawOver() {
  ctx.fillStyle = 'rgba(6,6,12,0.72)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '800 54px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = '#ff4d6d';
  ctx.shadowColor = '#ff4d6d';
  ctx.shadowBlur = 30;
  ctx.fillText('SHIP LOST', W / 2, H / 2 - 80);
  ctx.shadowBlur = 0;

  ctx.font = '700 30px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = '#5ef2ff';
  ctx.shadowColor = '#5ef2ff';
  ctx.shadowBlur = 18;
  ctx.fillText(String(state.score), W / 2, H / 2 - 10);
  ctx.shadowBlur = 0;

  ctx.font = '500 14px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(160,200,255,0.7)';
  ctx.fillText('BEST ' + state.best, W / 2, H / 2 + 26);

  if (state.overTimer <= 0) {
    ctx.globalAlpha = 0.5 + Math.sin(state.t * 4) * 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 16px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText('PRESS SPACE TO RETRY', W / 2, H / 2 + 90);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // background
  ctx.fillStyle = '#06060c';
  ctx.fillRect(0, 0, W, H);

  // shake
  if (state.shake > 0.3) {
    const s = state.shake;
    ctx.translate(rand(-s, s), rand(-s, s));
  }

  drawGrid();

  if (state.mode !== 'title') {
    drawParticles();
    drawBullets();
    drawEnemies();
    drawPlayer();
  }

  // hurt vignette
  if (state.hurtFlash > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(255,60,90,0)');
    g.addColorStop(1, 'rgba(255,60,90,' + (state.hurtFlash * 0.5) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(-40, -40, W + 80, H + 80);
  }

  // reflect flash
  if (state.reflectFlash > 0) {
    ctx.fillStyle = 'rgba(125,255,176,' + (state.reflectFlash * 0.05) + ')';
    ctx.fillRect(-40, -40, W + 80, H + 80);
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (state.mode === 'title') drawTitle();
  else {
    drawHUD();
    if (state.mode === 'over') drawOver();
  }
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1 / 30) dt = 1 / 30;
  if (dt < 0) dt = 0;

  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// bootstrap: give the player object something to exist as on the title screen
state.player = {
  x: 0, y: 0, vx: 0, vy: 0, r: 13,
  hp: 0, maxHp: 3,
  dashCd: 0, dashTime: 0, dashDx: 1, dashDy: 0,
  invuln: 0, face: { x: 1, y: 0 },
};

requestAnimationFrame(loop);

})();
</script>
