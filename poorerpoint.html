<title>Poorer Point</title>

<link id="hljsTheme" rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">

<script>
  (function () {
    try {
      var t = localStorage.getItem('poorerpoint-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

  /* =========================================================
     BASE
     ========================================================= */
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
    transition:background-color .25s ease, color .25s ease;
  }
  .screen{ position:fixed; inset:0; display:flex; }
  .hidden{ display:none !important; }

  /* ---------------- Start screen ---------------- */
  #startScreen{
    align-items:center; justify-content:center; padding:28px; overflow:auto;
    background:
      radial-gradient(900px 500px at 15% -10%, var(--glow-a), transparent 60%),
      radial-gradient(800px 500px at 95% 110%, var(--glow-b), transparent 60%),
      var(--bg);
    transition:background-color .25s ease;
  }
  .card{
    width:min(780px,100%);
    background:linear-gradient(180deg, var(--card-a), var(--card-b));
    border:1px solid var(--border); border-radius:18px;
    padding:30px 30px 22px;
    box-shadow:0 30px 80px var(--card-shadow), inset 0 1px 0 var(--card-inset);
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card h1{
    margin:0 0 6px; font-size:1.6rem; letter-spacing:-.02em;
    background:linear-gradient(90deg, var(--title-a), var(--title-b));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card p.sub{ margin:0 0 18px; color:var(--fg-dim); font-size:.94rem; line-height:1.5; }
  textarea{
    width:100%; height:300px; resize:vertical;
    background:var(--panel-2); color:var(--fg);
    border:1px solid var(--border); border-radius:12px;
    padding:14px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size:13.5px; line-height:1.6; outline:none;
    transition:border-color .15s, box-shadow .15s, background .25s ease, color .25s ease;
  }
  textarea:focus{ border-color:var(--input-focus); box-shadow:0 0 0 3px var(--input-glow); }
  textarea::placeholder{ color:var(--placeholder); }
  .row{ display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .spacer{ flex:1; }
  button{
    font:inherit; cursor:pointer; border-radius:10px; border:1px solid transparent;
    padding:10px 16px; font-size:.9rem; font-weight:600;
    transition:transform .08s, background .15s, border-color .15s, color .15s;
  }
  button:active{ transform:translateY(1px); }
  button:disabled{ opacity:.35; cursor:default; }
  .primary{
    background:linear-gradient(180deg, var(--primary-a), var(--primary-b));
    color:var(--primary-fg); border-color:var(--primary-border);
    box-shadow:0 8px 24px var(--primary-shadow);
  }
  .primary:hover:not(:disabled){
    background:linear-gradient(180deg, var(--primary-hover-a), var(--primary-hover-b));
  }
  .ghost{ background:var(--ghost-bg); color:var(--fg-dim); border-color:var(--border); }
  .ghost:hover:not(:disabled){
    background:var(--ghost-hover); color:var(--fg); border-color:var(--ghost-border);
  }
  .small{ padding:7px 12px; font-size:.82rem; }

  /* ---------------- Theme picker ---------------- */
  .theme-picker{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-top:20px; padding-top:16px; border-top:1px solid var(--border);
  }
  .theme-picker-label{
    font-size:.7rem; font-weight:750; letter-spacing:.11em; text-transform:uppercase;
    color:var(--fg-dimmer); flex:0 0 auto;
  }
  .theme-options{ display:flex; flex-wrap:wrap; gap:7px; }
  .theme-btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:4px 11px 4px 5px;
    background:var(--ghost-bg); border:1px solid var(--border);
    border-radius:999px; color:var(--fg-dim);
    font-size:.78rem; font-weight:600; line-height:1;
    transition:background .15s, border-color .15s, color .15s, box-shadow .15s, transform .08s;
  }
  .theme-btn:hover{ background:var(--ghost-hover); color:var(--fg); }
  .theme-btn.active{
    color:var(--fg); border-color:var(--accent);
    box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .theme-dot{
    width:16px; height:16px; border-radius:50%; flex:0 0 auto;
    border:1px solid rgba(128,128,128,.35);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  }

  /* ---------------- Deck ---------------- */
  #deckScreen{ flex-direction:column; background:var(--bg); }
  .progress{ height:3px; background:var(--progress-track); flex:0 0 auto; }
  #progressBar{
    height:100%; width:0;
    background:linear-gradient(90deg, var(--progress-a), var(--progress-b));
    transition:width .3s cubic-bezier(.22,.61,.36,1);
  }
  .crumbs{
    flex:0 0 auto; padding:20px 38px 16px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--crumb-tint), transparent);
    max-height:34vh; overflow-y:auto;
  }
  .crumb{
    padding-left:calc(var(--indent) * 1.15rem);
    line-height:1.4; position:relative;
  }
  .crumb + .crumb{ margin-top:2px; }
  .crumb-1{ font-size:1.75rem; font-weight:750; letter-spacing:-.025em; color:var(--crumb-1); }
  .crumb-2{ font-size:1.22rem; font-weight:650; color:var(--crumb-2); }
  .crumb-3{ font-size:1.03rem; font-weight:600; color:var(--crumb-3); }
  .crumb-4,.crumb-5,.crumb-6{ font-size:.92rem; font-weight:600; color:var(--crumb-4); }
  .crumb code{ font-size:.85em; }

  .content{
    flex:1 1 auto; overflow-y:auto;
    padding:34px 38px 80px; outline:none;
  }
  .content-inner{ max-width:900px; margin:0 auto; }

  @keyframes slideNext{ from{opacity:0; transform:translateX(26px);} to{opacity:1; transform:none;} }
  @keyframes slidePrev{ from{opacity:0; transform:translateX(-26px);} to{opacity:1; transform:none;} }
  .anim-next{ animation:slideNext .3s cubic-bezier(.22,.61,.36,1); }
  .anim-prev{ animation:slidePrev .3s cubic-bezier(.22,.61,.36,1); }

  .toolbar{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:12px 22px; border-top:1px solid var(--border); background:var(--panel);
  }
  .counter{
    display:inline-block; font-variant-numeric:tabular-nums;
    color:var(--fg-dim); font-size:.85rem; font-weight:600;
    min-width:74px; text-align:center;
    transition:color .15s ease, text-shadow .15s ease;
  }
  .counter.typing{
    color:var(--accent); font-weight:800;
    text-shadow:0 0 14px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  @keyframes counterShake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-4px); }
    45%{ transform:translateX(3px); }
    70%{ transform:translateX(-2px); }
  }
  .counter.invalid{
    color:var(--danger); font-weight:800; animation:counterShake .35s ease;
  }
  .scroll-hint{
    font-size:.76rem; font-weight:650; color:var(--fg-dimmer);
    padding:3px 9px; border:1px solid var(--border); border-radius:999px;
    background:var(--hint-bg); white-space:nowrap;
  }
  .hint{ margin-left:auto; color:var(--fg-dimmer); font-size:.78rem; }
  @media (max-width:820px){ .hint{ display:none; } }
  @media (max-width:640px){
    .crumbs{ padding:16px 20px 12px; }
    .content{ padding:24px 20px 60px; }
  }

  /* ---------------- Touch support ---------------- */
  /* Allow native vertical panning, let us handle horizontal gestures. */
  .content,
  .crumbs{
    touch-action: pan-y;
  }
  /* Code blocks keep horizontal scroll for long lines. */
  .content-inner pre{
    touch-action: pan-x pan-y;
  }
  /* Prevent rubber-band on short slides. */
  .content{ overscroll-behavior: contain; }

  /* One-time gesture hint toast */
  .touch-toast{
    position:fixed;
    left:50%; bottom:78px;
    transform:translate(-50%, 20px);
    background:var(--panel);
    color:var(--fg);
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:999px;
    font-size:.85rem; font-weight:600;
    box-shadow:0 14px 44px rgba(0,0,0,.32);
    opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    z-index:200;
    max-width:calc(100vw - 32px);
    text-align:center;
    white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .touch-toast.visible{
    opacity:1;
    transform:translate(-50%, 0);
  }
  @media (max-width:520px){
    .touch-toast{ font-size:.78rem; padding:9px 14px; bottom:70px; }
  }

  /* ---------------- Rendered markdown ---------------- */
  .content-inner{ font-size:1.05rem; line-height:1.75; color:var(--content-fg); }
  .content-inner > *:first-child{ margin-top:0; }
  .content-inner > *:last-child{ margin-bottom:0; }

  .content-inner p{ margin:0 0 1.1em; }
  .content-inner h1,.content-inner h2,.content-inner h3,
  .content-inner h4,.content-inner h5,.content-inner h6{

<body>

<!-- ================= START ================= -->

  <div class="card">

    <p class="sub">
      Paste markdown below. Headings become the slide header (indented by level) and
      <strong>all content under a heading becomes one slide</strong>.
    </p>
    <textarea id="mdInput" spellcheck="false" placeholder="# Title&#10;&#10;## Section&#10;&#10;Your content…"></textarea>
    <div class="row">

<section id="deckScreen" class="screen hidden">
  <div class="progress"><div id="progressBar"></div></div>

    <button id="nextBtn" class="ghost small">Next ›</button>

      <button class="primary" id="teSaveBtn">Save custom</button>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. MARKDOWN-IT + HIGHLIGHT.JS
     ========================================================= */

  const md = window.markdownit({
    html: true,
    linkify: true,
    typographer: true,
    highlight: function (str, lang) {
      if (lang && hljs.getLanguage(lang)) {
        try {
          return '<pre><code class="hljs">' +
                 hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                 '</code></pre>';
        } catch (__) {}
      }
      return '<pre><code class="hljs">' +
             md.utils.escapeHtml(str) +
             '</code></pre>';
    }
  });

  /* =========================================================
     2. SLIDE SPLITTING
     ========================================================= */

  function splitSlides(markdown) {
    const lines = String(markdown).replace(/\r\n?/g, '\n').split('\n');
    const slides = [];
    const stack = [];
    let current = null;

    function flush() {
      if (current && current.markdown.trim()) slides.push(current);
      current = null;
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const m = /^ {0,3}(#{1,6})(?:[ \t]+([\s\S]*?))?[ \t]*#*[ \t]*$/.exec(line);

      if (m) {
        flush();
        const level = m[1].length;
        const text = (m[2] || '').trim();
        while (stack.length && stack[stack.length - 1].level >= level) stack.pop();
        stack.push({ level: level, text: text });
        current = { headers: stack.slice(), markdown: '' };
      } else {
        if (!current) current = { headers: [], markdown: '' };
        current.markdown += line + '\n';
      }
    }

    flush();
    return slides;
  }

  /* =========================================================
     3. APP
     ========================================================= */

  const $ = function (id) { return document.getElementById(id); };

  const startScreen = $('startScreen');
  const deckScreen  = $('deckScreen');
  const mdInput     = $('mdInput');
  const crumbsEl    = $('crumbs');
  const contentEl   = $('content');
  const innerEl     = $('contentInner');
  const counterEl   = $('counter');
  const progressEl  = $('progressBar');
  const prevBtn     = $('prevBtn');
  const nextBtn     = $('nextBtn');
  const scrollHint  = $('scrollHint');
  const hljsTheme   = $('hljsTheme');

  let slides = [];
  let idx = 0;

  /* --- numeric jump buffer --- */
  let numBuf = '';
  let flashTimer = null;
  const MAX_DIGITS = 6;

  function updateCounter() {
    if (numBuf) {
      counterEl.textContent = numBuf + ' / ' + slides.length;
      counterEl.classList.add('typing');
    } else {
      counterEl.textContent = (idx + 1) + ' / ' + slides.length;
      counterEl.classList.remove('typing');
    }
  }

  function clearNumBuf() {
    if (numBuf) { numBuf = ''; updateCounter(); }
  }

  function flashInvalid() {
    counterEl.classList.remove('invalid');
    void counterEl.offsetWidth;
    counterEl.classList.add('invalid');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () {
      counterEl.classList.remove('invalid');
    }, 650);
  }

  function commitJump() {
    if (!numBuf) return;
    const n = parseInt(numBuf, 10);
    numBuf = '';
    counterEl.classList.remove('typing');

    if (n >= 1 && n <= slides.length) jump(n - 1);
    else { updateCounter(); flashInvalid(); }
  }

  function start() {
    const markdown = mdInput.value;
    if (!markdown.trim()) { mdInput.focus(); return; }

    slides = splitSlides(markdown);

    if (!slides.length) {
      alert('No slides found.\n\nAdd some content under your headings.');
      return;
    }

    idx = 0;
    numBuf = '';
    counterEl.classList.remove('typing', 'invalid');

    startScreen.classList.add('hidden');
    deckScreen.classList.remove('hidden');
    render(0);
    contentEl.focus();

    maybeShowTouchHint();
  }

  function exit() {
    clearNumBuf();
    deckScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    mdInput.focus();
  }

  function render(dir) {
    const s = slides[idx];

    if (s.headers.length) {
      crumbsEl.classList.remove('hidden');
      crumbsEl.innerHTML = s.headers.map(function (h) {
        return '<div class="crumb crumb-' + h.level + '" style="--indent:' + (h.level - 1) + '">' +
               md.utils.escapeHtml(h.text) + '</div>';
      }).join('');
    } else {
      crumbsEl.innerHTML = '';
      crumbsEl.classList.add('hidden');
    }

    innerEl.innerHTML = md.render(s.markdown);
    contentEl.scrollTop = 0;
    updateScrollHint();

    updateCounter();
    progressEl.style.width = (((idx + 1) / slides.length) * 100) + '%';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === slides.length - 1;

    if (dir) {
      innerEl.classList.remove('anim-next', 'anim-prev');
      void innerEl.offsetWidth;
      innerEl.classList.add(dir > 0 ? 'anim-next' : 'anim-prev');
    }
  }

  function go(delta) {
    const next = idx + delta;
    if (next < 0 || next >= slides.length) return;
    clearNumBuf();
    idx = next;
    render(delta);
  }

  function jump(to) {
    if (to < 0 || to >= slides.length) return;
    clearNumBuf();
    if (to === idx) { updateCounter(); return; }
    const dir = to > idx ? 1 : -1;
    idx = to;
    render(dir);
  }

  /* ---------------- scrolling inside a slide ---------------- */

  function maxScroll() {
    return Math.max(0, contentEl.scrollHeight - contentEl.clientHeight);
  }

  function canScroll(dir) {
    const m = maxScroll();
    if (m <= 2) return false;
    return dir > 0 ? contentEl.scrollTop < m - 2 : contentEl.scrollTop > 2;
  }

  function scrollStep(dir) {
    const m = maxScroll();
    const amount = Math.max(60, contentEl.clientHeight * 0.85);
    const top = Math.max(0, Math.min(m, contentEl.scrollTop + dir * amount));
    contentEl.scrollTo({ top: top, behavior: 'smooth' });
  }

  function step(dir) {
    clearNumBuf();
    if (canScroll(dir)) scrollStep(dir);
    else go(dir);
  }

  function updateScrollHint() {
    const m = maxScroll();
    if (m <= 2) { scrollHint.classList.add('hidden'); return; }
    scrollHint.classList.remove('hidden');
    const atTop = contentEl.scrollTop <= 2;
    const atBottom = contentEl.scrollTop >= m - 2;
    scrollHint.textContent = atTop ? '↓ scroll' : atBottom ? '↑ scroll' : '↕ scroll';
  }

  contentEl.addEventListener('scroll', updateScrollHint, { passive: true });
  window.addEventListener('resize', updateScrollHint);

  /* =========================================================
     4. TOUCH SUPPORT
     - Swipe left / right on the deck → next / prev slide
     - Tap left 25% → prev, right 25% → next, middle → step forward
     - Taps on links/buttons/inputs are passed through untouched
     ========================================================= */

  const SWIPE_MIN_DIST = 50;    // px
  const SWIPE_MAX_TIME = 700;   // ms
  const SWIPE_RATIO    = 1.4;   // horizontal must dominate vertical
  const TAP_MAX_DIST   = 12;    // px
  const TAP_MAX_TIME   = 400;   // ms

  const touchState = {
    active: false,
    startX: 0,
    startY: 0,
    startTime: 0,
    moved: false
  };

  function isInteractive(el) {
    if (!el) return false;
    if (el.closest) {
      return !!(el.closest('a, button, input, textarea, select, label'));
    }
    return false;
  }

  function handleTap(x) {
    const w = window.innerWidth || 1;
    const rel = x / w;
    if (rel < 0.25) go(-1);
    else if (rel > 0.75) go(1);
    else step(1);
  }

  deckScreen.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    touchState.active = true;
    touchState.startX = t.clientX;
    touchState.startY = t.clientY;
    touchState.startTime = Date.now();
    touchState.moved = false;
  }, { passive: true });

  deckScreen.addEventListener('touchmove', function (e) {
    if (!touchState.active) return;
    const t = e.touches[0];
    if (!t) return;
    const dx = t.clientX - touchState.startX;
    const dy = t.clientY - touchState.startY;
    if (Math.abs(dx) > TAP_MAX_DIST || Math.abs(dy) > TAP_MAX_DIST) {
      touchState.moved = true;
    }
  }, { passive: true });

  deckScreen.addEventListener('touchend', function (e) {
    if (!touchState.active) return;
    const t = e.changedTouches[0];
    touchState.active = false;
    if (!t) return;

    const dx = t.clientX - touchState.startX;
    const dy = t.clientY - touchState.startY;
    const dt = Date.now() - touchState.startTime;

    /* ---- Horizontal swipe ---- */
    if (Math.abs(dx) >= SWIPE_MIN_DIST &&
        Math.abs(dx) > Math.abs(dy) * SWIPE_RATIO &&
        dt < SWIPE_MAX_TIME) {
      // clear any accidental text selection from the drag
      const sel = window.getSelection && window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();

      if (dx < 0) go(1);          // swipe left → next
      else        go(-1);         // swipe right → prev
      return;
    }

    /* ---- Tap ---- */
    if (!touchState.moved && dt < TAP_MAX_TIME) {
      if (isInteractive(e.target)) return;   // let links/buttons do their thing
      handleTap(t.clientX);
    }
  }, { passive: true });

  /* Cancel gesture if the browser fires touchcancel */
  deckScreen.addEventListener('touchcancel', function () {
    touchState.active = false;
  }, { passive: true });

  /* One-time gesture hint for touch users */
  function maybeShowTouchHint() {
    const KEY = 'poorerpoint-touch-hint-v1';
    try { if (localStorage.getItem(KEY)) return; } catch (e) {}

    const isTouch = ('ontouchstart' in window) ||
                    (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);
    if (!isTouch) return;

    const toast = document.createElement('div');
    toast.className = 'touch-toast';
    toast.textContent = 'Swipe ← → to change slides · Tap to advance';
    document.body.appendChild(toast);

    requestAnimationFrame(function () { toast.classList.add('visible'); });

    setTimeout(function () {
      toast.classList.remove('visible');
      setTimeout(function () { toast.remove(); }, 400);
    }, 3800);

    try { localStorage.setItem(KEY, '1'); } catch (e) {}
  }

  /* =========================================================
     5. THEME SYSTEM
     ========================================================= */

  const THEMES = [
    { id: 'midnight',  name: 'Midnight',   dot: ['#0b0d13', '#7c9cff', '#a78bfa'], hljs: 'atom-one-dark' },
    { id: 'nord',      name: 'Nord',       dot: ['#2e3440', '#88c0d0', '#b48ead'], hljs: 'nord' },
    { id: 'rose',      name: 'Rosé Pine',  dot: ['#191724', '#c4a7e7', '#eb6f92'], hljs: 'rosé-pine' },
    { id: 'gruvbox',   name: 'Gruvbox',    dot: ['#282828', '#fabd2f', '#fe8019'], hljs: 'gruvbox-dark' },
    { id: 'solarized', name: 'Solarized',  dot: ['#fdf6e3', '#268bd2', '#6c71c4'], hljs: 'solarized-light' },
    { id: 'paper',     name: 'Paper',      dot: ['#f7f7f5', '#0969da', '#8250df'], hljs: 'github' }
  ];

  const THEME_KEY = 'poorerpoint-theme';
  const CUSTOM_KEY = 'poorerpoint-custom-theme';

  const THEME_VARS = [
    { key: '--bg',            group: 'Backgrounds', type: 'color' },
    { key: '--panel',         group: 'Backgrounds', type: 'color' },
    { key: '--panel-2',       group: 'Backgrounds', type: 'color' },
    { key: '--card-a',        group: 'Backgrounds', type: 'color' },
    { key: '--card-b',        group: 'Backgrounds', type: 'color' },
    { key: '--code-bg',       group: 'Backgrounds', type: 'color' },
    { key: '--hint-bg',       group: 'Backgrounds', type: 'color' },

    { key: '--fg',            group: 'Text', type: 'color' },
    { key: '--fg-dim',        group: 'Text', type: 'color' },
    { key: '--fg-dimmer',     group: 'Text', type: 'color' },
    { key: '--content-fg',    group: 'Text', type: 'color' },
    { key: '--content-h',     group: 'Text', type: 'color' },
    { key: '--content-strong',group: 'Text', type: 'color' },
    { key: '--content-em',    group: 'Text', type: 'color' },

    { key: '--accent',        group: 'Accents', type: 'color' },
    { key: '--accent-2',      group: 'Accents', type: 'color' },
    { key: '--danger',        group: 'Accents', type: 'color' },

    { key: '--border',        group: 'Borders', type: 'color' },
    { key: '--hr-color',      group: 'Borders', type: 'color' },
    { key: '--scroll-thumb',  group: 'Borders', type: 'color' },

    { key: '--primary-a',     group: 'Buttons', type: 'color' },
    { key: '--primary-b',     group: 'Buttons', type: 'color' },
    { key: '--primary-fg',    group: 'Buttons', type: 'color' },
    { key: '--ghost-bg',      group: 'Buttons', type: 'color' },
    { key: '--ghost-hover',   group: 'Buttons', type: 'color' },

    { key: '--inline-code-bg',    group: 'Code', type: 'color' },
    { key: '--inline-code-fg',    group: 'Code', type: 'color' },
    { key: '--pre-code-fg',       group: 'Code', type: 'color' },

    { key: '--glow-a',        group: 'Effects', type: 'text' },
    { key: '--glow-b',        group: 'Effects', type: 'text' },
    { key: '--card-shadow',   group: 'Effects', type: 'text' },
    { key: '--primary-shadow',group: 'Effects', type: 'text' },
    { key: '--crumb-tint',    group: 'Effects', type: 'text' },
    { key: '--blockquote-tint',group:'Effects', type: 'text' }
  ];

  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function setVar(name, value) {
    document.documentElement.style.setProperty(name, value);
  }
  function clearInlineVars() {
    THEME_VARS.forEach(function (v) {
      document.documentElement.style.removeProperty(v.key);
    });
  }

  let customVars = {};

  function loadCustomFromStorage() {
    try {
      const raw = localStorage.getItem(CUSTOM_KEY);
      if (raw) customVars = JSON.parse(raw) || {};
    } catch (e) { customVars = {}; }
  }
  function saveCustomToStorage() {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customVars)); } catch (e) {}
  }
  function clearCustomStorage() {
    try { localStorage.removeItem(CUSTOM_KEY); } catch (e) {}
    customVars = {};
  }

  function applyTheme(id) {
    if (id !== 'custom') clearInlineVars();
    document.documentElement.setAttribute('data-theme', id);
    try { localStorage.setItem(THEME_KEY, id); } catch (e) {}

    let hljsName = 'atom-one-dark';
    if (id === 'custom') {
      const cur = THEMES.find(function (t) { return t.id === currentThemeBase(); });
      hljsName = cur ? cur.hljs : 'atom-one-dark';
    } else {
      const theme = THEMES.find(function (t) { return t.id === id; });
      if (theme) hljsName = theme.hljs;
    }
    if (hljsTheme) {
      hljsTheme.href =
        'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/' +
        hljsName + '.min.css';
    }

    updateThemePickerActive(id);
    updateEditorHeader(id);
  }

  function currentTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    if (t === 'custom') return 'custom';
    for (const th of THEMES) if (th.id === t) return t;
    return 'midnight';
  }

  function currentThemeBase() {
    const t = currentTheme();
    if (t !== 'custom') return t;
    try {
      const last = localStorage.getItem('poorerpoint-last-builtin');
      if (last) return last;
    } catch (e) {}
    return 'midnight';
  }

  function updateThemePickerActive(id) {
    const opts = $('themeOptions');
    if (!opts) return;
    for (const btn of opts.children) {
      btn.classList.toggle('active', btn.dataset.theme === id);
    }
  }

  function updateEditorHeader(id) {
    const nameEl = $('teThemeName');
    if (!nameEl) return;
    if (id === 'custom') nameEl.textContent = 'Custom';
    else {
      const theme = THEMES.find(function (t) { return t.id === id; });
      nameEl.textContent = theme ? theme.name : 'Midnight';
    }
  }

  function buildThemePicker() {
    const wrap = $('themeOptions');
    if (!wrap) return;
    wrap.innerHTML = '';

    THEMES.forEach(function (t) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'theme-btn';
      btn.dataset.theme = t.id;
      btn.title = t.name + ' theme';

      const dot = document.createElement('span');
      dot.className = 'theme-dot';
      dot.style.background =
        'linear-gradient(135deg, ' + t.dot[0] + ' 0%, ' +
        t.dot[1] + ' 58%, ' + t.dot[2] + ' 100%)';

      const label = document.createElement('span');
      label.textContent = t.name;

      btn.appendChild(dot);
      btn.appendChild(label);
      btn.addEventListener('click', function () {
        try { localStorage.setItem('poorerpoint-last-builtin', t.id); } catch (e) {}
        applyTheme(t.id);
      });
      wrap.appendChild(btn);
    });

    const saved = currentTheme();
    if (saved === 'custom' && Object.keys(customVars).length) {
      applyCustomVars(customVars);
      document.documentElement.setAttribute('data-theme', 'custom');
      updateThemePickerActive('custom');
      updateEditorHeader('custom');
    } else {
      applyTheme(saved === 'custom' ? 'midnight' : saved);
    }
  }

  function applyCustomVars(vars) {
    clearInlineVars();
    Object.keys(vars).forEach(function (k) {
      document.documentElement.style.setProperty(k, vars[k]);
    });
  }

  /* =========================================================
     6. THEME EDITOR
     ========================================================= */

  const themeEditor   = $('themeEditor');
  const teBody        = $('teBody');
  const teCloseBtn    = $('teCloseBtn');
  const teResetBtn    = $('teResetBtn');
  const teRandomBtn   = $('teRandomBtn');
  const teExportBtn   = $('teExportBtn');
  const teImportBtn   = $('teImportBtn');
  const teSaveBtn     = $('teSaveBtn');

  let builtinSnapshot = {};

  function snapshotBuiltinVars() {
    builtinSnapshot = {};
    THEME_VARS.forEach(function (v) {
      builtinSnapshot[v.key] = getVar(v.key);
    });
  }

  function buildThemeEditor() {
    if (!teBody) return;
    teBody.innerHTML = '';

    const groups = {};
    THEME_VARS.forEach(function (v) {
      if (!groups[v.group]) groups[v.group] = [];
      groups[v.group].push(v);
    });

    Object.keys(groups).forEach(function (groupName) {
      const groupEl = document.createElement('div');
      groupEl.className = 'te-group';

      const title = document.createElement('div');
      title.className = 'te-group-title';
      title.textContent = groupName;
      groupEl.appendChild(title);

      groups[groupName].forEach(function (v) {
        const row = document.createElement('div');
        row.className = 'te-row';

        const label = document.createElement('label');
        label.textContent = v.key;
        label.title = v.key;
        row.appendChild(label);

        if (v.type === 'color') {
          const wrap = document.createElement('div');
          wrap.className = 'te-color-wrap';

          const picker = document.createElement('input');
          picker.type = 'color';
          picker.value = normalizeColor(getVar(v.key));
          picker.dataset.var = v.key;

          const text = document.createElement('input');
          text.type = 'text';
          text.value = getVar(v.key);
          text.dataset.var = v.key;
          text.spellcheck = false;

          picker.addEventListener('input', function () {
            text.value = picker.value;
            setVar(v.key, picker.value);
            customVars[v.key] = picker.value;
          });

          text.addEventListener('input', function () {
            const val = text.value.trim();
            if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(val)) picker.value = val;
            setVar(v.key, val);
            customVars[v.key] = val;
          });

          wrap.appendChild(picker);
          row.appendChild(wrap);
          row.appendChild(text);
        } else {
          const text = document.createElement('input');
          text.type = 'text';
          text.value = getVar(v.key);
          text.dataset.var = v.key;
          text.spellcheck = false;

          text.addEventListener('input', function () {
            setVar(v.key, text.value);
            customVars[v.key] = text.value;
          });

          row.appendChild(text);
        }

        groupEl.appendChild(row);
      });

      teBody.appendChild(groupEl);
    });
  }

  function normalizeColor(c) {
    c = String(c).trim();
    if (/^#([0-9a-f])([0-9a-f])([0-9a-f])$/i.test(c)) {
      return '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
    }
    if (/^#([0-9a-f]{6})$/i.test(c)) return c;
    const m = /^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(c);
    if (m) {
      const toHex = function (n) {
        const h = Math.max(0, Math.min(255, parseInt(n, 10))).toString(16);
        return h.length === 1 ? '0' + h : h;
      };
      return '#' + toHex(m[1]) + toHex(m[2]) + toHex(m[3]);
    }
    return '#000000';
  }

  function openThemeEditor() {
    const base = currentThemeBase();
    document.documentElement.setAttribute('data-theme', base);
    clearInlineVars();
    void document.body.offsetWidth;
    snapshotBuiltinVars();

    loadCustomFromStorage();
    if (Object.keys(customVars).length) applyCustomVars(customVars);

    buildThemeEditor();
    themeEditor.classList.remove('hidden');
    teBody.scrollTop = 0;
  }

  function closeThemeEditor() {
    themeEditor.classList.add('hidden');
    const active = currentTheme();
    if (active === 'custom' && Object.keys(customVars).length) {
      applyCustomVars(customVars);
      document.documentElement.setAttribute('data-theme', 'custom');
      updateThemePickerActive('custom');
      updateEditorHeader('custom');
    } else {
      applyTheme(active);
    }
  }

  function resetToBuiltin() {
    const base = currentThemeBase();
    clearInlineVars();
    document.documentElement.setAttribute('data-theme', base);
    void document.body.offsetWidth;
    snapshotBuiltinVars();
    customVars = {};
    buildThemeEditor();
    updateThemePickerActive(base);
    updateEditorHeader(base);
  }

  function randomizeTheme() {
    const h = Math.floor(Math.random() * 360);
    const h2 = (h + 40 + Math.floor(Math.random() * 80)) % 360;
    const isDark = Math.random() > 0.45;

    const hsl = function (hue, sat, light) {
      return 'hsl(' + hue + ', ' + sat + '%, ' + light + '%)';
    };

    const baseBg = isDark ? hsl(h, 20, 8) : hsl(h, 25, 96);
    const baseFg = isDark ? hsl(h, 15, 92) : hsl(h, 20, 12);

    customVars = {};

    customVars['--bg']           = baseBg;
    customVars['--panel']        = isDark ? hsl(h, 18, 14) : hsl(h, 20, 98);
    customVars['--panel-2']      = isDark ? hsl(h, 20, 10) : hsl(h, 18, 99);
    customVars['--card-a']       = isDark ? hsl(h, 18, 16) : '#ffffff';
    customVars['--card-b']       = isDark ? hsl(h, 20, 12) : hsl(h, 15, 99);
    customVars['--code-bg']      = isDark ? hsl(h, 22, 9)  : hsl(h, 15, 97);
    customVars['--hint-bg']      = isDark ? hsl(h, 18, 15) : hsl(h, 15, 96);

    customVars['--fg']           = baseFg;
    customVars['--fg-dim']       = isDark ? hsl(h, 10, 68) : hsl(h, 10, 42);
    customVars['--fg-dimmer']    = isDark ? hsl(h, 8, 48)  : hsl(h, 8, 58);
    customVars['--content-fg']   = isDark ? hsl(h, 12, 88) : hsl(h, 15, 18);
    customVars['--content-h']    = isDark ? '#ffffff'        : hsl(h, 20, 8);
    customVars['--content-strong']= isDark ? '#ffffff'        : '#000000';
    customVars['--content-em']   = isDark ? hsl(h2, 60, 80)  : hsl(h2, 50, 30);

    customVars['--accent']       = hsl(h, 70, isDark ? 70 : 45);
    customVars['--accent-2']     = hsl(h2, 65, isDark ? 68 : 48);
    customVars['--danger']       = 'hsl(0, 75%, 60%)';

    customVars['--border']       = isDark ? hsl(h, 15, 24) : hsl(h, 15, 88);
    customVars['--hr-color']     = isDark ? hsl(h, 15, 28) : hsl(h, 15, 85);
    customVars['--scroll-thumb'] = isDark ? hsl(h, 15, 28) : hsl(h, 12, 80);

    customVars['--primary-a']    = hsl(h, 70, isDark ? 68 : 55);
    customVars['--primary-b']    = hsl(h, 70, isDark ? 58 : 45);
    customVars['--primary-fg']   = isDark ? hsl(h, 40, 10) : '#ffffff';
    customVars['--ghost-bg']     = isDark ? hsl(h, 18, 18) : hsl(h, 15, 94);
    customVars['--ghost-hover']  = isDark ? hsl(h, 18, 24) : hsl(h, 15, 90);

    customVars['--inline-code-bg']    = isDark ? hsl(h, 20, 16) : hsl(h, 15, 94);
    customVars['--inline-code-fg']    = hsl(h2, 60, isDark ? 72 : 45);
    customVars['--pre-code-fg']       = isDark ? hsl(h, 10, 85) : hsl(h, 15, 20);

    customVars['--glow-a']       = 'hsla(' + h + ', 70%, 65%, .12)';
    customVars['--glow-b']       = 'hsla(' + h2 + ', 65%, 65%, .10)';
    customVars['--card-shadow']  = isDark ? 'rgba(0,0,0,.55)' : 'rgba(0,0,0,.10)';
    customVars['--primary-shadow']= 'hsla(' + h + ', 70%, 55%, .28)';
    customVars['--crumb-tint']   = 'hsla(' + h + ', 70%, 65%, .05)';
    customVars['--blockquote-tint']= 'hsla(' + h + ', 70%, 65%, .07)';

    applyCustomVars(customVars);
    document.documentElement.setAttribute('data-theme', 'custom');
    buildThemeEditor();
    updateThemePickerActive('custom');
    updateEditorHeader('custom');
  }

  function exportTheme() {
    const data = { name: 'Custom Theme', vars: customVars };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'poorerpoint-theme.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importTheme() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', function () {
      const f = input.files && input.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const data = JSON.parse(reader.result);
          if (data && data.vars && typeof data.vars === 'object') {
            customVars = data.vars;
            applyCustomVars(customVars);
            document.documentElement.setAttribute('data-theme', 'custom');
            buildThemeEditor();
            updateThemePickerActive('custom');
            updateEditorHeader('custom');
          } else alert('Invalid theme file: missing "vars" object.');
        } catch (e) { alert('Could not parse theme file.'); }
      };
      reader.readAsText(f);
    });
    input.click();
  }

  function saveCustomTheme() {
    saveCustomToStorage();
    applyCustomVars(customVars);
    document.documentElement.setAttribute('data-theme', 'custom');
    updateThemePickerActive('custom');
    updateEditorHeader('custom');
    const btn = teSaveBtn;
    const old = btn.textContent;
    btn.textContent = 'Saved ✓';
    setTimeout(function () { btn.textContent = old; }, 1200);
  }

  /* =========================================================
     7. EVENTS
     ========================================================= */

  $('startBtn').addEventListener('click', start);
  $('exitBtn').addEventListener('click', exit);
  prevBtn.addEventListener('click', function () { go(-1); });
  nextBtn.addEventListener('click', function () { go(1); });

  $('clearBtn').addEventListener('click', function () {
    mdInput.value = '';
    mdInput.focus();
  });
  $('sampleBtn').addEventListener('click', function () {
    mdInput.value = SAMPLE;
    mdInput.focus();
  });

  $('themeEditorBtn').addEventListener('click', openThemeEditor);
  teCloseBtn.addEventListener('click', closeThemeEditor);
  teResetBtn.addEventListener('click', resetToBuiltin);
  teRandomBtn.addEventListener('click', randomizeTheme);
  teExportBtn.addEventListener('click', exportTheme);
  teImportBtn.addEventListener('click', importTheme);
  teSaveBtn.addEventListener('click', saveCustomTheme);

  themeEditor.addEventListener('click', function (e) {
    if (e.target === themeEditor) closeThemeEditor();
  });

  document.addEventListener('keydown', function (e) {
    if (!themeEditor.classList.contains('hidden')) {
      if (e.key === 'Escape') { e.preventDefault(); closeThemeEditor(); }
      return;
    }

    if (deckScreen.classList.contains('hidden')) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); start(); }
      return;
    }

    const plain = !e.metaKey && !e.ctrlKey && !e.altKey;

    if (plain) {
      if (e.key.length === 1 && e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        if (numBuf === '' && e.key === '0') return;
        if (numBuf.length >= MAX_DIGITS) return;
        numBuf += e.key;
        updateCounter();
        return;
      }
      if (e.key === 'Backspace') {
        e.preventDefault();
        if (numBuf) { numBuf = numBuf.slice(0, -1); updateCounter(); }
        return;
      }
    }

    switch (e.key) {
      case 'ArrowRight': e.preventDefault(); go(1); break;
      case 'ArrowLeft':  e.preventDefault(); go(-1); break;

      case 'Enter':
        e.preventDefault();
        if (numBuf) commitJump();
        else go(1);
        break;

      case ' ':
      case 'Spacebar':
      case 'ArrowDown':
      case 'PageDown':
        e.preventDefault(); step(1); break;

      case 'ArrowUp':
      case 'PageUp':
        e.preventDefault(); step(-1); break;

      case 'Home': e.preventDefault(); jump(0); break;
      case 'End':  e.preventDefault(); jump(slides.length - 1); break;

      case 'Escape':
        e.preventDefault();
        if (numBuf) clearNumBuf();
        else exit();
        break;
    }
  });

  ['dragover', 'drop'].forEach(function (evt) {
    mdInput.addEventListener(evt, function (e) {
      e.preventDefault();
      if (evt !== 'drop') return;
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function () { mdInput.value = String(reader.result); };
      reader.readAsText(f);
    });
  });

  /* ---- sample document ---- */
  const SAMPLE = [
    '# Markdown Slides',
    '',
    '## How it works',
    '',
    'Paste any markdown, then press **Start**. The document is split into slides automatically.',
    '',
    '- Headings become the slide header',
    '- Headings are indented by their level',
    '- All content under a heading becomes one slide',
    '- Use ← → to change slides and ↑ ↓ or Space to scroll a long slide',
    '- Type a slide number and press Enter to jump straight to it',
    '- On touch devices: swipe ← → and tap to advance',
    '',
    '### Lists',
    '',
    '1. Ordered items work',
    '2. So do nested ones',
    '   - like this',
    '   - and this',
    '3. And back to the top level',
    '',
    '### Code',
    '',
    '```js',
    'function greet(name) {',
    '  return `Hello, ${name}!`;',
    '}',
    '```',
    '',
    '### Tables',
    '',
    '| Feature | Supported |',
    '| :--- | ---: |',
    '| Headings | yes |',
    '| Code blocks | yes |',
    '| Tables | yes |',
    '',
    '### Quotes',
    '',
    '> Simplicity is the soul of efficiency.',
    '> — Austin Freeman',
    '',
    '## Links & images',
    '',
    'You can use [links](https://example.com), `inline code`, **bold**, *italic*, and ~~strikethrough~~.',
    '',
    'Here is an image:',
    '',
    '![Match](https://sysaulab.github.io/match.jpg)',
    '',
    '---',
    '',
    'The end.'
  ].join('\n');

  /* ---- init ---- */
  loadCustomFromStorage();
  buildThemePicker();
  mdInput.value = SAMPLE;
  mdInput.focus();
})();
</script>
