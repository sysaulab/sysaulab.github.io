<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1116">
<title>Backgammon</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d1116;
    color: #e6edf5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 0%, #1b2330 0%, #0d1116 60%);
  }
  .app {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 8px; width: 100%;
  }
  .hud {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 960px; padding: 0 6px;
    min-height: 32px; font-size: 13px;
  }
  .pl { display: flex; align-items: center; gap: 6px; }
  .pl.r { justify-content: flex-end; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.w { background: linear-gradient(#fffaf0, #d8c9a8); box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
  .dot.b { background: linear-gradient(#4a4a55, #16161c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .nm { font-weight: 600; letter-spacing: .02em; }
  .st { color: #7f8ea3; font-variant-numeric: tabular-nums; font-size: 11px; }
  .dice { display: flex; gap: 6px; min-height: 26px; align-items: center; }
  .die {
    width: 24px; height: 24px; border-radius: 6px;
    background: linear-gradient(160deg, #fdf8ee, #d9cbb0);
    display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
    padding: 3px; gap: 1px;
    box-shadow: 0 2px 4px rgba(0,0,0,.5);
    transition: opacity .25s, transform .25s;
  }
  .die.used { opacity: .22; transform: scale(.86); }
  .die i { border-radius: 50%; }
  .die i.on { background: #26262e; }
  .boardWrap { line-height: 0; }
  canvas {
    touch-action: none; display: block; border-radius: 14px;
    box-shadow: 0 12px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
  }
  .controls { display: flex; gap: 10px; align-items: center; }
  .btn {
    border: none; border-radius: 12px; padding: 11px 20px;
    font-size: 15px; font-weight: 600; color: #e6edf5;
    background: #232c39;
    box-shadow: 0 2px 0 rgba(0,0,0,.35);
    transition: transform .08s, background .15s, opacity .15s;
    cursor: pointer; touch-action: manipulation;
    font-family: inherit;
  }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.primary { background: linear-gradient(180deg, #2f7d5f, #22624a); padding: 11px 30px; }
  .btn.primary:disabled { opacity: .3; cursor: default; transform: none; }
  .btn.icon { padding: 11px 13px; font-size: 16px; }
  .msg { font-size: 13px; color: #8fa0b6; height: 18px; letter-spacing: .01em; }

  /* Difficulty segmented control */
  .diffRow {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 0;
    min-height: 32px;
  }
  .diffLabel {
    font-size: 11px; color: #6b7b90; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .diff {
    display: flex; border-radius: 10px; overflow: hidden;
    background: #161d26;
    box-shadow: 0 0 0 1px rgba(255,255,255,.05), inset 0 1px 0 rgba(0,0,0,.4);
  }
  .diffBtn {
    border: none; background: transparent; color: #7f8ea3;
    padding: 7px 15px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: background .18s, color .18s;
    touch-action: manipulation;
    letter-spacing: .02em;
  }
  .diffBtn + .diffBtn { border-left: 1px solid rgba(255,255,255,.04); }
  .diffBtn.active {
    background: linear-gradient(180deg, #2f7d5f, #256149);
    color: #f0faf5;
    text-shadow: 0 1px 0 rgba(0,0,0,.25);
  }
  .diffBtn:not(.active):active { background: rgba(255,255,255,.05); }
</style>

<body>
<div class="app">
  <div class="hud">
    <div class="pl">
      <span class="dot b"></span>
      <span class="nm">CPU</span>
      <span class="st" id="blackStats">167 · 0 off</span>
    </div>
    <div class="dice" id="diceRow"></div>
    <div class="pl r">
      <span class="st" id="whiteStats">167 · 0 off</span>
      <span class="nm">You</span>
      <span class="dot w"></span>
    </div>
  </div>
  <div class="boardWrap"><canvas id="board"></canvas></div>
  <div class="diffRow">
    <span class="diffLabel">CPU</span>
    <div class="diff" id="diffGroup">
      <button class="diffBtn" data-level="easy">Easy</button>
      <button class="diffBtn active" data-level="medium">Medium</button>
      <button class="diffBtn" data-level="hard">Hard</button>
    </div>
  </div>
  <div class="controls">
    <button id="rollBtn" class="btn primary">Roll</button>
    <button id="soundBtn" class="btn icon" aria-label="Toggle sound">🔊</button>
    <button id="newBtn" class="btn">New</button>
  </div>
  <div class="msg" id="msg">Tap Roll to begin</div>
</div>

<script>
"use strict";

/* ============================================================
   Constants & helpers
   ============================================================ */
const WHITE = 0, BLACK = 1;
const HUMAN = WHITE, AI = BLACK;
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ============================================================
   Game logic
   ============================================================ */

function emptyPos() {
  return { board: new Array(24).fill(0), bar: [0, 0], off: [0, 0] };
}

function initialPos() {
  const p = emptyPos();
  // White moves 24 -> 1 (index 23 -> 0). Home = indices 0..5.
  p.board[23] = 2;    // 24-point
  p.board[12] = 5;    // 13-point
  p.board[7]  = 3;    // 8-point
  p.board[5]  = 5;    // 6-point
  // Black moves 1 -> 24 (index 0 -> 23). Home = indices 18..23.
  p.board[0]  = -2;   // 1-point
  p.board[11] = -5;   // 12-point
  p.board[16] = -3;   // 17-point
  p.board[18] = -5;   // 19-point
  return p;
}

function clonePos(p) {
  return { board: p.board.slice(), bar: p.bar.slice(), off: p.off.slice() };
}

function posKey(p) {
  return p.board.join(',') + '|' + p.bar[0] + ',' + p.bar[1] + '|' + p.off[0] + ',' + p.off[1];
}

function canLand(board, idx, player) {
  return player === WHITE ? board[idx] > -2 : board[idx] < 2;
}

function canBearOff(pos, player) {
  if (pos.bar[player] > 0) return false;
  if (player === WHITE) {
    for (let i = 6; i < 24; i++) if (pos.board[i] > 0) return false;
  } else {
    for (let i = 0; i < 18; i++) if (pos.board[i] < 0) return false;
  }
  return true;
}

function higherChecker(board, i, player) {
  const sgn = player === WHITE ? 1 : -1;
  for (let j = i + 1; j < 24; j++) if (board[j] * sgn > 0) return true;
  return false;
}
function lowerChecker(board, i, player) {
  const sgn = player === WHITE ? 1 : -1;
  for (let j = 0; j < i; j++) if (board[j] * sgn > 0) return true;
  return false;
}

/** All single-die moves for `player` in position `pos`. */
function legalMoves(pos, player, die) {
  const out = [];
  const b = pos.board;

  if (pos.bar[player] > 0) {
    const t = player === WHITE ? 24 - die : die - 1;
    if (canLand(b, t, player)) out.push({ from: 'bar', to: t, die });
    return out;
  }

  const bearing = canBearOff(pos, player);

  for (let i = 0; i < 24; i++) {
    const v = b[i];
    if (player === WHITE ? v <= 0 : v >= 0) continue;

    if (player === WHITE) {
      const d = i - die;
      if (d >= 0) {
        if (canLand(b, d, player)) out.push({ from: i, to: d, die });
      } else if (bearing) {
        if (d === -1) out.push({ from: i, to: 'off', die });
        else if (d < -1 && !higherChecker(b, i, WHITE)) out.push({ from: i, to: 'off', die });
      }
    } else {
      const d = i + die;
      if (d <= 23) {
        if (canLand(b, d, player)) out.push({ from: i, to: d, die });
      } else if (bearing) {
        if (d === 24) out.push({ from: i, to: 'off', die });
        else if (d > 24 && !lowerChecker(b, i, BLACK)) out.push({ from: i, to: 'off', die });
      }
    }
  }
  return out;
}

function applyMove(pos, player, mv) {
  const np = clonePos(pos);
  const sgn = player === WHITE ? 1 : -1;

  if (mv.from === 'bar') np.bar[player]--;
  else np.board[mv.from] -= sgn;

  if (mv.to === 'off') {
    np.off[player]++;
  } else {
    const cur = np.board[mv.to];
    if (cur === -sgn) {           // opponent blot -> hit
      np.bar[1 - player]++;
      np.board[mv.to] = 0;
    }
    np.board[mv.to] += sgn;
  }
  return np;
}

function removeOne(arr, v) {
  const a = arr.slice();
  const i = a.indexOf(v);
  if (i >= 0) a.splice(i, 1);
  return a;
}

/* --- max dice usable (for forced-play rules) --- */
let bduMemo = new Map();

function bestDiceUsed(pos, player, dice) {
  return _bdu(pos, player, dice, bduMemo);
}

function _bdu(pos, player, dice, memo) {
  if (!dice.length) return 0;
  const key = posKey(pos) + '#' + player + '#' + dice.slice().sort().join(',');
  const cached = memo.get(key);
  if (cached !== undefined) return cached;

  let best = 0;
  const seen = new Set();
  for (let i = 0; i < dice.length; i++) {
    const d = dice[i];
    if (seen.has(d)) continue;
    seen.add(d);
    const rem = dice.slice(0, i).concat(dice.slice(i + 1));
    for (const mv of legalMoves(pos, player, d)) {
      const np = applyMove(pos, player, mv);
      const r = 1 + _bdu(np, player, rem, memo);
      if (r > best) best = r;
    }
  }
  memo.set(key, best);
  return best;
}

/* ============================================================
   Evaluation functions
   ============================================================ */

function pipCount(pos, player) {
  let p = 0;
  for (let i = 0; i < 24; i++) {
    const v = pos.board[i];
    if (player === WHITE && v > 0) p += v * (i + 1);
    else if (player === BLACK && v < 0) p += (-v) * (24 - i);
  }
  p += pos.bar[player] * 25;
  return p;
}

/* Base evaluation — used by medium difficulty (and as a base for hard) */
function evaluate(pos, me) {
  const opp = 1 - me;
  let s = 0;
  s += (pipCount(pos, opp) - pipCount(pos, me));
  s += pos.bar[opp] * 30;
  s -= pos.bar[me] * 30;
  s += pos.off[me] * 45;
  s -= pos.off[opp] * 45;

  for (let i = 0; i < 24; i++) {
    const v = pos.board[i];
    if (!v) continue;
    const owner = v > 0 ? WHITE : BLACK;
    const c = Math.abs(v);
    if (c === 1) {
      if (owner === me) {
        s -= 6;
        if (me === WHITE && i <= 5) s -= 5;      // blot in opp home
        if (me === BLACK && i >= 18) s -= 5;
        if (me === WHITE && i <= 11) s -= 2;
        if (me === BLACK && i >= 12) s -= 2;
      } else {
        s += 5;
      }
    } else {
      if (owner === me) s += 2 + Math.min(c, 5);
      else s -= 2;
    }
  }
  return s;
}

/* Enhanced evaluation — used by hard difficulty */
function evaluateHard(pos, me) {
  let s = evaluate(pos, me);

  // Count our blots and opponent's direct shots at them
  let myBlots = 0;
  let shots = 0;
  for (let i = 0; i < 24; i++) {
    const v = pos.board[i];
    if (!v) continue;
    const owner = v > 0 ? WHITE : BLACK;
    if (owner !== me || Math.abs(v) !== 1) continue;
    myBlots++;

    if (me === WHITE) {
      // White blot at i — black checkers at i+1..i+6 can hit
      for (let d = 1; d <= 6; d++) {
        const j = i + d;
        if (j < 24 && pos.board[j] < 0) shots += Math.abs(pos.board[j]);
      }
    } else {
      // Black blot at i — white checkers at i-1..i-6 can hit
      for (let d = 1; d <= 6; d++) {
        const j = i - d;
        if (j >= 0 && pos.board[j] > 0) shots += pos.board[j];
      }
    }
  }
  s -= shots * 2.2;
  s -= myBlots * 2;

  // Home board points held (blocking strength)
  let homePts = 0;
  if (me === WHITE) {
    for (let i = 0; i < 6; i++) if (pos.board[i] >= 2) homePts++;
  } else {
    for (let i = 18; i < 24; i++) if (pos.board[i] <= -2) homePts++;
  }
  s += homePts * 4;

  return s;
}

/* ============================================================
   AI search
   ============================================================ */

function aiSearch(pos, player, dice, memo, evalFn) {
  const key = posKey(pos) + '#' + dice.slice().sort().join(',');
  const cached = memo.get(key);
  if (cached) return cached;

  let best = null;

  if (dice.length) {
    const seen = new Set();
    for (let i = 0; i < dice.length; i++) {
      const d = dice[i];
      if (seen.has(d)) continue;
      seen.add(d);
      const rem = dice.slice(0, i).concat(dice.slice(i + 1));
      for (const mv of legalMoves(pos, player, d)) {
        const np = applyMove(pos, player, mv);
        const sub = aiSearch(np, player, rem, memo, evalFn);
        if (!best || sub.score > best.score) {
          best = { score: sub.score, moves: [mv].concat(sub.moves) };
        }
      }
    }
  }

  if (!best) {
    best = {
      score: evalFn(pos, player) - dice.length * 1000 + Math.random() * 0.4,
      moves: []
    };
  }
  memo.set(key, best);
  return best;
}

/* ============================================================
   Difficulty strategies
   ============================================================ */

let difficulty = 'medium';

/**
 * Returns the legal moves that keep the maximum number of dice playable.
 * Ensures that random / greedy strategies still follow the forced-play rule.
 */
function legalMovesRespectingMax(pos, player, rem) {
  const maxTotal = bestDiceUsed(pos, player, rem);
  if (maxTotal === 0) return [];

  const candidates = [];
  const seen = new Set();
  for (const d of rem) {
    if (seen.has(d)) continue;
    seen.add(d);
    for (const m of legalMoves(pos, player, d)) {
      const np = applyMove(pos, player, m);
      const subRem = removeOne(rem, d);
      const subMax = bestDiceUsed(np, player, subRem);
      if (1 + subMax === maxTotal) candidates.push(m);
    }
  }
  return candidates;
}

/* Easy: play a random legal sequence (respects forced-play rule) */
function randomMoveSequence(pos, player, dice) {
  let cur = pos;
  let rem = dice.slice();
  const moves = [];

  while (rem.length) {
    const candidates = legalMovesRespectingMax(cur, player, rem);
    if (!candidates.length) break;
    const mv = candidates[Math.floor(Math.random() * candidates.length)];
    cur = applyMove(cur, player, mv);
    moves.push(mv);
    rem = removeOne(rem, mv.die);
  }
  return { score: 0, moves };
}

/* Medium: greedy per-die, no lookahead. Falls back to random if stuck. */
function greedyMoveSequence(pos, player, dice) {
  let cur = pos;
  let rem = dice.slice();
  const moves = [];

  while (rem.length) {
    const candidates = legalMovesRespectingMax(cur, player, rem);
    if (!candidates.length) break;

    let best = null, bestScore = -Infinity;
    for (const m of candidates) {
      const np = applyMove(cur, player, m);
      // Small tie-break noise so it doesn't always play the same line
      const sc = evaluate(np, player) + Math.random() * 0.8;
      if (sc > bestScore) { bestScore = sc; best = m; }
    }
    cur = applyMove(cur, player, best);
    moves.push(best);
    rem = removeOne(rem, best.die);
  }
  return { score: 0, moves };
}

/* Hard: full lookahead with enhanced evaluation */
function fullSearchMove(pos, player, dice) {
  const memo = new Map();
  return aiSearch(pos, player, dice, memo, evaluateHard);
}

/** Central dispatcher for the AI's turn */
function getAIMove(pos, player, dice) {
  if (difficulty === 'easy') {
    // Easy: mostly random, with a slight chance of a greedy step so it's not
    // completely hopeless — feels more "human" and less robotic.
    if (Math.random() < 0.75) return randomMoveSequence(pos, player, dice);
    return greedyMoveSequence(pos, player, dice);
  }
  if (difficulty === 'medium') {
    // Medium: greedy per die, occasionally falling back to full search
    // so it can sometimes set up a nice second move.
    if (Math.random() < 0.55) return greedyMoveSequence(pos, player, dice);
    return fullSearchMove(pos, player, dice);
  }
  // Hard: always full search with the enhanced evaluation
  return fullSearchMove(pos, player, dice);
}

/* ============================================================
   Audio (subtle, synthesized)
   ============================================================ */
let actx = null, master = null, noiseBuf = null, soundOn = true;

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = 0.45;
  master.connect(actx.destination);

  const len = Math.floor(actx.sampleRate * 0.4);
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
}

function sfxClick(freq, vol, dur) {
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf;
  const bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = freq;
  bp.Q.value = 1.4;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur + 0.03);
}

function sfxThump(freq, vol, dur) {
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.45), t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.03);
}

function sfxTone(freq, vol, dur, type) {
  if (!actx || !soundOn) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  o.type = type || 'sine';
  o.frequency.value = freq;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

function sfxLand() { sfxClick(1750 + Math.random() * 250, 0.14, 0.045); sfxThump(165, 0.18, 0.09); }
function sfxHit()  { sfxClick(2600, 0.18, 0.05); sfxThump(105, 0.26, 0.16); }
function sfxBear() { sfxTone(700, 0.11, 0.16); setTimeout(() => sfxTone(1050, 0.07, 0.22), 55); }
function sfxTick() { sfxClick(2400, 0.06, 0.03); }
function sfxDice() {
  if (!actx || !soundOn) return;
  for (let i = 0; i < 7; i++) {
    setTimeout(() => sfxClick(800 + Math.random() * 1100, 0.075, 0.035), i * 52 + Math.random() * 26);
  }
}
function sfxWin() {
  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => sfxTone(f, 0.12, 0.5), i * 110));
}
function sfxLose() {
  [400, 330, 262].forEach((f, i) => setTimeout(() => sfxTone(f, 0.1, 0.5, 'triangle'), i * 140));
}

/* ============================================================
   Canvas / layout
   ============================================================ */
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, dpr = 1;
let boardX, boardY, boardW, boardH;
let playX, playY, playW, playH;
let barW, pointW, pointLen, R;

const PAD = 6;

function layout() {
  boardX = PAD; boardY = PAD;
  boardW = W - PAD * 2;
  boardH = H - PAD * 2;

  const inset = Math.max(4, Math.min(boardW, boardH) * 0.024);
  playX = boardX + inset;
  playY = boardY + inset;
  playW = boardW - inset * 2;
  playH = boardH - inset * 2;

  barW = playW * 0.075;
  pointW = (playW - barW) / 12;
  pointLen = playH * 0.42;
  R = Math.min(pointW * 0.44, pointLen / 9);
}

function resize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const availW = Math.min(vw - 16, 940);
  const availH = vh - 210;

  let w = availW;
  let h = w / 1.55;
  if (h > availH) {
    h = Math.max(150, availH);
    w = h * 1.55;
  }

  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  W = w; H = h;
  layout();
}

function pointX(i) {
  const col = i < 12 ? 11 - i : i - 12;
  const x0 = col < 6
    ? playX + col * pointW
    : playX + 6 * pointW + barW + (col - 6) * pointW;
  return x0 + pointW / 2;
}

function isTop(i) { return i >= 12; }

function stackSpacing(count) {
  return count > 1 ? Math.min(2 * R * 0.98, (pointLen - 2 * R) / (count - 1)) : 0;
}

function checkerYAt(i, index, count) {
  const sp = stackSpacing(count);
  return isTop(i)
    ? playY + R + index * sp
    : playY + playH - R - index * sp;
}

function stackPos(pos, i) {
  const v = pos.board[i];
  const c = Math.abs(v);
  return { x: pointX(i), y: checkerYAt(i, c - 1, c) };
}

function landPos(pos, i, player) {
  const v = pos.board[i];
  let index = 0;
  if (v !== 0) {
    const owner = v > 0 ? WHITE : BLACK;
    index = (owner === player) ? Math.abs(v) : 0;
  }
  const c = index + 1;
  return { x: pointX(i), y: checkerYAt(i, index, c) };
}

function barPos(player, idx) {
  const cx = playX + 6 * pointW + barW / 2;
  const cy = player === WHITE
    ? playY + playH - R - idx * (2 * R * 0.9)
    : playY + R + idx * (2 * R * 0.9);
  return { x: cx, y: cy };
}

/* ============================================================
   Drawing
   ============================================================ */
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawChecker(cx, cy, r, player, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;

  // drop shadow
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.13, r * 0.97, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.fill();

  // body
  const g = ctx.createRadialGradient(cx - r * 0.34, cy - r * 0.4, r * 0.08, cx, cy, r);
  if (player === WHITE) {
    g.addColorStop(0, '#fffcf3');
    g.addColorStop(0.55, '#f0e3c9');
    g.addColorStop(1, '#c3ad85');
  } else {
    g.addColorStop(0, '#606070');
    g.addColorStop(0.55, '#33333d');
    g.addColorStop(1, '#111117');
  }
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  // rim
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.97, 0, Math.PI * 2);
  ctx.strokeStyle = player === WHITE ? 'rgba(120,95,58,0.55)' : 'rgba(0,0,0,0.65)';
  ctx.lineWidth = Math.max(1, r * 0.11);
  ctx.stroke();

  // inner ring
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
  ctx.strokeStyle = player === WHITE ? 'rgba(150,120,80,0.32)' : 'rgba(130,130,155,0.26)';
  ctx.lineWidth = Math.max(1, r * 0.075);
  ctx.stroke();

  // gloss
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.22, cy - r * 0.34, r * 0.42, r * 0.26, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = player === WHITE ? 'rgba(255,255,255,0.42)' : 'rgba(255,255,255,0.13)';
  ctx.fill();

  ctx.restore();
}

function drawBoard() {
  const rad = Math.max(6, Math.min(boardW, boardH) * 0.035);

  // wooden frame
  roundRect(boardX, boardY, boardW, boardH, rad);
  const fg = ctx.createLinearGradient(0, boardY, 0, boardY + boardH);
  fg.addColorStop(0, '#8a5f3c');
  fg.addColorStop(0.45, '#6a4425');
  fg.addColorStop(1, '#452b16');
  ctx.fillStyle = fg;
  ctx.fill();

  roundRect(boardX + 0.75, boardY + 0.75, boardW - 1.5, boardH - 1.5, rad);
  ctx.strokeStyle = 'rgba(255,215,170,0.13)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // playing surface
  roundRect(playX, playY, playW, playH, rad * 0.45);
  const sg = ctx.createLinearGradient(0, playY, 0, playY + playH);
  sg.addColorStop(0, '#1b4d3e');
  sg.addColorStop(0.5, '#174439');
  sg.addColorStop(1, '#10352c');
  ctx.fillStyle = sg;
  ctx.fill();

  // points
  for (let i = 0; i < 24; i++) drawTriangle(i);

  // bar
  const bx = playX + 6 * pointW;
  const bg = ctx.createLinearGradient(bx, 0, bx + barW, 0);
  bg.addColorStop(0, 'rgba(0,0,0,0.30)');
  bg.addColorStop(0.5, 'rgba(0,0,0,0.52)');
  bg.addColorStop(1, 'rgba(0,0,0,0.30)');
  ctx.fillStyle = bg;
  ctx.fillRect(bx, playY, barW, playH);

  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bx + 0.5, playY); ctx.lineTo(bx + 0.5, playY + playH);
  ctx.moveTo(bx + barW - 0.5, playY); ctx.lineTo(bx + barW - 0.5, playY + playH);
  ctx.stroke();
}

function drawTriangle(i) {
  const col = i < 12 ? 11 - i : i - 12;
  const light = col % 2 === 0;
  const cx = pointX(i);
  const x0 = cx - pointW / 2 + 1.5;
  const x1 = cx + pointW / 2 - 1.5;
  const top = isTop(i);
  const baseY = top ? playY : playY + playH;
  const apexY = top ? playY + pointLen : playY + playH - pointLen;

  ctx.beginPath();
  ctx.moveTo(x0, baseY);
  ctx.lineTo(x1, baseY);
  ctx.lineTo(cx, apexY);
  ctx.closePath();

  const g = ctx.createLinearGradient(0, baseY, 0, apexY);
  if (light) {
    g.addColorStop(0, '#eaddbe');
    g.addColorStop(1, '#bfab84');
  } else {
    g.addColorStop(0, '#a9402f');
    g.addColorStop(1, '#742819');
  }
  ctx.fillStyle = g;
  ctx.fill();
}

function drawStack(i, count, player, spacingCount) {
  const n = spacingCount || count;
  const cx = pointX(i);
  for (let k = 0; k < count; k++) {
    drawChecker(cx, checkerYAt(i, k, n), R, player);
  }
}

function drawGlowPoint(i, alpha) {
  const x0 = pointX(i) - pointW / 2 + 2;
  const top = isTop(i);
  const y0 = top ? playY + 2 : playY + playH - pointLen + 2;

  roundRect(x0, y0, pointW - 4, pointLen - 4, Math.min(8, pointW * 0.3));
  ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
  ctx.fill();
}

/* ============================================================
   State
   ============================================================ */
const G = {
  pos: null,
  turn: HUMAN,
  dice: [],
  roll: [],
  selected: null,
  legal: [],
  phase: 'idle',
  busy: false
};

let anim = null;

/* ============================================================
   Rendering loop
   ============================================================ */
let lastTs = 0;

function loop(ts) {
  const dt = lastTs ? Math.min(50, ts - lastTs) : 16;
  lastTs = ts;

  if (anim) {
    anim.t += dt / anim.dur;
    if (anim.t >= 1) {
      anim.t = 1;
      const cb = anim.onDone;
      anim = null;
      if (cb) cb();
    }
  }

  draw();
  requestAnimationFrame(loop);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBoard();

  const pos = G.pos;
  if (!pos) return;

  if (!anim && G.phase === 'moving' && G.turn === HUMAN) {
    const srcs = new Set();
    for (const m of G.legal) srcs.add(m.from);

    for (const s of srcs) {
      if (s === 'bar') continue;
      drawGlowPoint(s, s === G.selected ? 0.20 : 0.09);
    }

    if (srcs.has('bar')) {
      const bx = playX + 6 * pointW;
      const on = G.selected === 'bar';
      ctx.fillStyle = 'rgba(255,255,255,' + (on ? 0.18 : 0.08) + ')';
      ctx.fillRect(bx, playY, barW, playH);
    }

    if (G.selected !== null) {
      const dests = new Set();
      for (const m of G.legal) if (m.from === G.selected) dests.add(m.to);

      for (const d of dests) {
        let p;
        if (d === 'off') {
          p = { x: playX + playW + R * 1.4, y: playY + playH - R * 1.6 };
        } else {
          p = landPos(pos, d, HUMAN);
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, R * 0.92, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,240,170,0.16)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,240,170,0.85)';
        ctx.lineWidth = Math.max(2, R * 0.22);
        ctx.stroke();
      }
    }
  }

  for (let i = 0; i < 24; i++) {
    const v = pos.board[i];
    if (!v) continue;
    const player = v > 0 ? WHITE : BLACK;
    let c = Math.abs(v);
    if (anim && anim.mv.from === i && anim.player === player) c--;
    if (c > 0) drawStack(i, c, player, Math.abs(v));
  }

  for (const p of [WHITE, BLACK]) {
    let c = pos.bar[p];
    if (anim && anim.mv.from === 'bar' && anim.player === p) c--;
    for (let k = 0; k < c; k++) {
      const pt = barPos(p, k);
      drawChecker(pt.x, pt.y, R, p);
    }
  }

  if (anim) {
    const e = anim.t < 0.5
      ? 2 * anim.t * anim.t
      : 1 - Math.pow(-2 * anim.t + 2, 2) / 2;
    const x = anim.from.x + (anim.to.x - anim.from.x) * e;
    const y = anim.from.y + (anim.to.y - anim.from.y) * e;
    let alpha = 1;
    if (anim.mv.to === 'off') {
      alpha = anim.t < 0.6 ? 1 : Math.max(0, 1 - (anim.t - 0.6) / 0.4);
    }
    const lift = Math.sin(Math.PI * anim.t) * R * 0.9;
    drawChecker(x, y - lift, R, anim.player, alpha);
  }
}

/* ============================================================
   Animation helper
   ============================================================ */
function animateMove(player, mv, posBefore) {
  return new Promise(resolve => {
    const from = mv.from === 'bar'
      ? barPos(player, 0)
      : stackPos(posBefore, mv.from);

    let to;
    if (mv.to === 'off') {
      to = { x: playX + playW + R * 2.2, y: from.y };
    } else {
      to = landPos(posBefore, mv.to, player);
    }

    const dist = Math.hypot(to.x - from.x, to.y - from.y);
    const dur = 170 + Math.min(200, dist * 0.4);

    anim = {
      from, to, t: 0, dur, player, mv, posBefore,
      onDone: resolve
    };
  });
}

/* ============================================================
   UI helpers
   ============================================================ */
const diceRow = document.getElementById('diceRow');
const msgEl = document.getElementById('msg');
const rollBtn = document.getElementById('rollBtn');
const soundBtn = document.getElementById('soundBtn');
const newBtn = document.getElementById('newBtn');

const PIP_MAP = {
  1: [4],
  2: [0, 8],
  3: [0, 4, 8],
  4: [0, 2, 6, 8],
  5: [0, 2, 4, 6, 8],
  6: [0, 2, 3, 5, 6, 8]
};

function renderDice() {
  diceRow.innerHTML = '';
  for (const d of G.roll) {
    const el = document.createElement('div');
    el.className = 'die' + (d.used ? ' used' : '');
    const on = PIP_MAP[d.v] || [];
    for (let k = 0; k < 9; k++) {
      const i = document.createElement('i');
      if (on.indexOf(k) >= 0) i.className = 'on';
      el.appendChild(i);
    }
    diceRow.appendChild(el);
  }
}

function updateStats() {
  if (!G.pos) return;
  document.getElementById('whiteStats').textContent =
    pipCount(G.pos, WHITE) + ' · ' + G.pos.off[WHITE] + ' off';
  document.getElementById('blackStats').textContent =
    pipCount(G.pos, BLACK) + ' · ' + G.pos.off[BLACK] + ' off';
}

function setMsg(t) { msgEl.textContent = t; }

function updateControls() {
  rollBtn.disabled = !(G.phase === 'roll' && G.turn === HUMAN);
}

/* ============================================================
   Turn flow
   ============================================================ */
function consumeDie(v) {
  const i = G.dice.indexOf(v);
  if (i >= 0) G.dice.splice(i, 1);
  for (let k = 0; k < G.roll.length; k++) {
    if (G.roll[k].v === v && !G.roll[k].used) {
      G.roll[k].used = true;
      break;
    }
  }
  renderDice();
}

async function performMove(player, mv) {
  const before = G.pos;
  await animateMove(player, mv, before);

  G.pos = applyMove(before, player, mv);
  consumeDie(mv.die);
  updateStats();

  if (mv.to === 'off') {
    sfxBear();
  } else {
    const v = before.board[mv.to];
    const isHit = (player === WHITE && v === -1) || (player === BLACK && v === 1);
    sfxLand();
    if (isHit) setTimeout(sfxHit, 75);
  }
}

function computeLegal() {
  if (!G.dice.length) return [];
  const cur = bestDiceUsed(G.pos, G.turn, G.dice);
  if (cur === 0) return [];

  const seen = new Set();
  const candidates = [];
  for (const d of G.dice) {
    if (seen.has(d)) continue;
    seen.add(d);
    for (const m of legalMoves(G.pos, G.turn, d)) candidates.push(m);
  }

  let filtered = candidates.filter(m => {
    const rem = removeOne(G.dice, m.die);
    const np = applyMove(G.pos, G.turn, m);
    return 1 + bestDiceUsed(np, G.turn, rem) === cur;
  });

  if (cur === 1 && G.dice.length === 2 && G.dice[0] !== G.dice[1]) {
    const hi = Math.max(G.dice[0], G.dice[1]);
    const only = filtered.filter(m => m.die === hi);
    if (only.length) filtered = only;
  }
  return filtered;
}

function autoSelect() {
  const srcs = [];
  const seen = new Set();
  for (const m of G.legal) {
    if (!seen.has(m.from)) { seen.add(m.from); srcs.push(m.from); }
  }
  G.selected = srcs.length === 1 ? srcs[0] : null;
}

/* --- human --- */
function startHumanTurn() {
  G.phase = 'roll';
  G.selected = null;
  G.legal = [];
  setMsg('Your turn — tap Roll');
  updateControls();
}

async function humanRoll() {
  if (G.phase !== 'roll' || G.turn !== HUMAN) return;
  initAudio();

  G.phase = 'rolling';
  updateControls();

  bduMemo = new Map();
  const d1 = 1 + Math.floor(Math.random() * 6);
  const d2 = 1 + Math.floor(Math.random() * 6);
  const vals = d1 === d2 ? [d1, d1, d1, d1] : [d1, d2];
  G.dice = vals.slice();
  G.roll = vals.map(v => ({ v, used: false }));
  renderDice();
  sfxDice();

  await wait(420);

  if (bestDiceUsed(G.pos, HUMAN, G.dice) === 0) {
    setMsg('No legal moves');
    await wait(850);
    endTurn();
    return;
  }

  G.phase = 'moving';
  G.legal = computeLegal();
  autoSelect();
  setMsg(G.legal.length ? 'Tap a checker, then a target' : 'No moves');
  updateControls();

  if (!G.legal.length) {
    await wait(700);
    endTurn();
  }
}

async function doHumanMove(mv) {
  G.busy = true;
  G.selected = null;

  await performMove(HUMAN, mv);

  if (G.pos.off[WHITE] >= 15 || G.pos.off[BLACK] >= 15) {
    G.busy = false;
    endTurn();
    return;
  }

  G.legal = computeLegal();
  if (!G.legal.length) {
    G.busy = false;
    await wait(250);
    endTurn();
    return;
  }
  autoSelect();
  G.busy = false;
}

/* --- AI --- */
async function aiTurn() {
  G.phase = 'ai';
  G.selected = null;
  G.legal = [];
  updateControls();
  setMsg('CPU is thinking…');
  await wait(320);

  bduMemo = new Map();
  const d1 = 1 + Math.floor(Math.random() * 6);
  const d2 = 1 + Math.floor(Math.random() * 6);
  const vals = d1 === d2 ? [d1, d1, d1, d1] : [d1, d2];
  G.dice = vals.slice();
  G.roll = vals.map(v => ({ v, used: false }));
  renderDice();
  sfxDice();
  await wait(480);

  const result = getAIMove(G.pos, AI, G.dice);

  if (!result.moves.length) {
    setMsg('CPU has no moves');
    await wait(750);
    endTurn();
    return;
  }

  setMsg('CPU moves');

  for (const mv of result.moves) {
    if (G.pos.off[WHITE] >= 15 || G.pos.off[BLACK] >= 15) break;
    await performMove(AI, mv);
    await wait(90);
  }

  await wait(260);
  endTurn();
}

/* --- turn end --- */
function endTurn() {
  G.dice = [];
  G.selected = null;
  G.legal = [];
  renderDice();

  if (G.pos.off[WHITE] >= 15) {
    G.phase = 'over';
    setMsg('You win! 🎉');
    sfxWin();
    updateControls();
    return;
  }
  if (G.pos.off[BLACK] >= 15) {
    G.phase = 'over';
    setMsg('CPU wins.');
    sfxLose();
    updateControls();
    return;
  }

  G.turn = 1 - G.turn;
  if (G.turn === AI) {
    aiTurn();
  } else {
    startHumanTurn();
  }
}

/* ============================================================
   Input
   ============================================================ */
function hitTest(x, y) {
  if (x < boardX || x > boardX + boardW || y < boardY || y > boardY + boardH) return null;

  let rel = x - playX;
  if (rel < 0) rel = 0;
  if (rel > playW - 0.01) rel = playW - 0.01;

  const leftW = 6 * pointW;
  const top = y < playY + playH / 2;

  if (rel < leftW) {
    const col = Math.min(5, Math.floor(rel / pointW));
    return top ? 12 + col : 11 - col;
  }
  if (rel < leftW + barW) return 'bar';

  const col = Math.min(11, Math.floor((rel - leftW - barW) / pointW) + 6);
  return top ? 12 + col : 11 - col;
}

function onTap(clientX, clientY) {
  if (G.busy || G.phase !== 'moving' || G.turn !== HUMAN) return;

  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  const y = (clientY - rect.top) * (H / rect.height);

  const hit = hitTest(x, y);

  if (hit === null) {
    G.selected = null;
    return;
  }

  if (G.selected !== null) {
    const mv = G.legal.find(m => m.from === G.selected && m.to === hit);
    if (mv) { doHumanMove(mv); return; }
  }

  const isSource = G.legal.some(m => m.from === hit);
  if (isSource) {
    G.selected = (G.selected === hit) ? null : hit;
    if (G.selected !== null) sfxTick();
    return;
  }

  G.selected = null;
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  onTap(e.clientX, e.clientY);
}, { passive: false });

canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ============================================================
   Buttons
   ============================================================ */
rollBtn.addEventListener('click', () => {
  initAudio();
  humanRoll();
});

newBtn.addEventListener('click', () => {
  initAudio();
  newGame();
});

soundBtn.addEventListener('click', () => {
  initAudio();
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) sfxTick();
});

/* --- difficulty selector --- */
const DIFF_LABEL = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };

document.querySelectorAll('.diffBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    initAudio();
    const level = btn.dataset.level;
    if (level === difficulty) {
      sfxTick();
      return;
    }
    difficulty = level;
    document.querySelectorAll('.diffBtn').forEach(b => {
      b.classList.toggle('active', b.dataset.level === level);
    });
    sfxTick();
    // Only replace the status message if we're not mid-move
    if (G.phase !== 'moving' && G.phase !== 'ai' && G.phase !== 'rolling') {
      const prefix = G.phase === 'over' ? '' : 'Your turn — ';
      setMsg(prefix + 'CPU: ' + DIFF_LABEL[level]);
    }
  });
});

/* ============================================================
   New game / boot
   ============================================================ */
function newGame() {
  anim = null;
  G.pos = initialPos();
  G.turn = HUMAN;
  G.dice = [];
  G.roll = [];
  G.selected = null;
  G.legal = [];
  G.phase = 'roll';
  G.busy = false;
  bduMemo = new Map();

  renderDice();
  updateStats();
  setMsg('Your turn — tap Roll');
  updateControls();
}

window.addEventListener('resize', () => { resize(); });
window.addEventListener('orientationchange', () => { setTimeout(resize, 180); });

resize();
newGame();
requestAnimationFrame(loop);
</script>
