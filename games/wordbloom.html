<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0715">
<title>Word Bloom</title>
<style>
  :root{
    --bg1:#1a0f2e;
    --bg2:#0b0715;
    --panel:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --text:#f0e9ff;
    --muted:#9a8dc0;
    --gold:#ffc857;
    --rose:#ff6b9d;
    --mint:#5ee7c4;
    --violet:#a78bfa;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(circle at 50% -5%, #2a1a4d 0%, transparent 55%),
      radial-gradient(circle at 100% 100%, #1b0f33 0%, transparent 50%),
      #0b0715;
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
  }
  .app{
    max-width:520px; margin:0 auto;
    padding:12px 14px calc(16px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px;
    min-height:100vh;
  }
  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding-top:env(safe-area-inset-top);
  }
  .title{
    font-size:21px; font-weight:800; letter-spacing:.01em;
    background:linear-gradient(90deg,#ffc857,#ff6b9d 55%,#a78bfa);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .badge{
    font-size:12px; font-weight:800; letter-spacing:.07em;
    padding:6px 12px; border-radius:999px;
    background:var(--panel); border:1px solid var(--line);
    color:var(--gold); white-space:nowrap;
  }

  /* ---------- slots ---------- */
  .slots{
    display:flex; flex-direction:column; gap:5px;
    padding:10px 10px 12px;
    border-radius:16px;
    background:var(--panel);
    border:1px solid var(--line);
    min-height:78px;
  }
  .row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .rowlabel{
    font-size:10.5px; font-weight:800; color:var(--muted);
    width:12px; text-align:center; flex:0 0 12px;
    letter-spacing:.05em;
  }
  .slot{
    height:26px; padding:0 8px;
    display:flex; align-items:center; justify-content:center;
    border-radius:8px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.07);
    font-size:12px; font-weight:800; letter-spacing:.1em;
    color:transparent;
    transition:background .22s ease, color .22s ease, border-color .22s ease, transform .22s ease;
    white-space:nowrap;
  }
  .slot.revealed{ color:var(--gold); border-color:rgba(255,200,87,.35); letter-spacing:.06em; }
  .slot.found{
    color:#160d28; border-color:transparent;
    background:linear-gradient(135deg,#ffc857,#ff9f45);
    letter-spacing:.06em;
    animation:pop .34s cubic-bezier(.2,1.5,.4,1);
  }
  .slot.found.pink{ background:linear-gradient(135deg,#ff6b9d,#c77dff); }
  .slot.found.mint{ background:linear-gradient(135deg,#5ee7c4,#4dd4ac); }
  .slot.found.violet{ background:linear-gradient(135deg,#a78bfa,#7c5cf5); }
  @keyframes pop{
    0%{ transform:scale(.55); opacity:.3 }
    60%{ transform:scale(1.12) }
    100%{ transform:scale(1) }
  }

  /* ---------- wheel ---------- */
  .wheel-wrap{
    position:relative;
    width:100%; aspect-ratio:1/1;
    max-height:56vh;
    margin:0 auto;
    touch-action:none;
  }
  #trail{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; overflow:visible;
  }
  #trail polyline{
    fill:none; stroke:url(#trailGrad);
    stroke-width:5; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 0 6px rgba(255,200,87,.75));
    opacity:.95;
  }
  .ring{
    position:absolute; inset:12%;
    border-radius:50%;
    border:1px dashed rgba(255,255,255,.07);
    pointer-events:none;
  }
  .letter{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    font-weight:800;
    color:#e9e0ff;
    background:linear-gradient(160deg,#2a1f4a,#1c1436);
    border:1.5px solid rgba(255,255,255,.1);
    box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    transform:translate(-50%,-50%) scale(1);
    transition:transform .18s cubic-bezier(.3,1.4,.5,1),
               background .18s ease, color .18s ease,
               border-color .18s ease, box-shadow .18s ease,
               opacity .2s ease;
    will-change:transform,opacity;
    cursor:pointer;
  }
  .letter.on{
    background:linear-gradient(160deg,#ffc857,#ff9f45);
    color:#1a0f2e; border-color:#ffe9b0;
    transform:translate(-50%,-50%) scale(1.14);
    box-shadow:0 0 26px rgba(255,200,87,.75);
  }
  .letter.hintflash{
    background:linear-gradient(160deg,#5ee7c4,#4dd4ac);
    color:#0b0715; border-color:#c9fff0;
    transform:translate(-50%,-50%) scale(1.16);
    box-shadow:0 0 26px rgba(94,231,196,.8);
  }
  .letter.dim{ opacity:.4; }

  .center-word{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(16px,5.2vw,24px);
    font-weight:800; letter-spacing:.14em;
    color:var(--gold);
    text-shadow:0 0 18px rgba(255,200,87,.55);
    pointer-events:none;
    white-space:nowrap;
    transition:color .15s ease, text-shadow .15s ease;
  }
  .center-word.bad{ color:#ff6b7d; text-shadow:0 0 18px rgba(255,107,125,.7); }

  /* ---------- controls ---------- */
  .controls{ display:flex; gap:9px; }
  button{
    flex:1;
    padding:13px 8px;
    border-radius:14px;
    background:rgba(255,255,255,.07);
    border:1px solid var(--line);
    color:var(--text);
    font-family:inherit; font-size:14px; font-weight:800;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{ transform:scale(.95); background:rgba(255,255,255,.15); }
  #hintBtn{ background:rgba(255,200,87,.13); border-color:rgba(255,200,87,.28); color:#ffd98a; }
  #newBtn{ background:rgba(167,139,250,.14); border-color:rgba(167,139,250,.28); color:#c9b8ff; }

  /* ---------- overlay ---------- */
  .overlay{
    position:fixed; inset:0; z-index:30;
    display:flex; align-items:center; justify-content:center;
    background:rgba(11,7,21,.85);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    opacity:0; pointer-events:none; transition:opacity .32s ease;
    padding:24px;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .card{
    width:100%; max-width:320px;
    background:linear-gradient(160deg,#241a44,#150e2b);
    border:1px solid rgba(255,255,255,.11);
    border-radius:22px;
    padding:26px 22px;
    text-align:center;
    box-shadow:0 26px 70px rgba(0,0,0,.7);
    transform:translateY(14px) scale(.95);
    transition:transform .38s cubic-bezier(.2,1.4,.5,1);
  }
  .overlay.show .card{ transform:translateY(0) scale(1); }
  .emoji{ font-size:46px; line-height:1; }
  .card h2{
    margin:10px 0 6px; font-size:23px;
    background:linear-gradient(90deg,#ffc857,#ff6b9d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card p{ margin:0 0 18px; font-size:13.5px; color:var(--muted); line-height:1.55; }
  .card button{
    width:100%;
    background:linear-gradient(90deg,#ffc857,#ff9f45);
    color:#1a0f2e; border:none;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="title">Word Bloom</div>
    <span class="badge" id="progressBadge">0 / 0</span>
  </header>

  <div class="slots" id="slots"></div>

  <div class="wheel-wrap" id="wheelWrap">
    <svg id="trail" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffc857"/>
          <stop offset="55%" stop-color="#ff6b9d"/>
          <stop offset="100%" stop-color="#a78bfa"/>
        </linearGradient>
      </defs>
      <polyline id="trailLine" points=""/>
    </svg>
    <div class="ring"></div>
    <div class="center-word" id="centerWord"></div>
  </div>

  <div class="controls">
    <button id="shuffleBtn">🔀 Shuffle</button>
    <button id="hintBtn">💡 Hint</button>
    <button id="newBtn">✨ New</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="emoji">🌸</div>
    <h2>Bloom Complete!</h2>
    <p id="winStats"></p>
    <button id="nextBtn">Play Again</button>
  </div>
</div>

const DICT = (function(){
  const seen = Object.create(null);
  const out = [];
  const raw = DICT_TEXT.split(/\s+/);
  for (let i = 0; i < raw.length; i++){
    const w = raw[i];
    if (!w) continue;
    if (w.length < 3 || w.length > 7) continue;
    if (!/^[A-Z]+$/.test(w)) continue;
    if (seen[w]) continue;
    seen[w] = 1;
    out.push(w);
  }
  return out;
})();

/* =========================================================
   PUZZLE GENERATION
   ========================================================= */
function countLetters(word){
  const c = Object.create(null);
  for (let i = 0; i < word.length; i++){
    const ch = word[i];
    c[ch] = (c[ch] || 0) + 1;
  }
  return c;
}

function canForm(word, counts){
  const need = Object.create(null);
  for (let i = 0; i < word.length; i++){
    const ch = word[i];
    const n = (need[ch] || 0) + 1;
    if (n > (counts[ch] || 0)) return false;
    need[ch] = n;
  }
  return true;
}

/* Ideal word-count window per puzzle */
const MIN_IDEAL = 12;
const MAX_IDEAL = 30;

function buildPuzzle(){
  let best = null;
  let bestScore = -Infinity;

  for (let attempt = 0; attempt < 120; attempt++){
    const pangram = PANGRAMS[(Math.random() * PANGRAMS.length) | 0];
    const counts = countLetters(pangram);

    const found = [];
    for (let i = 0; i < DICT.length; i++){
      const w = DICT[i];
      if (w.length > pangram.length) continue;
      if (canForm(w, counts)) found.push(w);
    }
    if (found.indexOf(pangram) === -1) found.push(pangram);

    if (found.length < 11) continue;

    if (found.length >= MIN_IDEAL && found.length <= MAX_IDEAL){
      return { pangram: pangram, letters: pangram.split(''), words: found };
    }

    // fallback scoring: prefer being close to the ideal window
    let score;
    if (found.length < MIN_IDEAL) score = found.length - MIN_IDEAL;       // negative
    else score = -(found.length - MAX_IDEAL) * 2;                          // penalty for too many
    if (score > bestScore){
      bestScore = score;
      best = { pangram: pangram, letters: pangram.split(''), words: found };
    }
  }
  return best;
}

let actx = null;
function ac(){
  if (!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, delay){
  const c = ac(); if (!c) return;
  dur = dur || 0.09; type = type || 'sine'; vol = vol || 0.11; delay = delay || 0;
  const t = c.currentTime + delay;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

/* =========================================================
   WHEEL LAYOUT — fully dynamic for any letter count
   ========================================================= */
function layoutWheel(){
  const w = wheelWrap.clientWidth;
  const h = wheelWrap.clientHeight;
  if (!w || !h) return;

  const n = tileEls.length;
  if (!n) return;

  const size = Math.min(w, h);
  const cx = w / 2, cy = h / 2;

  /* radius & tile size scale slightly with how many letters there are */
  const R = size * (n >= 8 ? 0.36 : n <= 5 ? 0.30 : 0.345);
  const tileSize = size * (n >= 8 ? 0.175 : n <= 5 ? 0.215 : 0.195);

  const step = (Math.PI * 2) / n;

  tilePos = [];
  for (let i = 0; i < n; i++){
    const ang = -Math.PI / 2 + i * step;   // start at top
    const x = cx + R * Math.cos(ang);
    const y = cy + R * Math.sin(ang);
    tilePos.push({ x: x, y: y });

    const el = tileEls[i];
    if (el){
      el.style.width  = tileSize + 'px';
      el.style.height = tileSize + 'px';
      el.style.fontSize = (tileSize * 0.42) + 'px';
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
    }
  }

  trailSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  drawTrail();
  centerWord.style.fontSize = Math.max(16, size * 0.072) + 'px';
}

function drawTrail(){
  if (current.length < 2){ trailLine.setAttribute('points', ''); return; }
  const pts = current.map(function(i){
    return tilePos[i].x.toFixed(1) + ',' + tilePos[i].y.toFixed(1);
  }).join(' ');
  trailLine.setAttribute('points', pts);
}

/* =========================================================
   RENDER WHEEL
   ========================================================= */
function buildWheelTiles(){
  for (let i = 0; i < tileEls.length; i++){
    if (tileEls[i] && tileEls[i].parentNode) tileEls[i].parentNode.removeChild(tileEls[i]);
  }
  tileEls = [];
  for (let i = 0; i < letters.length; i++){
    const el = document.createElement('div');
    el.className = 'letter';
    el.textContent = letters[i];
    el.dataset.idx = i;
    wheelWrap.appendChild(el);
    tileEls.push(el);
  }
}

function shuffleLetters(){
  const arr = letters.slice();
  for (let i = arr.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  letters = arr;
  for (let i = 0; i < tileEls.length; i++) tileEls[i].textContent = letters[i];
}

/* =========================================================
   RENDER SLOTS
   ========================================================= */
const GRADIENTS = ['', 'pink', 'mint', 'violet'];

function buildSlots(words){
  slotsEl.innerHTML = '';
  slotsByLen = {};
  slotIndex = {};

  const groups = {};
  for (let i = 0; i < words.length; i++){
    const w = words[i];
    if (!groups[w.length]) groups[w.length] = [];
    groups[w.length].push(w);
  }

  const lengths = Object.keys(groups).map(Number).sort(function(a,b){ return a - b; });

  for (let li = 0; li < lengths.length; li++){
    const len = lengths[li];
    const list = groups[len].slice();
    for (let i = list.length - 1; i > 0; i--){
      const j = (Math.random() * (i + 1)) | 0;
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }

    const row = document.createElement('div');
    row.className = 'row';

    const lab = document.createElement('div');
    lab.className = 'rowlabel';
    lab.textContent = len;
    row.appendChild(lab);

    slotsByLen[len] = [];
    for (let i = 0; i < list.length; i++){
      const w = list[i];
      const el = document.createElement('div');
      el.className = 'slot';
      el.textContent = w;
      el.style.minWidth = (len * 8 + 14) + 'px';
      el.dataset.word = w;
      row.appendChild(el);

      const slot = {
        word: w, el: el, found: false, revealed: false,
        grad: GRADIENTS[(Math.random()*GRADIENTS.length)|0]
      };
      slotsByLen[len].push(slot);
      slotIndex[w] = slot;
    }
    slotsEl.appendChild(row);
  }
}

function updateProgress(){
  progressEl.textContent = foundWords + ' / ' + totalWords;
}

/* =========================================================
   SELECTION
   ========================================================= */
function renderSelection(playSound){
  for (let i = 0; i < tileEls.length; i++) tileEls[i].classList.remove('on');
  for (let i = 0; i < current.length; i++) tileEls[current[i]].classList.add('on');

  const str = current.map(function(i){ return letters[i]; }).join('');
  centerWord.textContent = str;
  centerWord.classList.remove('bad');
  drawTrail();

  if (playSound && current.length) sfx.pick(current.length - 1);
}

function clearSelection(){
  for (let i = 0; i < tileEls.length; i++) tileEls[i].classList.remove('on');
  current = [];
  centerWord.textContent = '';
  centerWord.classList.remove('bad');
  trailLine.setAttribute('points', '');
}

function clearHintFlash(){
  if (hintTimer){ clearTimeout(hintTimer); hintTimer = null; }
  if (hintDimOn){
    for (let i = 0; i < tileEls.length; i++){
      tileEls[i].classList.remove('dim');
      tileEls[i].classList.remove('hintflash');
    }
    hintDimOn = false;
  }
}

/* =========================================================
   POINTER
   ========================================================= */
function nearestTile(x, y){
  if (!tileEls.length) return -1;
  let best = -1, bestD = Infinity;
  const threshold = tileEls[0].offsetWidth * 0.62;
  for (let i = 0; i < tilePos.length; i++){
    const dx = x - tilePos[i].x;
    const dy = y - tilePos[i].y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < bestD){ bestD = d; best = i; }
  }
  return bestD <= threshold ? best : -1;
}

function localPoint(e){
  const r = wheelWrap.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

wheelWrap.addEventListener('pointerdown', function(e){
  if (solved) return;
  e.preventDefault();
  ac();
  clearHintFlash();

  const p = localPoint(e);
  const idx = nearestTile(p.x, p.y);
  if (idx < 0) return;

  dragging = true;
  current = [idx];
  try { wheelWrap.setPointerCapture(e.pointerId); } catch(err){}
  renderSelection(true);
}, { passive:false });

wheelWrap.addEventListener('pointermove', function(e){
  if (!dragging) return;
  e.preventDefault();
  const p = localPoint(e);
  const idx = nearestTile(p.x, p.y);
  if (idx < 0) return;

  const last = current[current.length - 1];
  const prev = current[current.length - 2];

  if (idx === last) return;

  if (idx === prev){
    current.pop();
    sfx.pop();
    renderSelection(false);
    return;
  }
  if (current.indexOf(idx) !== -1) return;

  current.push(idx);
  renderSelection(true);
}, { passive:false });

function endDrag(){
  if (!dragging) return;
  dragging = false;
  submitWord();
}
wheelWrap.addEventListener('pointerup', endDrag);
wheelWrap.addEventListener('pointercancel', endDrag);
wheelWrap.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* =========================================================
   SUBMIT
   ========================================================= */
function submitWord(){
  const str = current.map(function(i){ return letters[i]; }).join('');

  if (str.length < 3){ clearSelection(); return; }

  const slot = slotIndex[str];

  if (slot && !slot.found){
    slot.found = true;
    slot.el.textContent = slot.word;          // restore full word if it was dotted
    slot.el.classList.remove('revealed');
    slot.el.classList.add('found');
    if (slot.grad) slot.el.classList.add(slot.grad);

    foundWords++;
    updateProgress();
    sfx.good();
    buzz(28);
    clearSelection();

    if (foundWords >= totalWords) win();
    return;
  }

  if (slot && slot.found){
    sfx.dup();
    centerWord.classList.add('bad');
    setTimeout(clearSelection, 200);
    return;
  }

  sfx.bad();
  centerWord.classList.add('bad');
  const flash = current.slice();
  setTimeout(function(){
    for (let i = 0; i < flash.length; i++){
      if (tileEls[flash[i]]) tileEls[flash[i]].classList.remove('on');
    }
    clearSelection();
  }, 260);
}

/* =========================================================
   HINT
   ========================================================= */
function useHint(){
  if (solved) return;
  ac();
  clearHintFlash();

  const remaining = [];
  for (let len in slotsByLen){
    const arr = slotsByLen[len];
    for (let i = 0; i < arr.length; i++){
      if (!arr[i].found) remaining.push(arr[i]);
    }
  }
  if (!remaining.length) return;

  hintsUsed++;
  sfx.hint();

  const slot = remaining[(Math.random() * remaining.length) | 0];
  const word = slot.word;

  if (!slot.revealed){
    slot.revealed = true;
    slot.el.textContent = word[0] + word.slice(1).replace(/./g, '·');
    slot.el.classList.add('revealed');
  }

  /* find wheel tiles matching each letter (first unused match) */
  const pool = [];
  for (let i = 0; i < letters.length; i++) pool.push(i);

  const needed = [];
  for (let k = 0; k < word.length; k++){
    const ch = word[k];
    for (let i = 0; i < pool.length; i++){
      if (letters[pool[i]] === ch){
        needed.push(pool[i]);
        pool.splice(i, 1);
        break;
      }
    }
  }

  for (let i = 0; i < tileEls.length; i++) tileEls[i].classList.add('dim');
  hintDimOn = true;

  let step = 0;
  function flashStep(){
    for (let i = 0; i < tileEls.length; i++) tileEls[i].classList.remove('hintflash');
    if (step >= needed.length){
      for (let i = 0; i < tileEls.length; i++) tileEls[i].classList.remove('dim');
      hintDimOn = false;
      hintTimer = null;
      return;
    }
    const idx = needed[step];
    if (tileEls[idx]) tileEls[idx].classList.add('hintflash');
    tone(700 + step * 80, 0.09, 'sine', 0.06);
    step++;
    hintTimer = setTimeout(flashStep, 260);
  }
  flashStep();
}

/* =========================================================
   TIMER
   ========================================================= */
function fmt(s){
  const m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
}

/* =========================================================
   WIN
   ========================================================= */
function win(){
  solved = true;
  const secs = Math.floor((Date.now() - startTime) / 1000);
  buzz([40, 60, 40, 60, 140]);
  sfx.win();

  let txt = totalWords + ' words  •  ' + fmt(secs);
  if (hintsUsed) txt += '  •  ' + hintsUsed + (hintsUsed > 1 ? ' hints' : ' hint');
  winStats.textContent = txt;

  for (let i = 0; i < tileEls.length; i++){
    (function(el){
      setTimeout(function(){
        el.classList.add('on');
        setTimeout(function(){ el.classList.remove('on'); }, 220);
      }, i * 70);
    })(tileEls[i]);
  }

  setTimeout(function(){ overlay.classList.add('show'); }, 800);
}

/* =========================================================
   NEW GAME
   ========================================================= */
function newGame(){
  overlay.classList.remove('show');
  solved = false;
  hintsUsed = 0;
  dragging = false;
  current = [];
  foundWords = 0;
  clearHintFlash();

  const puzzle = buildPuzzle();
  if (!puzzle){ setTimeout(newGame, 60); return; }

  letters = puzzle.letters.slice();      // always 7 letters
  const words = puzzle.words.slice();

  wordSet = Object.create(null);
  for (let i = 0; i < words.length; i++) wordSet[words[i]] = 1;

  shuffleLetters();                      // don't spell the pangram

  buildWheelTiles();
  buildSlots(words);

  totalWords = words.length;
  updateProgress();
  clearSelection();

  requestAnimationFrame(function(){
    layoutWheel();
    setTimeout(layoutWheel, 60);
  });

  startTime = Date.now();
}

/* =========================================================
   CONTROLS
   ========================================================= */
document.getElementById('hintBtn').addEventListener('click', useHint);

document.getElementById('shuffleBtn').addEventListener('click', function(){
  if (solved) return;
  ac();
  sfx.pop();
  clearHintFlash();
  clearSelection();
  shuffleLetters();
  layoutWheel();
});

document.getElementById('newBtn').addEventListener('click', function(){
  ac(); newGame();
});

document.getElementById('nextBtn').addEventListener('click', function(){
  ac(); newGame();
});

overlay.addEventListener('click', function(e){
  if (e.target === overlay) newGame();
});

/* =========================================================
   RESIZE
   ========================================================= */
if (window.ResizeObserver){
  new ResizeObserver(function(){ layoutWheel(); }).observe(wheelWrap);
}
window.addEventListener('orientationchange', function(){ setTimeout(layoutWheel, 260); });
window.addEventListener('resize', function(){ layoutWheel(); });

/* =========================================================
   GO
   ========================================================= */
newGame();

})();
</script>
